<script id="caseData" type="application/json">[{"name":"Equifax y Apache Struts","skill":"Triaje","year":"2017","lead":"Un portal para reclamar errores en historiales de crédito quedó expuesto. Reconstruid quién debía actuar, qué indicios había y qué prueba os permitiría cerrar el aviso.","photoCredit":"U.S. Government Accountability Office, GAO-18-559, pp. 11–13, detalle de la fig. 1, 2018. Composición y rótulos docentes.","photoSource":1,"refs":[{"author":"U.S. Government Accountability Office","title":"Data Protection: Actions Taken by Equifax and Federal Agencies in Response to the 2017 Breach, GAO-18-559","date":"2018","url":"https://www.gao.gov/assets/gao-18-559.pdf"},{"author":"National Institute of Standards and Technology","title":"National Vulnerability Database: CVE-2017-5638","date":"2017","url":"https://nvd.nist.gov/vuln/detail/CVE-2017-5638"},{"author":"Federal Trade Commission","title":"Equifax to Pay $575 Million as Part of Settlement with FTC, CFPB, and States Related to 2017 Data Breach","date":"2019","url":"https://www.ftc.gov/news-events/news/press-releases/2019/07/equifax-pay-575-million-part-settlement-ftc-cfpb-states-related-2017-data-breach"}],"steps":[{"title":"El servicio detrás del aviso","evidence":"Equifax recibía documentos para corregir errores en informes crediticios mediante un portal accesible desde internet.","ask":"¿Qué activo abriríais primero en el inventario?","options":["La web de empleo","El portal de reclamaciones","La herramienta de correo"],"correct":1,"explain":"Ahí coincidían el software afectado, el acceso público y la tramitación de documentos personales.","term":"Activo = recurso que una organización necesita proteger.","refs":[1],"type":"choice"},{"title":"Poned nombre al fallo","evidence":"El registro CVE-2017-5638 identifica una vulnerabilidad de determinadas versiones de Apache Struts, una pieza usada para construir aplicaciones web.","ask":"¿Qué dato local os permite decidir si el aviso se aplica?","options":["El número de empleados","La fecha de alta del dominio","La versión de Struts desplegada"],"correct":2,"explain":"Comparar la versión en uso con las afectadas permite establecer la aplicabilidad técnica.","term":"CVE = identificador público de una vulnerabilidad concreta.","refs":[1,2],"type":"choice"},{"title":"¿Quién tiene el encargo?","evidence":"Según Equifax, el aviso interno se distribuyó por una lista desactualizada. Quienes tenían que instalar la corrección quedaron fuera.","ask":"¿Qué cambio facilitaría que alguien se hiciera cargo?","options":["Vincular el portal a un equipo y exigir acuse","Ampliar la lista con toda la plantilla","Archivar el aviso en el portal interno"],"correct":0,"explain":"El vínculo entre el servicio y su responsable permite comprobar la recepción y escalar el encargo si falta respuesta.","term":"Responsable del activo = equipo que responde por ese servicio.","refs":[1],"type":"choice"},{"title":"El silencio del escáner","evidence":"Una revisión automática posterior al aviso no detectó la vulnerabilidad en el portal. El informe documenta que sí estaba presente.","ask":"¿Cómo registraríais ese resultado antes de verificar el despliegue?","options":["Portal corregido","Revisión sin hallazgo, pendiente de contraste","Aviso del fabricante retirado"],"correct":1,"explain":"La herramienta pudo pasar por alto el componente. El resultado necesita una segunda fuente sobre el portal real.","term":"Falso negativo = problema presente que una prueba pasa por alto.","refs":[1],"type":"choice"},{"title":"Las pruebas que faltan","evidence":"Supuesto docente. Un aviso está abierto. El desarrollo indica que actualizó el código, pero aún falta comprobar la aplicación que atiende al público.","ask":"Elegid dos pruebas que os ayuden a verificar qué está funcionando.","options":["Correo que solicita corregir","Inventario de la versión en producción","Número de seguidores del proyecto","Registro del despliegue en ese portal"],"correct":[1,3],"explain":"La configuración observada y el registro de instalación relacionan una versión con el servicio concreto.","term":"Producción = entorno que presta servicio a usuarios reales.","refs":[1],"type":"multi"},{"title":"Lo que quedó sin mirar","evidence":"Supuesto docente. De doce instancias del portal, solo nueve aportan una versión comprobada. Las otras tres siguen sin respuesta.","ask":"¿Qué porcentaje de las doce tiene versión comprobada?","options":[],"correct":75,"explain":"Dividid nueve entre doce. El 75 % describe la cobertura de la comprobación, con tres instancias pendientes.","term":"Instancia = copia de una aplicación que está funcionando.","refs":[1],"type":"number","unit":"%"},{"title":"Qué ocurrió primero","evidence":"El expediente distingue la alerta de marzo, el inicio de la extracción en mayo y dos hitos a finales de julio.","ask":"Ordenad los hitos históricos desde el primero.","options":["Aviso público sobre Struts","Inicio de la extracción de datos","Detección de la intrusión","Retirada del portal"],"correct":0,"explain":"La alerta fue en marzo, la extracción empezó el 13 de mayo, la detección ocurrió el 29 de julio y la retirada fue el día 30.","term":"Cronología = hechos ordenados por el momento en que ocurrieron.","refs":[1],"type":"order"},{"title":"Marzo y mayo","evidence":"Equifax comunicó un acceso no autorizado en marzo sin sustracción de datos en ese episodio. GAO describe otro incidente a partir del 13 de mayo.","ask":"¿Qué conclusión admite el expediente?","options":["En marzo ya consta la misma sustracción","Hay dos episodios documentados","Se identificó al mismo autor en ambos"],"correct":1,"explain":"El informe separa los episodios. Atribuirlos a las mismas personas exigiría pruebas adicionales.","term":"Atribución = identificación razonada de quién realizó una acción.","refs":[1],"type":"choice"},{"title":"Una alarma a oscuras","evidence":"Un certificado caducado impedía inspeccionar parte del tráfico cifrado. Al restablecer la inspección se identificaron señales de la intrusión.","ask":"¿Qué prueba vigilaría esa función?","options":["Abrir la web pública","Contar las visitas diarias","Comprobar que una señal de prueba llega al monitor"],"correct":2,"explain":"Una señal autorizada y conocida comprueba el recorrido de la detección de extremo a extremo.","term":"Certificado digital = credencial electrónica usada para establecer confianza.","refs":[1],"type":"choice"},{"title":"Las puertas interiores","evidence":"Según Equifax, había tres bases relacionadas con el portal y se llegó a otras cuarenta y ocho. La separación entre sistemas era insuficiente.","ask":"¿Qué decisión reduciría ese alcance en un diseño semejante?","options":["Limitar y comprobar las conexiones necesarias","Cambiar el logotipo del portal","Aumentar la retención de copias"],"correct":0,"explain":"Permitir únicamente las conexiones justificadas limita qué sistemas quedan al alcance de un servicio comprometido.","term":"Segmentación = separación entre sistemas que restringe su comunicación.","refs":[1],"type":"choice"},{"title":"Qué permisos sobran","evidence":"GAO recoge que aparecieron credenciales sin cifrar que daban acceso a más bases. Supuesto docente. Una cuenta de reclamaciones puede leer datos de otro servicio.","ask":"¿Qué dos tareas encargaríais?","options":["Revisar y recortar permisos innecesarios","Renovar las credenciales expuestas","Ocultar el nombre de la cuenta en el inventario","Dar el mismo acceso al relevo"],"correct":[0,1],"explain":"Revocar accesos sobrantes reduce el alcance. Renovar los secretos expuestos evita seguir confiando en ellos.","term":"Credenciales = información que permite acreditar una identidad al acceder.","refs":[1],"type":"multi"},{"title":"Una duda que merece urgencia","evidence":"Supuesto docente. El portal es público y recibe documentos sensibles. Falta confirmar la versión en una de sus copias.","ask":"¿Qué haríais mientras llega la comprobación?","options":["Cerrar por falta de confirmación","Asignar verificación urgente y valorar contención","Declarar sustracción confirmada"],"correct":1,"explain":"La exposición y el tipo de datos justifican actuar pronto. La copia pendiente mantiene abierta la incertidumbre.","term":"Contención = medida que limita temporalmente el daño posible.","refs":[1],"type":"choice"},{"title":"La cifra con apellido","evidence":"En 2019 la Comisión Federal de Comercio de EE. UU. situó en unos 147 millones las personas afectadas por la brecha.","ask":"¿Qué frase conserva la unidad y la precisión de la fuente?","options":["147 millones de contraseñas robadas","Exactamente 147 millones de cuentas","Unos 147 millones de personas afectadas"],"correct":2,"explain":"Personas, cuentas y credenciales son unidades diferentes. La fuente comunica una cifra aproximada.","term":"Persona afectada = individuo cuya información quedó expuesta en el incidente.","refs":[3],"type":"choice"},{"title":"Retirar el portal","evidence":"Tras detectar indicios el 29 de julio y observar más actividad, Equifax retiró el portal el 30 de julio.","ask":"¿Qué estado describe mejor esa retirada?","options":["Medida de contención aplicada","Recuperación definitivamente verificada","Todos los datos restituidos"],"correct":0,"explain":"Desconectar el servicio restringe la actividad en ese punto. La remediación y la investigación requieren pruebas propias.","term":"Remediación = corrección de la causa o debilidad identificada.","refs":[1],"type":"choice"},{"title":"Volver a aceptar reclamaciones","evidence":"Supuesto docente. El comité ha autorizado preparar el regreso de un portal de pruebas tras corregir su componente vulnerable.","ask":"Ordenad la comprobación propuesta antes de autorizar la reapertura.","options":["Identificar el despliegue que se va a validar","Confirmar la versión corregida en ese despliegue","Ensayar una reclamación ficticia y comprobar el registro","Documentar el resultado y autorizar el regreso"],"correct":0,"explain":"La prueba identifica el objetivo, verifica la corrección y comprueba el trámite completo antes de aprobar el regreso.","term":"Prueba funcional = comprobación de que el servicio sigue haciendo su trabajo.","refs":[1,2],"type":"order"},{"title":"La copia que sigue pendiente","evidence":"Supuesto docente. Dos instancias del portal están verificadas. Una tercera sigue aislada y pendiente de reparación. Mañana cambia el turno.","ask":"¿Qué anotaríais para la tercera?","options":["Incluirla en el cierre de las otras dos","Dejar responsable, aislamiento y fecha de revisión","Archivar solo el total del grupo"],"correct":1,"explain":"Identificar la excepción evita que vuelva al servicio sin reparación ni comprobación.","term":"Excepción = situación pendiente con responsable, condiciones y plazo de revisión.","refs":[1],"type":"choice"},{"title":"El parte para el relevo","evidence":"Supuesto docente. Se confirmó una copia vulnerable y se aisló. El equipo de guardia aún debe revisar registros y confirmar la versión reparada.","ask":"¿Qué resumen permite continuar el trabajo?","options":["Caso resuelto tras aislar la copia","Posible robo convertido en hecho confirmado","Copia aislada, investigación y verificación pendientes"],"correct":2,"explain":"El relevo necesita distinguir el hecho comprobado, la medida tomada y las tareas todavía abiertas.","term":"Triaje = primera evaluación que decide alcance, prioridad y siguiente acción.","refs":[1],"type":"choice"}],"illustration":"data:image/webp;base64,UklGRgDsAABXRUJQVlA4IPTrAAAQaAOdASriBOsCPmEulEekIiuho5IKGXAMCWdu/BmZxc5OjxbaU37s/w91vIfqD2p9IvlnwPjF/3er3t3yvenP3N7ZP9l6kv67/uvYL/yH+a8+D1LfvR6lf3j9Xf/yfvD74/716jn+S9MT1bf8D/6v/////hU/d/1lfWB/v/nr9f/0s/UH+of4D9dv658ZPif6p/aP7h/kP9N/fP/X67/ifzn9w/t/+Y/1X9x/+H+q+wr7T/wP755ufS/5n/o/6D/Nex/8e+zf4z+z/5H/gf3392Pi3/Of3b9vf7n6Z/lf7X/qP8H+4X+R+Qj8a/k394/sv+S/3f9x/dT7Afnv+f/nPxs8ijXP91/qv8t7AvrF9A/z39y/yX/r/yPo1f2v9+/er3O/U/7n/u/7t+5/+u////w/QH+Zf1P/b/3399/8v/////+Kf6/wWvzn/I/ab4Av5v/ef/J/nf9J+6P0s/1H/s/0v+s/cf3K/mX vRnWMO5AB+qoo4ETp9lgkudqiZbDtoCVAAAAAAAAAAAAAAAAAAAAAAA=="},{"name":"WannaCry en la sanidad inglesa","skill":"Prioridad y exposición","year":"2017","lead":"Una infección obligó a reorganizar citas y urgencias. Decidid qué servicios proteger primero y qué comunicar cuando los datos todavía están llegando.","photoCredit":"National Audit Office, Investigation: WannaCry cyber attack and the NHS, fig. 3, p. 17, 2017. Mapa de NAO con datos de NHS England. Rótulos docentes.","photoSource":1,"refs":[{"author":"National Audit Office","title":"Investigation: WannaCry cyber attack and the NHS, HC 414","date":"2017","url":"https://www.nao.org.uk/wp-content/uploads/2017/10/Investigation-WannaCry-cyber-attack-and-the-NHS.pdf"},{"author":"Microsoft","title":"Boletín de seguridad de Microsoft MS17-010: crítico","date":"2017","url":"https://learn.microsoft.com/es-es/security-updates/securitybulletins/2017/ms17-010"}],"steps":[{"title":"Cuando la agenda desaparece","evidence":"En mayo de 2017, WannaCry dejó a organizaciones sanitarias inglesas sin acceso a equipos. Algunas citas y operaciones se cancelaron.","ask":"¿Qué propiedad del servicio sufrió un daño directamente documentado?","options":["Confidencialidad de todas las historias","Disponibilidad de la atención","Exactitud de todos los diagnósticos"],"correct":1,"explain":"La imposibilidad de consultar información o prestar un servicio afecta a su disponibilidad. El informe recoge interrupciones concretas.","term":"Disponibilidad = poder utilizar un servicio cuando hace falta.","refs":[1],"type":"choice"},{"title":"El parche ya tenía fecha","evidence":"Microsoft publicó MS17-010 el 14 de marzo. NHS Digital emitió alertas el 17 de marzo y el 28 de abril. El ataque llegó el 12 de mayo.","ask":"Ordenad la secuencia de avisos y sucesos.","options":["Publicación del boletín de Microsoft","Primera alerta de NHS Digital","Segunda alerta de NHS Digital","Comienzo de la interrupción"],"correct":0,"explain":"El aviso técnico y sus recordatorios precedieron al incidente. Entre alertar y corregir hay trabajo local que verificar.","term":"Parche = actualización destinada a corregir un defecto del software.","refs":[1,2],"type":"order"},{"title":"El sospechoso de siempre","evidence":"NHS Digital explicó que la mayoría de los dispositivos infectados usaban Windows 7 con soporte, pero sin el parche. Algunos equipos empleaban Windows XP.","ask":"¿Qué grupo entraría en vuestra primera búsqueda de exposición?","options":["Solo los equipos con Windows XP","Solo equipos sin soporte comercial","Equipos vulnerables sin la actualización aplicable"],"correct":2,"explain":"La edición del sistema ayuda a localizar candidatos. Conviene comprobar qué corrección necesitan y si la tienen instalada.","term":"Soporte = periodo en que el fabricante mantiene un producto conforme a sus condiciones.","refs":[1,2],"type":"choice"},{"title":"Cuántas organizaciones sufrieron impacto","evidence":"NAO contabilizó 34 organizaciones gestoras del NHS con dispositivos bloqueados y otras 46 con interrupciones sin infección. En Inglaterra había 236 de estas entidades.","ask":"¿Cuántas figuran afectadas como mínimo en esas dos categorías?","options":[],"correct":80,"explain":"Los dos grupos son distintos. Treinta y cuatro más cuarenta y seis suman ochenta organizaciones gestoras.","term":"NHS trust = entidad del sistema sanitario inglés que gestiona uno o varios servicios.","refs":[1],"type":"number","unit":"organizaciones"},{"title":"El otro color del mapa","evidence":"El mapa oficial distingue organizaciones con infección y organizaciones que sufrieron interrupciones por otros motivos, incluidos cierres preventivos.","ask":"¿Qué conclusión permite leer esa leyenda?","options":["Cada marca equivale a un hospital infectado","Un servicio puede detenerse sin infección local","El color mide el número de pacientes"],"correct":1,"explain":"La leyenda clasifica organizaciones por tipo e impacto. No muestra pacientes ni el número de equipos por ubicación.","term":"Dependencia = servicio o recurso que otro necesita para funcionar.","refs":[1],"type":"choice"},{"title":"Un indicio con dos explicaciones","evidence":"Otras 21 entidades contactaron con un dominio asociado a WannaCry sin quedar bloqueadas. El informe recoge dos explicaciones posibles.","ask":"¿Qué interpretaciones conservó la investigación?","options":["Investigación defensiva del dominio","Infección posterior a la activación del freno","Pago confirmado de rescate","Robo acreditado de historias"],"correct":[0,1],"explain":"Un contacto aislado era compatible con una consulta defensiva o con infección sin bloqueo. El contexto permite distinguirlas.","term":"Dominio = nombre que identifica un destino de internet.","refs":[1],"type":"multi"},{"title":"Elegid qué proteger primero","evidence":"Supuesto docente. Dos equipos pendientes del mismo parche. Uno mantiene hoy la admisión de urgencias y está expuesto. El otro está desconectado, inventariado y guardado.","ask":"Solo podéis comenzar una intervención. ¿Dónde concentraríais primero la protección?","options":["Equipo de admisión, con coordinación clínica","Equipo guardado, porque es más rápido","Los dos tienen igual prioridad en este contexto"],"correct":0,"explain":"La exposición actual y la dependencia asistencial justifican proteger primero admisión, con una alternativa para mantenerla operativa.","term":"Exposición = posibilidad de que una amenaza alcance a un recurso.","refs":[1],"type":"choice"},{"title":"Cuando el fabricante tiene que intervenir","evidence":"NAO identificó equipos médicos con software integrado difícil de actualizar. Supuesto docente. El fabricante de un equipo de imagen aún debe validar el cambio.","ask":"¿Qué decisión conserva la atención y reduce la exposición?","options":["Dejar el dispositivo pendiente sin plazo","Coordinar aislamiento probado y seguimiento clínico","Aplicar un cambio sin comprobar su efecto asistencial"],"correct":1,"explain":"Una medida temporal acordada limita la exposición. Debe verificarse y tener responsable y fecha para la solución definitiva.","term":"Control compensatorio = protección alternativa mientras llega el arreglo definitivo.","refs":[1],"type":"choice"},{"title":"Protección con fecha de caducidad","evidence":"Supuesto docente. Un aislamiento temporal protege un puesto clínico vulnerable. Un traslado a otra sala podría cambiar su conexión.","ask":"Elegid dos comprobaciones que harían creíble la medida.","options":["Guardar únicamente el modelo del puesto","Verificar la restricción en su ubicación real","Fijar responsable y fecha de revisión","Cerrar el asunto al recibir la propuesta"],"correct":[1,2],"explain":"Una prueba local muestra que la restricción funciona. La revisión reduce el riesgo de que un traslado la vuelva inútil.","term":"Excepción temporal = desviación autorizada y limitada que debe revisarse.","refs":[1],"type":"multi"},{"title":"Si el correo también cae","evidence":"Algunas organizaciones apagaron el correo por precaución. Durante la respuesta se usaron llamadas telefónicas para contactar con equipos directivos.","ask":"¿Qué previsión podríais ensayar antes de otro incidente?","options":["Enviar los contactos solo al correo corporativo","Esperar a que se recupere la agenda digital","Probar un canal alternativo y contactos actualizados"],"correct":2,"explain":"Un canal diferente y comprobado ayuda a coordinar decisiones cuando el principal está fuera de servicio.","term":"Canal alternativo = vía distinta para coordinarse si la habitual falla.","refs":[1],"type":"choice"},{"title":"Citas contadas y citas estimadas","evidence":"NHS England identificó 6.912 citas anuladas. Al estimar las revisiones no contabilizadas, situó el total aproximado en 19.494.","ask":"¿Cómo explicaríais estas cifras a dirección?","options":["Un recuento parcial y una estimación más amplia","Dos grupos independientes que se suman","Dos recuentos exactos de hospitales distintos"],"correct":0,"explain":"Las 6.912 forman parte del impacto que pretende reflejar la estimación total. Sumarlas duplicaría parte del impacto.","term":"Estimación = aproximación calculada cuando el recuento completo falta.","refs":[1],"type":"choice"},{"title":"Urgencias y el dato ausente","evidence":"Cinco servicios de urgencias desviaron pacientes. El informe señala que no se recogió cuántas ambulancias o personas fueron desviadas.","ask":"¿Qué escribiríais en un parte inicial?","options":["Cinco ambulancias fueron desviadas","Cinco servicios desviaron pacientes, cantidad sin determinar","Una persona fue desviada por centro"],"correct":1,"explain":"La fuente identifica los servicios que tuvieron que derivar. El volumen de pacientes y ambulancias sigue sin determinarse.","term":"Derivación = envío de una persona a otro servicio para que reciba atención.","refs":[1],"type":"choice"},{"title":"Medir la protección local","evidence":"Supuesto docente. De veinte puestos expuestos, dieciséis tienen el parche verificado y cuatro siguen pendientes. Todos pertenecen al mismo servicio.","ask":"¿Qué porcentaje tiene parche verificado?","options":[],"correct":80,"explain":"Dieciséis dividido entre veinte da 0,8. El dato describe cobertura verificada en esos veinte puestos.","term":"Cobertura = proporción del conjunto que cumple el criterio medido.","refs":[1,2],"type":"number","unit":"%"},{"title":"Aceptación desde el mostrador","evidence":"Supuesto docente. El equipo técnico corrigió un puesto de admisión y comprobó la versión. Falta validar la atención tras el cambio.","ask":"¿Qué prueba haríais con personal autorizado?","options":["Comprobar solo que luce el piloto","Contar el número de equipos del turno","Registrar una admisión ficticia y localizarla después"],"correct":2,"explain":"El recorrido funcional verifica que el trabajo clínico acordado vuelve a completarse. Deben usarse datos de prueba.","term":"Prueba de aceptación = comprobación de que el servicio permite realizar el trabajo previsto.","refs":[1],"type":"choice"},{"title":"Qué se sabe de la confidencialidad","evidence":"NHS Digital indicó que creía que no se habían comprometido ni robado datos de pacientes. Las organizaciones no comunicaron esos casos en los canales descritos.","ask":"¿Qué afirmación respeta esa evidencia?","options":["No se notificó sustracción de datos de pacientes","Se confirmó robo masivo de historiales","Se certificó la ausencia absoluta de cualquier acceso"],"correct":0,"explain":"La interrupción está documentada. La fuente atribuye la valoración sobre datos a NHS Digital y a lo notificado.","term":"Confidencialidad = acceso a la información limitado a quienes están autorizados.","refs":[1],"type":"choice"},{"title":"Una nueva guardia","evidence":"Supuesto docente. Admisión funciona tras el cambio. El equipo de imagen sigue aislado, pendiente de validación del fabricante. La guardia necesita saber qué cuidar.","ask":"¿Qué instrucción sirve para el relevo?","options":["Marcar todo el servicio como terminado","Mantener el aislamiento y revisar con ingeniería clínica","Aplicar al equipo de imagen el cambio de admisión"],"correct":1,"explain":"Son activos distintos con estados distintos. El relevo debe conocer qué medida continúa, quién decide y cuándo se revisa.","term":"Riesgo residual = riesgo que permanece después de aplicar medidas.","refs":[1],"type":"choice"},{"title":"La prioridad que podéis defender","evidence":"Supuesto docente. En vuestro plan quedaron tres datos por puesto: exposición, servicio que depende de él y prueba de protección.","ask":"¿Qué resumen justificaría el orden de trabajo ante dirección?","options":["Se empezó por los equipos cuyo nombre se conocía","Se siguió únicamente el año de compra","Se protegió antes la atención expuesta y se comprobó el resultado"],"correct":2,"explain":"La prioridad combina posibilidad de alcance, consecuencia para la atención y evidencia de que la medida funciona.","term":"Prioridad = orden de actuación razonado con el contexto ra medible justifica abrir una investigación. El alcance y la autoría requieren otras pruebas.","term":"Acceso remoto = uso autorizado de un equipo a través de una conexión de red.","refs":[5],"type":"choice"},{"title":"Localizad las entregas señaladas","evidence":"El proyecto XZ identificó dos archivos de distribución manipulados, ambos de la serie 5.6. En su aviso se especifican los números completos.","ask":"¿Qué dos versiones cita el proyecto?","options":["5.4.6","5.6.0","5.6.1","5.6.2"],"correct":[1,2],"explain":"El aviso señala los archivos publicados como 5.6.0 y 5.6.1. Compartir los primeros dígitos no basta para añadir una versión al caso.","term":"Archivo de distribución = paquete que el proyecto prepara para entregar una versión del software.","refs":[1],"type":"multi"},{"title":"La receta y la caja que llegó","evidence":"Red Hat explicó que el paquete publicado y el repositorio de código diferían en un elemento relevante para el incidente.","ask":"Vais a investigar qué recibió una organización. ¿Qué pieza buscaríais primero?","options":["Una copia actual de la página inicial del proyecto","El paquete exacto entregado, junto con su procedencia","Una reseña del proyecto escrita años antes"],"correct":1,"explain":"La copia exacta permite comprobar lo que llegó. El repositorio conserva el trabajo de desarrollo y sirve para comparar después.","term":"Repositorio = lugar que guarda los archivos de un proyecto y su historial de cambios.","refs":[1,2],"type":"choice"},{"title":"¿A qué equipo le toca?","evidence":"Red Hat declaró que Red Hat Enterprise Linux quedaba fuera de este fallo y advirtió sobre Fedora Rawhide. Supuesto de aula. Un equipo usa Rawhide y otro usa Enterprise Linux con paquetes oficiales.","ask":"¿Qué dato consultaríais primero en el equipo con Rawhide?","options":["El fabricante de la pantalla","La fecha de adquisición del teclado","La edición y la versión completa del paquete instalado"],"correct":2,"explain":"La edición, el origen y la versión permiten contrastar la instalación con la advertencia del distribuidor.","term":"Distribución = edición de Linux que una organización empaqueta, actualiza y mantiene.","refs":[2,3],"type":"choice"},{"title":"Leed una huella con contexto","evidence":"Supuesto de aula. La huella SHA-256 del archivo recibido coincide con la referencia publicada para una entrega que el proyecto después declaró manipulada.","ask":"¿Qué conclusión permite esa coincidencia?","options":["La copia coincide con esa entrega manipulada","La copia es segura porque coincide","La coincidencia revela quién utilizó la copia"],"correct":0,"explain":"Una huella relaciona dos contenidos. Si la referencia corresponde a material manipulado, coincidir con ella sirve para reconocerlo.","term":"SHA-256 = función que calcula una huella digital de 256 bits a partir del contenido de un archivo.","refs":[1,4],"type":"choice"},{"title":"El sello estaba donde debía","evidence":"El aviso del proyecto confirma que las dos entregas manipuladas estaban firmadas. La firma se podía verificar.","ask":"¿Qué os permite sostener una verificación con la clave de confianza esperada?","options":["Que alguien revisó cada línea del programa","Que la clave correspondiente firmó ese contenido","Que la persona que figura como titular trabajó sola"],"correct":1,"explain":"La firma vincula el contenido con una clave. La seguridad del contenido y la identidad de las personas que intervinieron requieren comprobaciones independientes.","term":"Firma digital = comprobación criptográfica que vincula unos datos con la clave que los firmó.","refs":[1,2],"type":"choice"},{"title":"Qué conviene conservar","evidence":"Supuesto de aula. Se va a retirar una copia señalada. El equipo de respuesta dispone de un espacio aislado, con acceso restringido, para conservar evidencias.","ask":"¿Qué dos elementos permitirán reconstruir la decisión de retirada?","options":["La copia identificada y su huella","Una captura del fondo de escritorio","El origen, la fecha de recepción y quién custodió la copia","El modelo del ratón"],"correct":[0,2],"explain":"El objeto preservado y su historial permiten que otra persona revise después qué se examinó y de dónde procedía.","term":"Custodia = registro de quién conservó una evidencia y cómo se protegió durante su manejo.","refs":[1,4],"type":"multi"},{"title":"Contad equipos, no pantallas","evidence":"Supuesto de aula. Hay cuatro fichas. Norte tiene 5.6.0, Sur tiene 5.6.1, Este tiene 5.4.6 y Oeste aún no ha informado. Norte aparece además en una captura duplicada.","ask":"¿Cuántos equipos distintos muestran una de las dos versiones señaladas?","options":[],"correct":2,"explain":"Norte y Sur requieren contraste con su distribuidor. Oeste queda pendiente y el duplicado de Norte no añade otro equipo.","term":"Inventario = lista de activos identificados que permite saber qué existe y qué versión tiene.","refs":[1,3],"type":"number","unit":"equipos"},{"title":"Leed la letra pequeña del proveedor","evidence":"El 30 de marzo Red Hat indicó que Fedora 40 beta contenía dos paquetes afectados. En ese momento no parecía que la manipulación surtiera efecto en esas compilaciones y aconsejó volver a 5.4.x.","ask":"¿Qué pondríais en la ficha de esa edición?","options":["Todos sus equipos sufrieron intrusiones","Pueden seguir sin revisión porque es una beta","Paquetes identificados, efecto no demostrado y retirada aconsejada"],"correct":2,"explain":"La indicación del proveedor distingue el contenido del paquete, su posible efecto y la medida defensiva.","term":"Compilación = resultado de convertir el código del proyecto en software listo para una plataforma concreta.","refs":[2],"type":"choice"},{"title":"Reconstruid el calendario","evidence":"Red Hat publicó su alerta el 29 de marzo. CERT-EU publicó la primera versión de su aviso el 30 de marzo y la revisó el 2 de abril. XZ anunció entregas limpias el 29 de mayo.","ask":"Ordenad los hitos desde el primero hasta el último.","options":["Alerta de Red Hat","Primer aviso de CERT-EU","Revisión del aviso europeo","Anuncio de entregas limpias de XZ"],"correct":0,"explain":"Fechar el expediente ayuda a explicar por qué se tomaron unas decisiones en marzo y se pudieron tomar otras en mayo.","term":"Historial de revisiones = lista fechada de cambios hechos en un documento o aviso.","refs":[1,2,3],"type":"order"},{"title":"Qué se revisa primero","evidence":"CERT-EU aconsejó dar prioridad a equipos accesibles desde Internet. Supuesto de aula. Dos servidores con una versión señalada sostienen servicios de importancia comparable. Uno admite conexiones desde Internet y el otro está aislado.","ask":"Si solo podéis iniciar una revisión ahora, ¿por dónde empezáis?","options":["Por el servidor accesible desde Internet","Por el que tiene un nombre más corto","Por el aislado, porque está más cerca"],"correct":0,"explain":"Con las demás condiciones iguales, la exposición externa inclina la prioridad. El segundo servidor conserva su turno y su responsable.","term":"Exposición = posibilidad de llegar a un activo desde una vía de acceso determinada.","refs":[3],"type":"choice"},{"title":"Un cambio que se pueda deshacer","evidence":"Supuesto de aula. El distribuidor ha publicado la versión aprobada para este equipo. Hay una ventana de mantenimiento y una copia de recuperación verificada.","ask":"¿Qué cambio deja un punto de retorno claro?","options":["Borrar primero todo el histórico","Anotar el estado, aplicar la versión aprobada y comprobar el servicio","Instalar cualquier paquete que se llame XZ"],"correct":1,"explain":"La ficha debe identificar el estado anterior, el destino aprobado y las comprobaciones que determinan si se conserva o se revierte el cambio.","term":"Ventana de mantenimiento = período acordado en el que se puede intervenir con un impacto previsto en el servicio.","refs":[2,3],"type":"choice"},{"title":"Una biblioteca que sigue en memoria","evidence":"Supuesto de aula. El inventario ya muestra la versión aprobada en disco. La herramienta de diagnóstico del distribuidor indica que un servicio del ejercicio aún conserva cargada la biblioteca anterior.","ask":"¿Qué falta para verificar la corrección de este servicio?","options":["Cambiar de color la ficha del inventario","Reenviar el aviso público","Aplicar el procedimiento acordado y comprobar qué versión está en uso"],"correct":2,"explain":"El archivo instalado y el componente que un servicio mantiene en memoria pueden diferir. Hay que confirmar el estado tras la intervención.","term":"Biblioteca = conjunto de funciones que otros programas cargan para realizar tareas.","refs":[2,3],"type":"choice"},{"title":"Un entorno sin respuesta","evidence":"Supuesto de aula. Se revisaron ocho instalaciones previstas. Seis aportan evidencias válidas de corrección y dos solo tienen una solicitud enviada a su responsable.","ask":"¿Qué porcentaje del total previsto tiene corrección verificada?","options":[],"correct":75,"explain":"Seis dividido por ocho equivale al 75 %. Las dos solicitudes siguen abiertas hasta disponer de evidencia.","term":"Cobertura de verificación = proporción de activos previstos para los que ya hay una comprobación válida.","refs":[2,3],"type":"number","unit":"%"},{"title":"Decidid qué pedir al proveedor","evidence":"Supuesto de aula. Un tercero gestiona una aplicación que usa componentes de compresión. En respuesta al aviso os escribe solamente «todo está al día».","ask":"¿Qué respuesta os permitiría evaluar vuestra instalación?","options":["Inventario del componente, origen del paquete y resultado fechado de la comprobación","Una copia de su logotipo","Una valoración general de la reputación de Linux"],"correct":0,"explain":"Un tercero puede justificar la aplicabilidad con datos del servicio concreto y con el aviso de su distribuidor.","term":"Dependencia = componente que un programa necesita para realizar parte de su trabajo.","refs":[1,2,3],"type":"choice"},{"title":"La firma y la atribución","evidence":"El proyecto identificó cómo se firmaron las entregas. Ese dato, por sí solo, no establece la identidad civil, el patrocinio o la motivación de quienes participaron.","ask":"¿Qué afirmación publicaríais en un resumen interno?","options":["La nacionalidad de la persona ya está demostrada","El proyecto identificó la clave firmante de las entregas señaladas","El nombre de la cuenta revela quién financió la operación"],"correct":1,"explain":"Una clave y una cuenta aportan evidencia técnica delimitada. Vincularlas a personas u organizaciones exige investigación adicional.","term":"Atribución = evaluación de quién está detrás de un hecho, apoyada en evidencias y con sus límites explícitos.","refs":[1],"type":"choice"},{"title":"Entregad un cierre que aguante","evidence":"Supuesto de aula. El servidor expuesto ya usa la versión aprobada y el servicio pasa su prueba. Un equipo de pruebas continúa sin respuesta y tiene responsable asignado.","ask":"¿Qué entrega refleja el estado del expediente?","options":["Cerrar todos los equipos por similitud","Esperar en silencio hasta completar todo","Cerrar el servidor con evidencias y dejar el otro pendiente con responsable y plazo"],"correct":2,"explain":"La decisión se documenta por activo. La comprobación del servicio, la referencia utilizada y el seguimiento del pendiente hacen el relevo verificable.","term":"Evidencia de cierre = dato guardado que permite comprobar qué se corrigió y con qué resultado.","refs":[1,2,3],"type":"choice"}],"illustration":"data:image/webp;base64,UklGRpZIAABXRUJQVlA4IIpIAABQYAGdASrdBL4BPmEwlEgkIqkhIjI5SSAMCWlu/CHZ4su6/g8/7PfKP6Ds6Zb9d/l/PRuj+L/rG/zGM7B/3n9l/qntD/sftz/Nn99/P/6Av0r/XDsKf0f0Afrn+zv/s+Hj/g/qr7of7b6gH9H/1H//9rD/sewf+6/sC/uh6uv/L/dP4Qv7D/zf3k+Bb9jP//7AH//4HPxR/TPxN97fxT88/rn9h/vv+S/uX/l/xfuP+G/Nf2H+5fs5/cP/j/tvkqzJ+g/y/+M9Ev4x9bvun9k/yH+k/vn7ffE3+C/vH7cf3r9OfaP8i/Yf85+Yn+L+QX8Z/kf92/uX7T/3T91vdX2c2s/6n/g+oL61/P/8V/iP87/0P7/+8XtTf5v9/9Rvzz+5f5L7iPsA/j/8+/0398/eD/Hf///8/d3+Y/7ni+/jf9h/yP9V8AX8 ión recibida.","refs":[1,2],"type":"choice"},{"title":"Qué vieron los investigadores","evidence":"Mandiant observó robo de datos en incidentes de MOVEit Transfer que investigó. CL0P, un grupo asociado a la extorsión, reivindicó la campaña.","ask":"¿Qué describiría con precisión estos casos documentados?","options":["Robo de archivos en incidentes investigados","Cifrado demostrado en cada organización que usa MOVEit","Interrupción de todos los servicios de transferencia del mundo"],"correct":0,"explain":"Las observaciones se refieren a los incidentes investigados. El nombre de un grupo no demuestra qué le ocurrió a una organización concreta.","term":"Exfiltración = salida de datos sin autorización hacia quien los obtiene.","refs":[1,3],"type":"choice"},{"title":"Cuatro fechas y cuatro verbos","evidence":"Mandiant documentó actividad desde el 27 de mayo. CISA incorporó el fallo a su catálogo el 2 de junio. El boletín conjunto se publicó el 7 y se revisó el 16 de junio.","ask":"Ordenad los hechos que documenta el expediente.","options":["Primera actividad en los casos citados","Entrada en el catálogo de CISA","Publicación del aviso conjunto","Revisión del aviso conjunto"],"correct":0,"explain":"Actividad observada, inclusión en catálogo, publicación y revisión son hechos diferentes. Una fecha de publicación no fija el comienzo de toda una campaña.","term":"Catálogo KEV = lista de CISA de vulnerabilidades con evidencia de explotación real.","refs":[1,3],"type":"order"},{"title":"Una reivindicación en la red","evidence":"Mandiant indicó que el 6 de junio el sitio de filtraciones de CL0P reivindicó la actividad. El 7 de junio el FBI y CISA publicaron su evaluación sobre la campaña.","ask":"¿Cómo recogéis ambas afirmaciones sin mezclarlas?","options":["La banda demostró que había robado datos a nuestro centro","Una reivindicación anónima demuestra todos los detalles","El grupo se atribuyó la actividad y las agencias publicaron su propia evaluación"],"correct":2,"explain":"Nombrar quién dijo cada cosa permite distinguir las declaraciones del grupo y el análisis público de los organismos.","term":"Sitio de filtraciones = página en la que un grupo publica amenazas, reivindicaciones o datos sustraídos.","refs":[1,3],"type":"choice"},{"title":"Proveedor en la lista","evidence":"Supuesto de aula. Un proveedor confirma que utilizaba MOVEit Transfer. Aún no ha delimitado las fechas, los clientes o los archivos afectados.","ask":"¿Qué estado asignáis a la información de vuestra organización?","options":["Exposición por investigar con el proveedor","Robo local confirmado","Caso descartado por tratarse de un tercero"],"correct":0,"explain":"El vínculo con el proveedor justifica investigar. Para confirmar impacto sobre datos propios se necesitan evidencias adicionales.","term":"Alcance = conjunto de sistemas, datos, personas o períodos a los que llega un hecho comprobado.","refs":[1,3],"type":"choice"},{"title":"La consulta que sí sirve","evidence":"Supuesto de aula. El proveedor ha designado un canal autenticado para consultas de clientes. Podéis pedirle información acotada a vuestro servicio.","ask":"¿Qué dos peticiones ayudan a delimitar vuestro caso?","options":["La lista completa de otros clientes","El servicio y período que está revisando para vuestra cuenta","Los teléfonos particulares de su plantilla","El resultado para vuestros datos y la evidencia disponible"],"correct":[1,3],"explain":"La consulta debe identificar la cuenta, el período y la evidencia relevante sin reclamar datos de otras entidades.","term":"Canal autenticado = vía que permite comprobar con quién se está intercambiando información.","refs":[1,2],"type":"multi"},{"title":"Un mensaje solo para dos personas","evidence":"Supuesto de aula. En una reunión reciben una nota TLP:RED dos personas identificadas. Una tercera persona del mismo departamento la pide para estar al día.","ask":"¿Qué hacéis ante esa solicitud?","options":["Reenviar porque pertenece al departamento","Publicar una captura en el chat de equipo","Pedir autorización expresa a la fuente antes de ampliar los destinatarios"],"correct":2,"explain":"TLP:RED limita la información a los destinatarios concretos. La curiosidad de un compañero no amplía ese permiso.","term":"TLP:RED = información limitada a las personas destinatarias concretas, sin difusión posterior.","refs":[2],"type":"choice"},{"title":"Un contrato no amplía el permiso","evidence":"Supuesto de aula. Un informe TLP:AMBER+STRICT llega a vuestra organización. Un proveedor externo con contrato necesita un dato de ese informe para ayudar.","ask":"¿Cuál es la siguiente gestión?","options":["Enviar el informe porque el proveedor firmó contrato","Solicitar a la fuente permiso expreso para esa difusión adicional","Quitar la etiqueta antes del reenvío"],"correct":1,"explain":"AMBER+STRICT limita el uso compartido a quienes necesiten conocer la información dentro de la organización receptora. El contrato por sí solo no cambia esa marca.","term":"TLP:AMBER+STRICT = difusión limitada, por necesidad de conocer, a la propia organización receptora.","refs":[1,2],"type":"choice"},{"title":"El cliente que debe protegerse","evidence":"Supuesto de aula. Una alerta TLP:AMBER no lleva restricciones adicionales. Un cliente vuestro necesita ese dato para protegerse. Un periodista también solicita una copia.","ask":"¿A quién alcanza el permiso de TLP en este supuesto?","options":["Al cliente que lo necesita para protegerse","Al periodista por informar al público","A cualquier persona que mencione el caso"],"correct":0,"explain":"AMBER permite compartir por necesidad de conocer dentro de la organización y con clientes que necesiten protegerse. Para otros destinatarios se consulta a la fuente.","term":"TLP:AMBER = difusión por necesidad de conocer dentro de la organización y entre sus clientes que deban protegerse.","refs":[2],"type":"choice"},{"title":"Un grupo cerrado tampoco basta","evidence":"Supuesto de aula. La fuente marca TLP:GREEN una nota para la comunidad de respuesta de un sector. Hay un foro abierto y un canal de esa comunidad con miembros verificados.","ask":"¿Dónde encaja la nota según la marca?","options":["En el foro abierto, si no se menciona al autor","En cualquier grupo privado de mensajería","En el canal verificado de la comunidad pertinente"],"correct":2,"explain":"GREEN permite compartir dentro de la comunidad pertinente. Un grupo privado de personas ajenas o un foro público quedan fuera.","term":"TLP:GREEN = información compartible dentro de la comunidad pertinente, fuera de canales públicos.","refs":[2],"type":"choice"},{"title":"Urgencia y destinatarios","evidence":"Supuesto de aula. Un boletín público TLP:CLEAR requiere una actuación urgente. Una minuta interna TLP:RED contiene un detalle de investigación sin acción inmediata.","ask":"¿Qué documento atenderíais primero para ejecutar la medida urgente?","options":["La minuta, porque el rojo siempre significa mayor severidad","El boletín público, por la acción urgente que contiene","Ninguno hasta que tengan la misma marca"],"correct":1,"explain":"La marca TLP orienta la difusión. La urgencia operativa se decide según el contenido, la exposición y los plazos.","term":"Severidad = medida de la gravedad potencial del problema técnico.","refs":[1,2],"type":"choice"},{"title":"Preparad una nota pública","evidence":"Supuesto de aula. La organización autoriza publicar el servicio en revisión y el canal oficial de consultas. La relación de afectados se está comprobando y el anexo de personas sigue restringido.","ask":"¿Qué dos elementos incluiríais en la nota autorizada?","options":["El servicio en revisión","La lista nominal provisional","El canal oficial de consultas","La identidad de quien dio el aviso interno"],"correct":[0,2],"explain":"El servicio y el canal están autorizados y ayudan a las personas destinatarias. El anexo y las identidades quedan fuera de esta nota.","term":"Minimización = usar y comunicar solo los datos necesarios para un fin concreto.","refs":[1,2],"type":"multi"},{"title":"Tres registros para dos archivos","evidence":"Supuesto de aula. Los registros validados muestran dos descargas no autorizadas del archivo A y una del archivo B. No hay evidencia adicional sobre el C.","ask":"¿Cuántos archivos distintos podéis confirmar en ese recuento?","options":[],"correct":2,"explain":"A y B suman dos archivos distintos en tres descargas. La ausencia de evidencia sobre C no permite asegurar qué ocurrió con él.","term":"Registro de actividad = anotación fechada de una operación observada por un sistema.","refs":[1,3],"type":"number","unit":"archivos"},{"title":"Borrar nombres no da permiso","evidence":"Supuesto de aula. Un borrador TLP:AMBER+STRICT ya no contiene nombres. Se quiere usar parte de esa información en la web pública.","ask":"¿Qué falta antes de incorporar ese contenido?","options":["La autorización expresa de la fuente para ampliar la difusión","Cambiar los nombres por números","Guardar el borrador con otro nombre de archivo"],"correct":0,"explain":"Eliminar identificadores puede reducir exposición, pero el ámbito de difusión lo establece la fuente. La publicación exige autorización adicional.","term":"Desidentificación = eliminación o modificación de elementos que permiten identificar a una persona o entidad.","refs":[1,2],"type":"choice"},{"title":"Un relevo con hora y responsable","evidence":"Supuesto de aula. A las 14:00 enviáis un aviso a clientes autorizados. Operaciones validará el estado a las 16:30. Comunicación ha acordado emitir la siguiente actualización a las 17:00, hora local.","ask":"¿En qué orden completaríais el relevo?","options":["Registrar qué versión se envió y a quién","Recoger la validación de Operaciones a las 16:30","Emitir a las 17:00 la actualización acordada"],"correct":0,"explain":"El registro evita confundir versiones. La revisión técnica alimenta el siguiente aviso incluso si persisten incógnitas.","term":"Registro de comunicaciones = historial de mensajes con versión, hora, destinatarios y responsables.","refs":[1,2],"type":"order"},{"title":"El boletín que cambió después","evidence":"El 16 de junio las agencias reeditaron el aviso. Indicaron que retiraban antiguas direcciones de la campaña de GoAnywhere y añadían otras. El documento también trata MOVEit.","ask":"¿Qué haríais con un informe basado en la versión anterior?","options":["Afirmar que todas las direcciones antiguas eran de MOVEit","Revisar qué datos y conclusiones dependen de la lista que cambió","Borrar el historial y conservar solo el último texto"],"correct":1,"explain":"Se contrasta el cambio con las conclusiones que dependían de él y se avisa a quienes recibieron información ya corregida.","term":"Indicador = dato observable que ayuda a investigar una actividad y debe interpretarse en su contexto.","refs":[1],"type":"choice"},{"title":"Qué les vais a decir a las cinco","evidence":"Supuesto de aula. Se ha confirmado que el proveedor gestiona el servicio. El alcance sobre archivos propios sigue en revisión. Se autoriza comunicar esos hechos, el canal oficial y la próxima actualización a las 17:00.","ask":"¿Qué versión enviaríais a los clientes?","options":["Todos vuestros archivos fueron robados","Está todo resuelto y no hace falta seguimiento","Revisamos con el proveedor qué archivos pudieron verse afectados. Usad el canal oficial. Actualizaremos a las 17:00"],"correct":2,"explain":"La nota comunica lo confirmado, la incertidumbre y el siguiente compromiso. La hora y la autorización pertenecen al ejercicio de aula.","term":"Actualización de situación = mensaje fechado que recoge hechos confirmados, asuntos pendientes y el siguiente punto de información.","refs":[1,2,3],"type":"choice"}],"illustration":"data:image/webp;base64,UklGRgjaAABXRUJQVlA4IPzZAACQ/AKdASriBJQBPmEskkckIiYjJJR7cMAMCWdu+yFIO2n4eW2NX/sr0NcUdQ5tfoN6tflg8K+ykZTWuEwGRXLkf9u/1u3AWBk4X/Znoe9DD2Bj6ZH2A9d/u/5j1IeT/Fx+TxD7k8997r/t+vHcWedvzSui36uWnJ/QH9Z/vX6ye+r47+1/2/+ ara saber si os toca actuar?","options":["Si alguien compartió el aviso en vuestras redes","Qué componente describe Apache y dónde lo usáis","Si consta alguna caída del servicio"],"correct":1,"explain":"Apache identifica el componente afectado. Cruzarlo con el inventario permite empezar a delimitar el trabajo aunque el servicio siga funcionando.","term":"CVE = identificador público que permite a distintas organizaciones hablar del mismo fallo.","refs":[1,2],"type":"choice"},{"title":"La palabra que cambia el diagnóstico","evidence":"Hecho documentado. Apache identifica el componente log4j-core. Supuesto de aula: «Reservas» carga core 2.14.1 y «Agenda» usa únicamente log4j-api 2.14.1 con otra implementación, verificada en ejecución.","ask":"¿Qué servicio coincide con el aviso CVE-2021-44228?","options":["Reservas","Agenda","Ambos por mostrar la misma versión"],"correct":0,"explain":"La condición incluye el componente además de la versión. Apache excluye para este CVE el uso exclusivo de log4j-api sin log4j-core.","term":"Biblioteca = pieza de software que otra aplicación incorpora para realizar una tarea.","refs":[1],"type":"choice"},{"title":"Lo que viene dentro de la caja","evidence":"Supuesto de aula. El inventario principal de Reservas solo enumera la aplicación. El proveedor entrega un manifiesto del paquete y el equipo puede identificar las bibliotecas que carga el proceso.","ask":"Elegid dos evidencias que ayuden a localizar la dependencia.","options":["El color de la pantalla de entrada","El manifiesto de componentes del paquete desplegado","La relación de bibliotecas cargadas por el proceso"],"correct":[1,2],"explain":"El manifiesto muestra lo que incluye ese paquete. La observación del proceso añade qué está usando la instancia examinada.","term":"Dependencia transitiva = pieza que llega porque otra pieza de la aplicación la necesita.","refs":[1,2],"type":"multi"},{"title":"Un expediente que otra persona pueda continuar","evidence":"Supuesto de aula. La consola devuelve «reservas-02 / producción / log4j-core 2.14.1 / observación del proceso, 10:15». Un chat añade «creo que también está en la intranet».","ask":"¿Qué anotación resulta defendible con lo observado?","options":["Toda la intranet está afectada","Ha habido una intrusión en producción","Una instancia identificada carga la versión afectada y la intranet queda por comprobar"],"correct":2,"explain":"La observación respalda el hallazgo en una instancia. El mensaje sobre la intranet abre una comprobación pendiente.","term":"Instancia = una copia concreta de una aplicación que está funcionando.","refs":[1,3],"type":"choice"},{"title":"Tres ramas, tres números","evidence":"Hecho documentado. Para CVE-2021-44228 Apache publicó correcciones en 2.3.1 (Java 6), 2.12.2 (Java 7) y 2.15.0 (Java 8 o superior). Leéis la tabla histórica del primer aviso.","ask":"¿Qué versión figura en esa tabla para una aplicación limitada a Java 7?","options":["2.3.1","2.12.2","2.15.0"],"correct":1,"explain":"La primera corrección de ese CVE en la rama para Java 7 fue 2.12.2. La cifra pertenece a un aviso histórico concreto.","term":"Rama = familia de versiones que recibe cambios compatibles con una plataforma determinada.","refs":[1,4],"type":"choice"},{"title":"El primer arreglo y el siguiente aviso","evidence":"Hecho documentado. En la rama para Java 8 o superior, Apache asocia 2.15.0 a la primera corrección de CVE-2021-44228 y 2.16.0 a la de CVE-2021-45046, un aviso posterior con condiciones propias.","ask":"A 17 de diciembre de 2021, ¿qué haríais con un ticket cerrado la víspera con 2.15.0?","options":["Revisar el nuevo aviso, las condiciones y el alcance del ticket anterior","Afirmar que todas las máquinas fueron atacadas","Cambiar la fecha del ticket para que coincida con la noticia"],"correct":0,"explain":"Un nuevo aviso exige otra evaluación. La versión que se observó y la fecha de la comprobación anterior siguen siendo datos válidos.","term":"Ticket = registro de trabajo donde se guarda lo que se decidió y las pruebas.","refs":[1,2],"type":"choice"},{"title":"Una versión con fecha y con alcance","evidence":"Hecho documentado. En Java 8 o superior, Apache también publicó 2.17.0 para CVE-2021-45105 y 2.17.1 para CVE-2021-44832. Supuesto de aula situado el 29 de diciembre de 2021: el proveedor valida 2.17.1 para Reservas.","ask":"¿Cómo justificaríais el objetivo histórico del cambio?","options":["2.17.1 será la recomendación permanente para cualquier aplicación","Cualquier edición de Java admite 2.17.1","A esa fecha se elige 2.17.1 para esta aplicación tras revisar esos avisos y la compatibilidad"],"correct":2,"explain":"Se fija un objetivo acotado por fecha, plataforma, avisos y proveedor. Para un despliegue actual se revisan de nuevo los avisos y las versiones mantenidas.","term":"Compatibilidad = posibilidad de que dos piezas funcionen juntas en el entorno previsto.","refs":[1,4],"type":"choice"},{"title":"La copia que sale primero","evidence":"Supuesto de aula. Reservas funciona en tres copias equivalentes. Podéis apartar una del tráfico y las otras dos tienen capacidad suficiente. Tenéis una prueba de reserva y otra de escritura en el registro.","ask":"¿Qué plan permite detectar una regresión con impacto limitado?","options":["Cambiar las tres y preguntar mañana si alguien se queja","Actualizar una copia apartada, probarla y ampliar el cambio si cumple los criterios","Ocultar el aviso hasta la ventana del mes siguiente"],"correct":1,"explain":"El piloto reduce el número de copias expuestas a un fallo del cambio. Las pruebas deben cubrir el servicio y la función de registro.","term":"Piloto = cambio limitado que se comprueba antes de extenderlo al resto.","refs":[3],"type":"choice"},{"title":"Preparar la intervención","evidence":"Supuesto de aula. El equipo tiene autorización para el piloto, una copia que puede apartar y un paquete validado. Ordenad estas acciones del plan.","ask":"¿En qué orden haríais el cambio en el piloto?","options":["Guardar el estado inicial y acordar cómo recuperar el servicio","Apartar la copia del tráfico","Instalar el paquete y reiniciar la aplicación según el procedimiento","Comprobar la versión cargada y ejecutar las pruebas acordadas"],"correct":0,"explain":"Conservar el punto de partida facilita la recuperación. Se separa la copia antes del cambio y se verifica después de que el nuevo proceso arranque.","term":"Reversión = procedimiento preparado para recuperar el servicio si el cambio falla.","refs":[3],"type":"order"},{"title":"El disco y la memoria discrepan","evidence":"Supuesto de aula. El archivo nuevo figura en disco, pero el proceso del piloto todavía muestra log4j-core 2.14.1 en uso. El cambio requiere reiniciar ese proceso.","ask":"¿Qué haríais antes de devolver esta copia al tráfico?","options":["Completar el reinicio previsto y comprobar otra vez la versión cargada","Dar por aplicada la corrección porque el archivo está en disco","Borrar el hallazgo del informe para evitar duplicados"],"correct":0,"explain":"El proceso sigue usando el componente anterior. Una nueva observación tras el reinicio permite verificar el efecto del cambio.","term":"Proceso = aplicación en marcha, con las piezas que ha cargado en memoria.","refs":[1,3],"type":"choice"},{"title":"¿Hace su trabajo la biblioteca?","evidence":"Supuesto de aula. El piloto ya carga la versión prevista. La aplicación permite crear reservas y debe escribir su identificador de prueba en el registro destinado a operaciones.","ask":"Elegid las dos comprobaciones que cubren la función de negocio y la de registro.","options":["Completar una reserva con datos de prueba","Confirmar que aparece el identificador de esa reserva en el registro esperado","Mirar únicamente si la pantalla de inicio tiene el logotipo correcto"],"correct":[0,1],"explain":"Crear una reserva demuestra el recorrido principal. Encontrar su identificador en el registro comprueba el trabajo específico de la biblioteca actualizada.","term":"Registro = diario donde un sistema deja constancia de hechos que pueden revisarse después.","refs":[1,3],"type":"multi"},{"title":"Medir lo que queda","evidence":"Supuesto de aula. Las copias A y B ya cargan la versión prevista y han superado ambas pruebas. De la copia C solo consta una orden de actualización enviada.","ask":"¿Cuántas copias tienen verificada la corrección y el funcionamiento?","options":[],"correct":2,"explain":"A y B aportan pruebas de versión y funcionamiento. La orden enviada a C todavía no informa del resultado.","term":"Cobertura verificada = parte del conjunto que ya cuenta con las pruebas exigidas.","refs":[3],"type":"number","unit":"copias"},{"title":"La tercera copia responde con errores","evidence":"Supuesto de aula. La copia C carga la versión prevista, pero falla al confirmar reservas. A y B están sanas y pueden atender todo el tráfico. El procedimiento permite aislar C y mantener el servicio.","ask":"¿Qué decisión concilia continuidad y seguridad?","options":["Poner C en servicio porque ya muestra la versión correcta","Volver todas las copias a la versión afectada inmediatamente","Mantener C apartada, conservar sus pruebas y diagnosticarla mientras A y B atienden el tráfico"],"correct":2,"explain":"El cambio ha alcanzado el número de versión, pero ha fallado el criterio funcional de C. Apartarla permite investigar con el servicio disponible.","term":"Regresión = función que deja de funcionar correctamente después de un cambio.","refs":[3],"type":"choice"},{"title":"¿Y si ya habían entrado?","evidence":"Hecho documentado. En 2022, CISA y el FBI describieron una red federal en la que se explotó Log4Shell y se instaló un minero de criptomonedas. En Reservas, supuesto de aula, solo consta la versión afectada.","ask":"¿Qué comunicaríais sobre el posible compromiso de Reservas?","options":["Que toda aplicación vulnerable ya fue comprometida","Que hubo exposición y se revisarán los registros disponibles para buscar indicios locales","Que instalar la corrección demuestra que jamás se produjo una intrusión"],"correct":1,"explain":"La versión afectada justifica la exposición. Atribuir un compromiso local requiere evidencias del entorno y valorar los límites de los registros.","term":"Compromiso = situación en la que alguien logra acceso o uso indebido de un sistema.","refs":[1,5],"type":"choice"},{"title":"La copia que volverá mañana","evidence":"Supuesto de aula. Las tres copias están corregidas y pasan sus pruebas. El sistema crea copias nuevas a partir de una plantilla que todavía contiene el paquete antiguo.","ask":"¿Qué acción evita que el hallazgo reaparezca al aumentar la capacidad?","options":["Cambiar únicamente el nombre de la plantilla","Esperar a que arranque otra copia vulnerable para abrir un segundo ticket","Actualizar la plantilla, crear una copia de prueba y verificar qué carga al arrancar"],"correct":2,"explain":"La plantilla determina con qué arranca cada copia futura. Probar una instancia recién creada permite verificar que la corrección persiste.","term":"Plantilla de despliegue = modelo con el que se crean nuevas copias de una aplicación.","refs":[3],"type":"choice"},{"title":"Las pruebas que viajan con el cierre","evidence":"Supuesto de aula. El paquete está aplicado, las tres copias y la nueva instancia de prueba funcionan. Debéis dejar pruebas para otra persona que revise el cambio.","ask":"¿Qué dos elementos guardaríais en el expediente de cierre?","options":["Identificador de cada copia y versión en uso comprobada, con fecha","Una captura de una barra de progreso al 100 % sin nombre de máquina","Resultado de las pruebas de reserva y registro, incluida la copia creada desde la plantilla"],"correct":[0,2],"explain":"La versión observada demuestra el estado de los activos identificados. Los resultados funcionales documentan que la operación y su registro sobrevivieron al cambio.","term":"Evidencia de cierre = prueba identificable que respalda la decisión de dar por terminada la corrección.","refs":[3],"type":"multi"},{"title":"Redactar un cierre que aguante el lunes","evidence":"Supuesto de aula. Consta la corrección histórica en las tres copias y en su plantilla. La revisión de posibles indicios anteriores sigue abierta en un expediente aparte.","ask":"¿Qué cierre enviaríais a la persona responsable de Reservas?","options":["Corrección y pruebas verificadas en las tres copias y la plantilla en la fecha indicada; revisión histórica de indicios en curso","Organización segura para siempre tras instalar 2.17.1","Caso cerrado porque el proveedor envió el paquete"],"correct":0,"explain":"El resumen identifica alcance, pruebas y fecha y comunica el trabajo que continúa. Una revisión posterior puede comprobar cada afirmación.","term":"Alcance = conjunto concreto de sistemas y condiciones al que se refiere una conclusión.","refs":[1,2,3],"type":"choice"}],"illustration":"data:image/webp;base64,UklGRrY8AABXRUJQVlA4IKo8AAAwOwGdASrfA8YBPmEwlEgkIqIhobJJAIAMCWlu4XaxH8wf5LTPuf/Zt7otZfvX9V8wHK1yB/qv5L6FnKH++/tf5jfPX+hf4b+V+4j8o/773AP08/Xb1Wv87/IPcd+yX9A9gH9K/tf/e/wXuq/2r9p/cV+x/6v/AB/Tv8d/+faq9QX9wPYR/c/1cv97+3vwh/2T/dfuB8Df7G//v2AP//wOfjn+m/1f9SPMl+j/1T+p/37/Ffvd/jvbn8X+V/rf9f/Yr+4fs/8U37N+R3rN8y/gv9v+snsb/F/q/9c/tn96/1X9+/dL4u/v35Aflv7X/HD+v/u31AfYL+S/yP+3/2b9nf73+9vts/0X68f7Lwr9f/2P+h/k3sBeunz7/Kf3b/Cf87/Mft38hHqX+g/wP9s/5fuN+Wf3b/Z/3P9qvoB/jH83/0f+D/df/Kf//6a/yP62+Tf9n/x/7O/AD/I/7D/yf7/+V/0pfwf/N/yn+g/af2m/mn98/6H+X/1P7W/YT/K/6p/uP71/o//Z/of/////ua///77/I395///7oX7qf/oP+xb3Yh3Yt7sQ7sW92Id2Le7EO7FvdiHdi3uxDuxb3Yh3Yt7sQ7sW92Id2Le7EO7FvdiHdi3uxDuxTM72YxbrgGsG/BlKFx6Q2Fwbu6i3qRWvvCgnGsUzaHNbFulaqzy4fTN2nqbaN/YgEf2dJ/97MKpmm5+yRzE8I9tKmPZ1dSlQl3jdH30SB818Nuq3uxDuxb3Yh3Yt7sQ7msDhJ66oRHxqOQMFghc15zvI5ty/Dc+0PKfgHbzOxdcWiAiYDC9YnXzn6z25qzXCjiQ41ZNBGkFSP8shl2BCOhmCCh0O7JEWsozVqDoXR6Bn6sh5c5OOgStvIVgMLgSwB2KDgtz3NzRBtXBLaIwGawBA+a+G3Vb3Yh3Yt7sQ7sW910p3iKGZ/TvSxi/JneYTV6+/p+n4RwmHD1tbPU+MfNaigGzrTCjgP8M86WezkT+j4M3pTT3jmRZw9XCZGTLvpHEvBhWI8q927L03Fpui1MPg6EJyqR+JURE7rYFu <script>
'use strict';
const cases=JSON.parse(document.getElementById('caseData').textContent);
const el=id=>document.getElementById(id);
const node=(tag,txt)=>{const n=document.createElement(tag);n.textContent=txt;return n};
const params=new URLSearchParams(location.search);
function indexIn(v,total){const n=Number(v);return Number.isInteger(n)&&n>0&&n<=total?n-1:0}
let c=indexIn(params.get('caso'),cases.length), i=0, state={}, chosen=null, ordering=[], solved=false;
function stateKey(){return 'ucm-vulnerabilidades-expediente-v1-'+(c+1)}
function loadCase(){try{state=JSON.parse(localStorage.getItem(stateKey()))||{}}catch{state={}}if(typeof state!=='object')state={};if(!state.steps||typeof state.steps!=='object')state.steps={}}
function persist(){try{localStorage.setItem(stateKey(),JSON.stringify(state))}catch{}}
function current(){return cases[c].steps[i]}function draft(){return state.steps[i]||(state.steps[i]={})}
function renderNav(){const nav=el('stepNav');nav.replaceChildren();cases[c].steps.forEach((s,k)=>{const b=node('button','');b.append(node('b',state.steps[k]?.ok?'✓':String(k+1).padStart(2,'0')),node('span',s.title));if(k===i)b.setAttribute('aria-current','step');b.onclick=()=>go(k);nav.append(b)});el('count').textContent=Object.values(state.steps).filter(x=>x?.ok).length+' de '+cases[c].steps.length+' decisiones comprobadas'}
function go(k){i=k;state.last=i;persist();const url=new URL(location.href);url.searchParams.set('caso',c+1);url.searchParams.set('paso',i+1);try{history.replaceState(null,'',url)}catch{};render()}
function addSources(){const ul=el('refs');ul.replaceChildren();for(const r of current().refs){const f=cases[c].refs[r-1];if(!f)continue;const li=node('li','');const a=node('a',f.author+' · '+f.title);if(/^https?:\/\//.test(f.url)){a.href=f.url;a.target='_blank';a.rel='noopener noreferrer'}li.append(a);ul.append(li)}}
function sorts(){const con=el('choices');con.replaceChildren();ordering.forEach((v,k)=>{const row=node('div','');row.className='sortRow';row.append(node('b',String(k+1)+'.'),node('span',current().options[v]));for(const delta of [-1,1]){const b=node('button',delta===-1?'↑':'↓');b.setAttribute(delta===-1?'data-up':'data-down',k);b.setAttribute('aria-label',(delta===-1?'Subir ':'Bajar ')+current().options[v]);b.disabled=k+delta<0||k+delta>=ordering.length;b.onclick=()=>{[ordering[k],ordering[k+delta]]=[ordering[k+delta],ordering[k]];draft().value=ordering.slice();changed();sorts()};row.append(b)}con.append(row)})}
function changed(){draft().ok=false;el('feedback').hidden=true;persist();renderNav()}
function render(){const s=current(),d=draft(),cc=cases[c];el('caseInfo').textContent=cc.year+'   /   '+cc.skill.toLocaleUpperCase('es');el('title').textContent=cc.name;el('caseLead').textContent=cc.lead;el('evidence').textContent=s.evidence;el('ask').textContent=s.ask;el('stepInfo').textContent=String(i+1).padStart(2,'0')+' / '+cc.steps.length+'   ·   '+s.title.toLocaleUpperCase('es');el('choices').replaceChildren();el('casePicker').value=c;el('memo').value=d.memo||'';el('next').textContent=i===cc.steps.length-1?'Revisar mi expediente':'Siguiente paso →';el('feedback').hidden=!d.ok;el('feedback').className='';if(d.ok)el('feedback').textContent='Decisión comprobada. '+s.explain;
if(s.type==='order'){ordering=Array.isArray(d.value)?d.value.slice():s.options.map((_,k)=>(k+1)%s.options.length);sorts()}
else if(s.type==='number'){const label=node('label','');const inp=node('input','');inp.type='number';inp.step='any';inp.id='number';inp.setAttribute('aria-label','Respuesta numérica');inp.value=d.value??'';inp.oninput=()=>{d.value=inp.value;changed()};label.append(inp,node('span',s.unit||''));el('choices').append(label)}
else{s.options.forEach((o,k)=>{const label=node('label','');const inp=node('input','');inp.name='answer';inp.type=s.type==='multi'?'checkbox':'radio';inp.value=k;inp.checked=s.type==='multi'?(Array.isArray(d.value)&&d.value.includes(k)):k===d.value;inp.onchange=()=>{d.value=s.type==='multi'?[...document.querySelectorAll('[name=answer]:checked')].map(n=>Number(n.value)):k;changed()};label.append(inp,node('span',o));el('choices').append(label)})}addSources();renderNav()}
function expected(s){if(s.type==='multi')return s.correct.map(n=>s.options[n]).join(' · ');if(s.type==='order')return s.options.join(' → ');if(s.type==='number')return (s.correct+' '+(s.unit||'')).trim();return s.options[s.correct]}
function actual(s,d){const v=d?.value;if(v===undefined||v===''||(Array.isArray(v)&&!v.length))return 'Sin respuesta';if(s.type==='number')return (v+' '+(s.unit||'')).trim();if(Array.isArray(v))return v.map(k=>s.options[k]).join(s.type==='order'?' → ':' · ');return s.options[v]||'Sin respuesta'}
function check(){const s=current(),d=draft();if(s.type==='order')d.value=ordering.slice();const v=d.value;let ok=false;if(s.type==='order')ok=v.every((n,k)=>n===k);else if(s.type==='multi')ok=Array.isArray(v)&&v.length===s.correct.length&&v.every(n=>s.correct.includes(n));else if(s.type==='number')ok=v!==undefined&&v!==''&&Math.abs(Number(v)-Number(s.correct))<0.000001;else ok=v===s.correct;d.ok=ok;persist();el('feedback').hidden=false;el('feedback').className=ok?'':'fail';el('feedback').textContent=ok?'Decisión comprobada. '+s.explain:'Revisad la pieza del expediente y probad otra respuesta. Pista: '+s.term;renderNav()}
function report(example){const root=el('printable');root.replaceChildren(node('h1',cases[c].name),node('p',(example?'Expediente de ejemplo resuelto':'Mi expediente')+' · '+cases[c].skill));cases[c].steps.forEach((s,k)=>{const a=node('article','');const d=state.steps[k]||{};a.append(node('h3',(k+1)+'. '+s.title),node('p',s.ask),node('p',(example?'Respuesta de ejemplo: ':'Vuestra respuesta: ')+(example?expected(s):actual(s,d))));if(example)a.append(node('p',s.explain));else{a.append(node('p',d.ok?'Comprobada. '+s.explain:'Pendiente de comprobación.'));if(d.memo)a.append(node('p','Justificación: '+d.memo))}root.append(a)});root.append(node('h2','Fuentes del expediente'));const ol=node('ol','');for(const r of cases[c].refs)ol.append(node('li',r.author+', '+r.title+', '+r.date+'. '+r.url));root.append(ol)}
function openModal(title){el('dlg').className='';el('dlgTitle').textContent=title;el('dlgContent').replaceChildren();el('printExample').hidden=true;el('dlg').showModal()}
function preview(example){report(example);openModal(example?'Expediente de ejemplo resuelto':'Mi expediente');el('dlgContent').append(...[...el('printable').children].map(q=>q.cloneNode(true)));el('printExample').hidden=false;el('printExample').textContent=example?'Imprimir ejemplo / guardar PDF':'Imprimir expediente / guardar PDF';}
el('casePicker').onchange=()=>{c=Number(el('casePicker').value);loadCase();go(Number.isInteger(state.last)?state.last:0)};
cases.forEach((cc,k)=>{const op=node('option',cc.name+' · '+cc.skill);op.value=k;el('casePicker').append(op)});
el('documento').onclick=()=>{const cc=cases[c],r=cc.refs[cc.photoSource-1];openModal('Documento del caso');el('dlg').className='document';const fig=node('figure','');const img=node('img','');img.src=cc.illustration;img.alt=cc.photoCredit;const cap=node('figcaption',cc.photoCredit);fig.append(img,cap);const a=node('a','Abrir la fuente completa');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';el('dlgContent').append(fig,a)};el('menu').onclick=()=>el('stepNav').classList.toggle('open');el('memo').oninput=()=>{draft().memo=el('memo').value;persist()};el('check').onclick=check;el('next').onclick=()=>{if(i===cases[c].steps.length-1)preview(false);else go(i+1)};el('glossary').onclick=()=>{openModal('Glosario del expediente');const dl=node('dl','');[current(),...cases[c].steps.filter((_,k)=>k!==i)].forEach(s=>{const parts=s.term.split(/\s*=\s*/);dl.append(node('dt',parts[0]),node('dd',parts.slice(1).join(' = ')))});el('dlgContent').append(dl)};el('closeDialog').onclick=()=>el('dlg').close();el('printExample').onclick=()=>window.print();el('report').onclick=()=>{report(false);window.print()};el('example').onclick=()=>preview(true);loadCase();i=params.has('paso')?indexIn(params.get('paso'),cases[c].steps.length):indexIn(Number(state.last)+1,cases[c].steps.length);render();report(false);
</script></html>
