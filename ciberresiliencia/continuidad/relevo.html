nte cruza una autorización con un apunte. La aceptación de matrículas puede continuar."], "hash": "e85ac936bc0b05e3fa5d2c7c02154d65da3a59bd12ce75becf888b50ee026c63", "bad": "4f2ce658c0d8712447318b6a23ee70aa8364b111ea99e1de8a2021d782e03d7b"}, {"title": "Cruce de medianoche", "sub": "Caso autónomo", "minutes": 9, "site": "Red de bibliotecas", "context": "La sucursal trabajó con fichas durante el corte. Vuelven los equipos y el turno de noche quiere entregar el servicio. Comprobad un préstamo de extremo a extremo y si el responsable ya ha firmado la recepción.", "local": "2026-07-14 00:12", "offset": "+02:00", "utc": "2026-07-13 22:12", "who": "Inés", "recipient": "Omar", "byte": "Préstamo L-17. Una ficha. Una operación contable. Entrega confirmada.", "tamper": "Préstamo L-17. Una ficha. Dos operaciones contables. Entrega confirmada.", "match": "B", "signed": "B", "claim": "El préstamo L-17 aparece una sola vez y las once fichas del corte se conciliaron con el catálogo.", "docs": [["A", "Extracto de préstamos", "Biblioteca", "Prueba L-17 completada. El historial conserva una sola operación para ese préstamo."], ["B", "Conversación de guardia", "Chat interno", "«La caída vino del aire acondicionado». La frase carece de mediciones de la sala."], ["C", "Conciliación de fichas", "Mostrador", "Once fichas del corte. Once entradas contrastadas. Ninguna pendiente ni duplicada."], ["D", "Estado del servidor", "Sistemas", "El equipo acaba de superar el arranque y responde a la consulta de estado."]], "right": ["A", "C"], "hyp": "B", "closure": "Cierre", "owner": "Responsable de préstamos", "trigger": "Préstamo único, fichas conciliadas y recepción firmada", "why": "La transacción funciona, se han conciliado las once fichas y consta la aceptación del responsable. En este ejercicio se cumplen juntos los tres criterios de cierre.", "lesson": "La aceptación operativa deja identificada a la persona que recibe el servicio recuperado.", "hints": ["Restar dos horas a las 00:12 obliga a return '<section class="r"><h2>'+NAMES[i]+' · '+esc(i===3?'Recepción pendiente':c.title)+'</h2><p><span class="n">'+reportResult(i)+'</span> · '+f.level+'/4 comprobaciones validadas · '+f.tries.reduce((v,n)=>v+n,0)+' envíos al control.</p>'+(f.level>0?'<p>Hora de referencia: '+esc(a.day)+' '+esc(a.time)+' UTC.</p>':'')+(f.level>1?'<p>Custodia: copia '+esc(a.copy)+' de '+esc(c.who)+' a '+esc(c.recipient)+'. SHA-256 de referencia: <small>'+c.hash.slice(0,32)+' '+c.hash.slice(32)+'</small>.</p>':'')+(f.level>2?'<p>Documentos vinculados: '+c.right.join(' + ')+'. '+esc(c.claim)+' La causa propuesta en '+c.hyp+' sigue sin corroborarse.</p>':'')+(f.done?'<p>Responsable: '+esc(a.owner)+'. Comprobación: '+esc(a.gate)+'.</p>':'')+(f.note?'<p>Nota de relevo: '+esc(f.note)+'</p>':'')+'</section>'}).join('');
$('print').innerHTML='<p class="n">MÁSTER EN CIBERSEGURIDAD · CUADERNO INDIVIDUAL</p><h1>Acta de relevo</h1><p>Parte de recuperación · registros docentes · generado '+nowUtc()+' UTC</p>'+rows+'<small>Referencia histórica: M. Prince, Cloudflare, 4 nov. 2023. Guías de análisis y recuperación: NIST SP 800-86 y SP 800-184.</small>'}
function printDialog(){renderPrint();show('Mi parte de recuperación','<p>El informe recoge las pruebas validadas, las decisiones y vuestras notas. También se puede guardar una partida a medias.</p><ul>'+s.files.map((f,i)=>'<li>'+NAMES[i]+' · '+f.level+'/4 · '+reportResult(i)+'</li>').join('')+'</ul><button class="primary" id="printit">Imprimir o guardar como PDF</button>');$('printit').onclick=()=>{$('dlg').close();renderPrint();window.print()}}
function opts(arr,k){return '<option value="">Elegid una opción</option>'+arr.map(n=>'<option '+(F().data[k]===n?'selected':'')+'>'+esc(n)+'</option>').join('')}
function cab(){const i=s.case,z=C(),f=F();$('cases').innerHTML=[0,1,2,3].map((k)=>'<button data-case="'+k+'" '+(!unlocked(k)?'disabled':'')+' class="'+(k===i?'is':'')+'">'+NAMES[k]+' · '+(k===3?'Recepción pendiente':CASES[k].title)+'</button>').join('');
$('cab').innerHTML='<div class="kicker">Mesa documental</div><h2>'+esc(z.site)+'</h2><p>Preparad un relevo que otra persona pueda comprobar con vuestros documentos.</p><div class="track"><i style="width:'+f.level*25+'%"></i></div><small>'+f.level+' de 4 comprobaciones validadas</small><div class="pins">'+PH.map((x,k)=>'<button data-pos="'+k+'" '+(k>f.level?'disabled':'')+' class="'+(k===s.pos?'is':'')+'"><span class="sq">'+(k<f.level?'✓':String(k+1))+'</span>'+x+'</button>').join('')+'</div><details><summary>Itinerario de 30 minutos</summary><p>6 min en el tutorial, 8 en la misión de cobros, 10 en la de préstamos y 6 en la revancha y el parte. Es una propuesta de trabajo individual.</p></details><details><summary>Cómo se obtiene el sello</summary><p>Contrastad cuatro estaciones. Los errores permiten regresar a los documentos. El parte cuenta los envíos al control y conserva las pruebas validadas.</p></details>';
$('foot').textContent=stored?'Progreso guardado en este navegador. Podéis cerrar la mesa y retomar el expediente aquí.':'Este navegador no permite guardar el progreso. Conservad el parte en PDF antes de cerrar.'}
function drawClock(c,a){const v=s.case===0?'<label>¿Qué acredita ese hito del informe público?<select data-k="milestone">'+opts(['La recuperación completa de todos los servicios','La recuperación de la mayor parte del plano de control','La entrega de todos los registros perdidos'],'milestone')+'</select></label>':'';
return '<p>El equipo grabó la hora que se ve en su pantalla. Anotad el instante en '+tip('UTC')+' para poder compararlo con otras sedes.</p><div class="clock"><div><span class="meta">Reloj del equipo</span><b>'+c.local+'</b></div><div class="wire" aria-hidden="true"></div><div><span class="meta">Desfase declarado</span><b>UTC'+c.offset+'</b></div></div>'+(s.case===0?'<div class="notice">El informe público sitúa a las 17:57 UTC del 2 de noviembre la recuperación de la mayor parte del plano de control. El reloj de esta ficha de aula usa UTC+01:00.</div>':'')+'<div class="group"><label>Fecha en UTC<input data-k="day" type="date" value="'+esc(a.day||'')+'"></label><label>Hora en UTC<input data-k="time" type="time" value="'+esc(a.time||'')+'"></label></div>'+v}
function files(c,a){return '<p>El '+tip('Manifiesto')+' conserva la huella de la pieza original. Calculad la '+tip('Huella SHA-256')+' de cada copia y comprobad por separado la '+tip('Cadena de custodia')+'.</p><div class="notice"><b>Manifiesto de origen · '+esc(c.who)+'</b><div class="digest">'+c.hash+'</div></div><div class="grid2">'+['A','B'].map(x=>'<div class="doc"><span class="tag">Sobre '+x+'</span><h4>'+((x===c.match)?'Entrega inventariada':'Carpeta de trabajo')+'</h4><p>'+esc(x===c.match?c.byte:c.tamper)+'</p><button data-hash="'+x+'">Calcular huella '+x+'</button>'+(a['hash'+x]?'<div class="digest">'+esc(a['hash'+x])+'</div>':'')+'<p class="small">Entrega: '+esc(c.who)+' → '+esc(c.recipient)+' · '+(x===c.signed?'recepción firmada':'sin acuse de recepción')+'.</p></div>').join('')+'</div><div class="group"><label>Copia que incorporaréis<select data-k="copy">'+opts(['A','B'],'copy')+'</select></label><label>Qué podéis acreditar<select data-k="warrant">'+opts(['Integridad respecto al manifiesto y relevo documentado','La causa del fallo y su duración','Todos los datos del servicio están completos'],'warrant')+'</select></label></div>'}
function contrast(c,a){const read=F().opened, chosen=a.proofs||[];
return '<p><strong>Afirmación por contrastar.</strong> '+esc(c.claim)+'</p><div class="mural" id="mural"><b>Mural de contraste</b><div class="linea"><span class="ancla '+(chosen[0]?'llena':'')+'">'+(chosen[0]?'Documento '+esc(chosen[0]):'Primera pieza')+'</span><span class="hilo" aria-hidden="true"></span><span class="ancla '+(chosen[1]?'llena':'')+'">'+(chosen[1]?'Documento '+esc(chosen[1]):'Segunda pieza')+'</span></div><p class="small">Arrastrad aquí dos documentos abiertos o marcad sus casillas. Para retirarlos, desmarcad la casilla.</p></div><div class="docs">'+c.docs.map(([id,title,by,content])=>'<div class="doc '+(read.includes(id)?'leida':'')+'" data-doc="'+id+'" draggable="'+(read.includes(id)&&s.pos===F().level)+'"><span class="tag">'+id+' · '+esc(by)+'</span><h4>'+esc(title)+'</h4><button data-read="'+id+'" aria-expanded="'+read.includes(id)+'">'+(read.includes(id)?'Documento abierto':'Abrir documento')+'</button>'+(read.includes(id)?'<p>'+esc(content)+'</p>':'')+'<label class="choiced"><input type="checkbox" data-proof="'+id+'" '+(chosen.includes(id)?'checked':'')+' '+(!read.includes(id)?'disabled':'')+'>Vincular como prueba</label></div>').join('')+'</div><label>Documento que solo sugiere una '+tip('Hipótesis')+'<select data-k="conject">'+opts(['A','B','C','D'],'conject')+'</select></label>'}
function decision(c,a){const accepted=!isRev()&&s.case===2;
const bits=s.case===0?[['Panel de cambios','Cambio aplicado y leído'],['Entrega al cliente','0 de 3 registros'],['Recepción de guardia','Sigue pendiente la entrega']]:s.case===1?[['Autorización','1 pago'],['Libro de cobros','2 apuntes con P-41'],['Servicio disponible','Las matrículas se reciben']]:[['Prueba L-17','1 préstamo registrado'],['Fichas del corte','11 de 11 conciliadas'],['Aceptación del servicio',accepted?'Responsable firmó la recepción':'Pendiente de firma del responsable']];
return '<p>Leed la '+tip('Prueba funcional')+' y la situación de la entrega. Firmad el alcance que realmente podéis sostener.</p><div class="criteria">'+bits.map(([x,y])=>'<div><span>'+x+'</span><b>'+y+'</b></div>').join('')+'</div><div class="group"><label>Estado del servicio<select data-k="state">'+opts(['Parcial','Cierre'],'state')+'</select></label><label>Responsable del siguiente control<select data-k="owner">'+opts(['Entrega de registros','Conciliación de cobros','Responsable de préstamos'],'owner')+'</select></label></div><label>Criterio que se debe cumplir para el cierre<select data-k="gate">'+opts(['Tres registros recibidos por el cliente','Una autorización enlazada a un solo apunte','Préstamo único, fichas conciliadas y recepción firmada','El equipo enciende y responde'],'gate')+'</select></label><label>Nota para quien os releva <small>(opcional, se imprime en el parte)</small><textarea data-k="note" maxlength="600" rows="2" placeholder="¿Qué habéis probado y qué queda por hacer?">'+esc(F().note)+'</textarea></label>'}
function recap(c){const i=s.case,f=F();let hd=isRev()?'Cambia la firma, cambia el dictamen':c.lesson;return '<div class="good msg"><b>Expediente sellado · '+reportResult(i)+'</b></div><h3>'+esc(hd)+'</h3><ol class="review"><li><b>Reloj común.</b> '+c.utc+' UTC.</li><li><b>Custodia.</b> Copia '+c.match+', con contenido y recepción comprobados.</li><li><b>Documentos vinculados.</b> '+c.right.join(' + ')+'. La hipótesis del documento '+c.hyp+' queda abierta.</li><li><b>Dictamen.</b> '+esc(isRev()?'Falta la aceptación del responsable de préstamos. El préstamo y la conciliación siguen correctos.':c.why)+'</li></ol>'+(isRev()?'<div class="clock"><div class="meta">Misión 2<b>Cierre</b></div><div class="wire"></div><div class="meta">Revancha<b>Parcial</b></div></div>':'')+'<p><b>Precisión del expediente.</b> '+f.tries.filter(v=>v===1).length+' de 4 comprobaciones resueltas al primer envío. Mejor marca: '+(s.best?.[i]??f.tries.filter(v=>v===1).length)+'/4.</p><div class="actions">'+(i<3?'<button class="primary" data-case="'+(i+1)+'">Abrir '+NAMES[i+1].toLowerCase()+'</button>':'<button class="primary" data-report>Preparar el PDF</button>')+'<button data-report>Ver mi parte</button><button data-again>Repetir este expediente</button></div>'}
function paint(){cab();const c=C(),f=F(),p=s.pos,a=f.data,isPast=p<f.level;const title=isRev()?'Recepción pendiente':c.title;
const intro=isRev()?'Comparad con la misión de bibliotecas. Solo cambia un dato: el responsable aún no ha firmado la aceptación del servicio. Volved a reconstruir la hora y las pruebas con el mismo conjunto de registros.':c.context;
let body=p===4?recap(c):'<div class="brief">'+esc(intro)+'</div><div class="work"><h3>'+['Poned los relojes de acuerdo','Elegid la copia que conservaréis','Relacionad la afirmación con sus pruebas','Entregad el servicio con un criterio'][p]+'</h3>'+(s.case===0||hint?'<div class="coach"><strong>'+(s.case===0?'Tutorial · vuestro siguiente movimiento':'Pista de guardia')+'</strong><br>'+esc(isRev()&&p===3?'Las dos pruebas técnicas siguen correctas. La aceptación queda pendiente.':c.hints[p])+'</div>':'')+[drawClock,files,contrast,decision][p](c,a)+'</div>'+(message?'<div role="status" class="msg '+(okmsg?'good':'')+'">'+esc(message)+'</div>':'')+'<div class="actions">'+(isPast?'<span class="readonly">Prueba validada</span><button class="primary" data-next>Continuar</button>':'<button id="validar" class="primary">Contrastar '+PH[p].toLowerCase()+'</button>')+(s.case!==0&&!isPast?'<button data-hint>Ver una pista</button>':'')+'</div>';
$('paper').innerHTML='<div class="casehead"><div><span class="meta">'+NAMES[s.case]+' · '+(s.case===0?'Hito público y documentos recreados':'Expediente docente')+'</span><h2>'+esc(title)+'</h2></div><span class="folio">'+(p===4?'ACTA CERRADA':'MESA '+(p+1)+' / 4')+'</span></div>'+body;
if(isPast)document.querySelectorAll('#paper input,#paper select,#paper textarea,#paper [data-hash]').forEach(el=>el.disabled=true)}
function setFeedback(msg,passed){message=msg;okmsg=passed;paint()}
function test(){const c=C(),f=F(),a=f.data,p=s.pos;if(f.level!==p)return;
let why='', feedback='';
if(p===0){
 if(!a.day||!a.time)why='Completad fecha y hora para que otro turno pueda reproducir vuestra conversión.';
 else if(a.day+' '+a.time!==c.utc)why='Revisad el signo del desfase. UTC+ significa que el reloj local va por delante de UTC. UTC− significa que va por detrás. Comprobad también el día.';
 else if(s.case===0&&a.milestone!=='La recuperación de la mayor parte del plano de control')why='La hora coincide. Volved al hito del informe: los servicios recuperaron sus funciones en momentos distintos.';
 feedback='Coincide con la cronología: '+c.utc+' UTC. '+(s.case===0?'Ese día volvió la mayor parte del plano de control.':'La hora ya se puede cruzar con otros documentos.');
}else if(p===1){
 if(!a.hashA||!a.hashB)why='Calculad ambas huellas antes de elegir. Comparadlas completas con el manifiesto.';
 else if(a.copy!==c.match)why='La copia elegida difiere del manifiesto o carece de recepción. Revisad los dos sobres.';
 else if(a.warrant!=='Integridad respecto al manifiesto y relevo documentado')why='La coincidencia respalda el contenido de la pieza frente al manifiesto. Para la custodia hace falta además el registro de entrega.';
 feedback='Copia '+c.match+' incorporada: la huella coincide y el traspaso de '+c.who+' a '+c.recipient+' está documentado.';
}else if(p===2){
 if(f.opened.length<4)why='Abrid los cuatro documentos. La frase contiene dos hechos, y también hay una explicación sin corroborar.';
 else if((a.proofs||[]).slice().sort().join()!==c.right.slice().sort().join())why='Elegid dos piezas independientes. Una debe respaldar cada mitad de la afirmación. Una sonda de estado o un comentario de pasillo no sustituyen una operación registrada.';
 else if(a.conject!==c.hyp)why='Los documentos elegidos sí sostienen la afirmación. Falta separar la causa que alguien propone sin mediciones.';
 feedback='Afirmación comprobada con '+c.right.join(' + ')+'. El documento '+c.hyp+' queda como hipótesis pendiente.';
}else{
 const state=isRev()?'Parcial':c.closure;
 if(a.state!==state)why=isRev()?'La recuperación técnica está probada. La recepción pendiente impide firmar el cierre exigido por esta biblioteca.':c.why;
 else if(a.owner!==c.owner||a.gate!==c.trigger)why='El alcance elegido encaja. Revisad quién puede aceptar el servicio y qué comprobación cuenta como cierre en este expediente.';
 feedback=isRev()?'Solo cambió la firma de recepción. Conservad las pruebas correctas y dejad el cierre pendiente.':c.why;
}
f.tries[p]++;if(!why){f.level++;if(f.level===4){f.done=true;s.best=s.best||{};s.best[s.case]=Math.max(s.best[s.case]||0,f.tries.filter(v=>v===1).length)}}keep();setFeedback(why||feedback,!why)}
function gloss(t){if(t)show(esc(t),'<p>'+esc(TERMAS[t])+'</p>');else show('Glosario de guardia','<dl>'+Object.entries(TERMAS).map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl>')}
function clearView(){message='';okmsg=false;hint=false}
function navigate(k,pos){s.case=k;s.pos=pos;clearView();keep();paint();$('paper').scrollIntoView({block:'start',behavior:'instant'})}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k==='note'){F().note=e.target.value;keep()}else if(k&&s.pos===F().level){F().data[k]=e.target.value;keep()}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.proof&&s.pos===F().level){const f=F();f.data.proofs=Array.from(document.querySelectorAll('[data-proof]:checked')).map(n=>n.dataset.proof);keep();paint();document.querySelector('[data-proof="'+el.dataset.proof+'"]')?.focus({preventScroll:true})}else if(el.dataset.k&&el.dataset.k!=='note'&&s.pos===F().level){F().data[el.dataset.k]=el.value;keep()}});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-doc][draggable=true]');if(el)e.dataTransfer.setData('text/plain',el.dataset.doc)});
document.addEventListener('dragover',e=>{if(e.target.closest('#mural')&&s.pos===2&&F().level===2){e.preventDefault();$('mural').classList.add('sobre')}});
document.addEventListener('dragleave',e=>{if($('mural')&&e.target===$('mural'))$('mural').classList.remove('sobre')});
document.addEventListener('drop',e=>{const m=e.target.closest('#mural');if(!m||s.pos!==2||F().level!==2)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain'),f=F();if(f.opened.includes(id)){const v=f.data.proofs||[];if(!v.includes(id)){if(v.length>=2){setFeedback('El mural ya tiene dos piezas. Retirad una desde su casilla antes de añadir otra.',false);return}f.data.proofs=[...v,id];keep()}}paint()});
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||b.disabled)return;const t=b.dataset;
if(b.id==='glos')return gloss();if(b.id==='fuentes')return show('Qué ocurrió en Cloudflare',evidence());if(b.id==='informe'||'report'in t)return printDialog();if('term'in t)return gloss(t.term);
if('again'in t){show('Repetir este expediente','<p>Empezaréis una hoja nueva para este caso. Conservaremos vuestra mejor marca y los demás expedientes. Podéis guardar antes el parte actual.</p><button id="retrygo" class="primary">Empezar hoja nueva</button>');$('retrygo').onclick=()=>{s.files[s.case]=blank();$('dlg').close();navigate(s.case,0)};return}
if('case'in t){const k=Number(t.case);if(unlocked(k))navigate(k,s.files[k].level);return}
if('pos'in t){const p=Number(t.pos);if(p<=F().level)navigate(s.case,p);return}
if('next'in t){navigate(s.case,Math.min(s.pos+1,F().level));return}if('hint'in t){hint=true;paint();return}if(b.id==='validar'){test();return}
if('hash'in t&&s.pos===1){const x=t.hash,c=C(),f=F();if(!['A','B'].includes(x))return;const v=x===c.match?c.byte:c.tamper;let sum;try{const bin=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));sum=Array.from(new Uint8Array(bin),v=>v.toString(16).padStart(2,'0')).join('')}catch{sum=x===c.match?c.hash:c.bad}f.data['hash'+x]=sum;keep();paint();return}
if('read'in t){const f=F();if(!f.opened.includes(t.read))f.opened.push(t.read);keep();paint();return}});
$('glos').title='Consultar un término';window.addEventListener('beforeprint',renderPrint);paint();renderPrint();
</script></body></html>
