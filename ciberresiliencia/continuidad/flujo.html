function calc(r,p,z){
 let dispatch=0,urgent=0,wait=[],arrivals=0,events=[],hist=[];
 for(let minute=0;minute<4;minute++){
  let t=z.time++,v=r.vol[minute];arrivals+=v;
  for(let i=0;i<v;i++)z.raw.push({id:++z.serial,born:t,urg:i===v-1});
  const by=(a,b)=>p.prio==='urgent'?Number(b.urg)-Number(a.urg)||a.id-b.id:a.id-b.id;
  z.raw.sort(by);let passed=z.raw.splice(0,2*p.press);z.ready.push(...passed);z.ready.sort(by);
  let ledgerCap=p.book==='direct'?(r.online?3*p.desk:0):p.desk*(p.book==='folio'?2:3);
  let sent=z.ready.splice(0,ledgerCap);for(const j of sent){dispatch++;if(j.urg)urgent++;wait.push(t-j.born+1);if(p.book!=='direct')z.debt.push({id:j.id,type:p.book})}
  let rec=6-p.press-p.desk,reconciled=0;
  if(r.online){let units=rec*3;while(z.debt.length){const cost=z.debt[0].type==='folio'?1:3;if(units<cost)break;units-=cost;z.debt.shift();reconciled++}}
  hist.push({v,ship:sent.length,q:z.raw.length+z.ready.length,rec:reconciled})
 }
 z.all+=dispatch;wait.sort((a,b)=>a-b);const p95=wait.length?wait[Math.ceil(.95*wait.length)-1]:null,ok=dispatch>=r.min&&urgent>=r.urgent&&p95!==null&&p95<=r.tail&&(r.maxDebt==null||z.debt.length<=r.maxDebt),q=z.raw.length+z.ready.length;
 let why=ok?'La línea cumple el mínimo, protege los lotes urgentes y mantiene el tiempo de paso dentro del objetivo.':!dispatch?'No hay salida válida. Comprobad la disponibilidad del registro y si hay alguien en cada puesto.':urgent<r.urgent?'Faltan lotes urgentes. Cambiad la disciplina de cola y comprobad el cuello de botella.':dispatch<r.min||p95>r.tail?'Se acumula cola. Comparad los lotes sin prensar con los que ya esperan una anotación.': 'Los justificantes pendientes superan el límite del relevo. Reservad personal para cotejarlos. Si los partes anteriores se emitieron en papel libre, puede convenir retroceder y emplear folios numerados.';
 return {ok,after:z,minutes:hist,summary:dispatch+' expedidos · '+urgent+' urgentes · P95 '+(p95??'—')+' min · '+z.debt.length+' resguardos pendientes',plan:p.press+' en prensa, '+p.desk+' en registro y '+(6-p.press-p.desk)+' en cotejo. '+books[p.book]+'. Orden por '+discip[p.prio].toLowerCase()+'.',detail:dispatch+' lotes expedidos, '+urgent+' urgentes. El P95 de los expedidos es '+(p95===null?'indeterminado':p95+' min')+'. Quedan '+z.raw.length+' por prensar y '+z.ready.length+' prensados sin registrar. Quedan '+z.debt.length+' resguardos pendientes.',why}
}

const game={id:'flujo',title:'Turno de laminación',company:'Norsk Hydro',board:'Línea de expediciones',command:'Distribución del turno',unit:'Una ventana = 4 minutos simulados',run:'Simular los cuatro minutos',refs:[{autor:'Norsk Hydro',titulo:'Update on the cyber attack on Hydro · 20 de marzo de 2019',url:'https://www.hydro.com/en/global/media/news/2019/update-on-the-cyber-attack-on-hydro/'},{autor:'Norsk Hydro',titulo:'Update on cyber attack March 26 · 2019',url:'https://www.hydro.com/en/global/media/news/2019/update-on-cyber-attack-march-26/'}],fact:'Hydro declaró en marzo de 2019 que había aislado plantas y operaciones y activado procedimientos manuales. El 26 de marzo informó de una producción del 70–80 % en tres unidades de extrusión, mientras que la división Primary Metal operaba con normalidad y más trabajo manual.',scope:'Esta línea de laminación y su tablero de expediciones son un modelo docente inspirado en la respuesta de Hydro. Las llegadas, rendimientos y plazos son supuestos propios. Los porcentajes del parte de Hydro describen unidades de negocio distintas de esta planta simulada.',lesson:'Un lote prensado cuenta como expedido cuando queda anotado. Para volver al proceso normal es necesario conciliar los justificantes acumulados.',gloss:{'capacidad':'Número de lotes que un puesto puede completar por minuto. Cada prensa procesa dos por persona.','cuello de botella':'Puesto que limita el flujo. Lo localizaréis observando dónde crecen los lotes pendientes.','P95':'Percentil 95. Ordenad los tiempos de los lotes expedidos y tomad la posición redondeada hacia arriba de 0,95 por el número de lotes. Aquí incluye el minuto de proceso; los que siguen en cola se muestran aparte.','cola':'Lotes que están esperando para prensarse o para registrarse.','cotejo':'Comparación entre un resguardo local y el registro central. El talonario numerado permite comprobar tres resguardos por persona y minuto.','resguardo':'Anotación local que acredita que un lote salió de planta.','talonario numerado':'Cuaderno con identificadores únicos. Tarda más en rellenarse que el papel libre, pero acelera la conciliación.','conciliación':'Comprobación de que los movimientos físicos y el inventario central vuelven a coincidir.','disciplina de cola':'Regla para elegir qué lote pasa primero: antigüedad o urgencia.','sistema central':'Registro compartido de expediciones. Durante una interrupción puede seguirse con justificantes locales.','servicio mínimo':'Número de lotes, urgencias y plazo máximo que permiten mantener la operación en un nivel aceptable.'},cases:[{name:'Aprender en la nave',turns:train},{name:'Pedido prioritario',turns:surge},{name:'Fin de turno',turns:rush},{name:'Otro camión',turns:again,delta:'Repetid Fin de turno con los mismos controles. En la segunda ventana llegan seis lotes adicionales. Comparad el P95 de los expedidos y las colas que quedan antes de cambiar la plantilla.'}],initial:()=>({time:0,raw:[],ready:[],debt:[],serial:0,all:0}),defaults:()=>({press:2,desk:2,book:'direct',prio:'fifo'}),goal:r=>'Expedid ≥ '+r.min+' lotes y ≥ '+r.urgent+' urgentes. P95 ≤ '+r.tail+' min.'+(r.maxDebt==null?' Guardad los resguardos.':' Dejad ≤ '+r.maxDebt+' resguardos pendientes.'),

coach(r,p,z){if(z)return z.ok?'Leed el gráfico de salidas y el parte. La cola y los resguardos pasan a la ventana siguiente.':'Fijaos en el puesto que acumuló lotes. Pulsad repetir para volver al estado anterior al ensayo.';const g=r.guide;if(p.press!==g[0]||p.desk!==g[1])return 'Usad + y − para dejar '+g[0]+' personas en prensa y '+g[1]+' en registro. El resto va a cotejo. Si se ocupan las seis plazas, liberad una antes de moverla.';if(p.book!==g[2])return 'Seleccionad «'+books[g[2]]+'». '+(r.online?'Cada lote se registra directamente al expedirse.':'El índice de folios permitirá cotejar los resguardos cuando vuelva el sistema.');if(p.prio!==g[3])return 'Priorizad la urgencia. Al final de cada minuto entra un lote urgente; observad si consigue salir.';return 'Calculad qué puesto limita las salidas. Pulsad «Simular los cuatro minutos» y comparad con el gráfico.'},art:diagram,metrics(r,p,prev,z){let st=z?z.after:prev;return [['En espera',st.raw.length+' lotes'],['Prensados sin registrar',st.ready.length+' lotes'],['Resguardos por cotejar',st.debt.length+' partes']]},simulate:calc,rules(){return '<p>Tenéis seis personas. Asignadlas a prensa y registro con + y −. El resto queda en cotejo. Cada minuto se incorporan los lotes del gráfico. El último de cada grupo es urgente. Se prensa, se registra y se coteja en ese orden. Los lotes y los resguardos pendientes pasan al minuto siguiente y a la siguiente ventana.</p><p>Cada persona de prensa prepara 2 lotes por minuto. En registro, una persona anota 3 en papel libre, 2 en talonario o 3 directamente en el sistema central cuando hay conexión. Los soportes locales dejan resguardos. Con el centro disponible, una persona coteja 3 resguardos numerados o 1 libre por minuto, del más antiguo al más reciente.</p><p>El tiempo de un lote incluye el minuto en el que se expide. Para el P95 se ordenan los tiempos de los expedidos en esta ventana y se toma la posición superior del 95 %. Un P95 bajo puede convivir con una cola creciente. Comparad siempre ambos datos.</p>'}};

game.predictLabel='¿Cuántos lotes quedarán expedidos al finalizar los cuatro minutos?';

let ci=0,book;try{book=JSON.parse(localStorage.getItem(key));if(!Array.isArray(book)||book.length!==4)book=null}catch{}if(!book)book=Array.from({length:4},()=>null);

$('bt').textContent=game.board;$('bh').textContent=game.unit;$('ct').textContent=game.command;$('state').textContent=s.finished?'Caso cerrado':s.pending?'Turno comprobado':'Preparación';

$('advice').innerHTML='<b>'+(ci===0?'Tutorial · Próxima acción':ci===3?'Ensayo comparado':'Parte del relevo')+'</b>'+ (ci===0?game.coach(r,dec,s.pending):ci===3?c.delta:r.tip);
$('choices').innerHTML=game.controls(dec,r)+'<label class="predict">Pronóstico antes de resolver <span>'+game.predictLabel+'</span><input id="guess" type="number" min="0" step="1" inputmode="numeric" placeholder="Vuestra cifra" value="'+(Number.isInteger(dec.guess)?dec.guess:'')+'" '+(s.pending?'disabled':'')+'></label>';if(!s.pending)$('guess').oninput=()=>{const v=$('guess').value;dec.guess=v===''?null:Number(v);save()};if(s.pending||s.finished)$('choices').querySelectorAll('button,select').forEach(b=>b.disabled=true);
$('run').textContent=s.finished?'Abrir parte final':s.pending?(s.pending.ok?(s.i===c.turns.length-1?'Cerrar caso':'Abrir siguiente ventana'):'Repetir esta ventana'):game.run;
$('feedback').hidden=true;$('back').disabled=s.i===0;
const z=s.pending;$('result').hidden=!z;if(z){$('result').innerHTML='<div class="resultHead '+(z.ok?'win':'')+'"><h3>'+(z.ok?'Objetivo alcanzado':'Objetivo pendiente')+'</h3><span class="kicker">Ventana '+(s.i+1)+'</span></div><div class="body"><p>'+z.detail+'</p><p class="compact">'+z.why+'</p><p class="compact"><strong>Vuestro pronóstico:</strong> '+z.guess+' · Resultado: '+z.actual+'.</p>'+(z.ok&&!s.finished?'<label class="check">Lectura del parte · '+z.ask+' <input id="check" type="number" inputmode="numeric" placeholder="Vuestra cifra" aria-label="Respuesta al parte"></label>':'')+'</div>'}
$('audit').innerHTML=s.done.length?s.done.map((x,i)=>'<p><strong>'+safe(c.turns[i].t)+'</strong> · '+safe(x.summary)+'</p>').join(''):'Los resultados se incorporan cuando validáis una ventana.';

}
function openTerms(term){const ar=Object.entries(game.gloss);modal('<h2>Glosario de guardia</h2><dl>'+ar.filter(([a])=>!term||a===term).map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('')+'</dl>')}
function enhanceTerms(){const keys=Object.keys(game.gloss).sort((a,b)=>b.length-a.length);const pattern=new RegExp('(?<![\\p{L}\\p{N}])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu');for(const id of ['brief','objective','advice','result']){const root=$(id),tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=tw.nextNode())if(!n.parentElement.closest('button'))nodes.push(n);for(const node of nodes){const v=node.textContent;pattern.lastIndex=0;if(!pattern.test(v))continue;pattern.lastIndex=0;const fr=document.createDocumentFragment();let end=0;for(const m of v.matchAll(pattern)){fr.append(document.createTextNode(v.slice(end,m.index)));const b=document.createElement('button');b.className='term';b.dataset.term=keys.find(k=>k.toLocaleLowerCase('es')===m[0].toLocaleLowerCase('es'));b.textContent=m[0];fr.append(b);end=m.index+m[0].length}fr.append(document.createTextNode(v.slice(end)));node.replaceWith(fr)}}}

ón. Las copias necesitan protección, actualización y pruebas; el registro manual necesita conciliación.", "correcta": true}, {"titulo": "Prometer que una certificación evitará la siguiente caída", "efecto": "No aporta evidencia de continuidad al próximo turno.", "porque": "Un sistema de gestión puede mejorar las decisiones, pero ningún certificado garantiza ausencia de incidentes.", "correcta": false}]}], "revancha": "En Otro camión repetid Fin de turno. En la segunda ventana llegan 7, 7, 4 y 4 lotes. Comparad cola, tiempo de espera y folios pendientes manteniendo iguales las decisiones; después cambiad un reparto y medid su efecto.", "id": "flujo", "numero": 2, "fuentes": [{"autor": "Center for Internet Security", "titulo": "CIS Control 14: Security Awareness and Skills Training, v8.1", "url": "https://cas.docs.cisecurity.org/en/latest/source/Controls14/"}, {"autor": "Center for Internet Security", "titulo": "CIS Control 17: Incident Response Management, v8.1", "url": "https://cas.docs.cisecurity.org/en/latest/source/Controls17/"}, {"autor": "Center for Internet Security", "titulo": "CIS Control 11: Data Recovery, v8.1", "url": "https://cas.docs.cisecurity.org/en/latest/source/Controls11/"}, {"autor": "NIST", "titulo": "The NIST Cybersecurity Framework (CSF) 2.0, 2024", "url": "https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20"}], "gloss": {"Eficacia": "Grado en que una medida consigue el resultado buscado. Exige definir el objetivo, observar el resultado y aclarar a qué población se refiere.", "CIS Controls": "Conjunto priorizado de salvaguardas de ciberseguridad. Incluye tecnología, personas y procesos; puede apoyar un sistema de gestión.", "Salvaguarda": "Medida que modifica un riesgo. Puede ser técnica, humana, física o de organización; hay que comprobar su efecto.", "Ciberresiliencia": "Capacidad de anticiparse, resistir, recuperarse y adaptarse ante situaciones adversas que afectan a recursos digitales y a la misión.", "Trazabilidad": "Pos <script>

const additions=[{"term":"Ciberresiliencia","definition":"Capacidad de anticipar un problema digital, seguir prestando lo esencial mientras ocurre, recuperar el servicio y aprender para la próxima vez.","example":"Si falla el sistema de préstamos, la biblioteca mantiene una salida controlada en papel y después comprueba que los libros y el registro coinciden.","aliases":[],"games":[]},{"term":"Ciberseguridad","definition":"Protección de los sistemas, los datos y los servicios frente a usos no autorizados, alteraciones e interrupciones.","example":"Una cuenta con permisos limitados reduce lo que puede hacer quien consiga robarla.","aliases":["Cybersecurity"],"games":[]},{"term":"Continuidad","definition":"Forma prevista de mantener las actividades importantes cuando falla la manera habitual de trabajar.","example":"Una taquilla puede seguir vendiendo con un procedimiento alternativo, aunque su aplicación principal esté caída.","aliases":["continuidad del negocio"],"games":[]},{"term":"Recuperación","definition":"Restablecimiento comprobado del servicio y de las condiciones acordadas para utilizarlo.","example":"Encender el servidor es un paso; comprobar que una reserva se guarda una sola vez permite saber si el servicio vuelve a funcionar.","aliases":["recuperaciones","recovery","disaster recovery","data recovery","event recovery"],"games":[]},{"term":"Restauración","definition":"Proceso de reconstruir datos o sistemas a partir de una copia conservada. Después hay que comprobar que sirven para trabajar.","example":"Recuperáis la base de reservas de las 11:25 y aplicáis los cambios posteriores que se conservaron.","aliases":["restaurar"],"games":[]},{"term":"Servicio mínimo","definition":"Nivel de trabajo que la organización considera indispensable durante una interrupción. Puede exigir cantidad, plazo, calidad y prioridades a la vez.","example":"Enviar las siete cargas urgentes no basta si el encargo exige también completar al menos catorce órdenes.","aliases":["mínimo de servicio","mínimos de servicio"],"games":[]},{"term":"Riesgo","definition":"Posibilidad de que un suceso perjudique un objetivo, considerando tanto qué podría ocurrir como sus consecuencias.","example":"Aunque hoy el directorio funcione, hay que valorar qué pasaría si dejara de autorizar órdenes durante el embarque.","aliases":["riesgos"],"games":[]},{"term":"Salvaguarda","definition":"Medida que reduce la posibilidad de un problema o sus consecuencias. Puede ser técnica, física u organizativa.","example":"Una lista de permisos preparada de antemano permite autorizar trabajo cuando falla el directorio central.","aliases":["salvaguardas"],"games":[]},{"term":"Control","definition":"Medida que modifica un riesgo o ayuda a comprobar que se cumplen unas condiciones. Debe tener un propósito y probarse.","example":"La prueba de reserva y relectura comprueba algo más útil que mirar si la portada de la aplicación carga.","aliases":["controles"],"games":[]},{"term":"Capacidad","definition":"Cantidad máxima de trabajo que una parte del sistema puede realizar en el intervalo indicado.","example":"Un canal que permite diez órdenes por ventana no puede transportar veinte solo porque esas veinte sean urgentes.","aliases":["capacidades"],"games":[]},{"term":"Cuello de botella","definition":"Parte que limita lo que puede completar el conjunto, aunque otras tengan capacidad libre.","example":"Si la red transporta dieciséis órdenes pero solo se pueden autorizar catorce, el permiso limita la salida a catorce.","aliases":["cuellos de botella"],"games":[]},{"term":"Ventana","definition":"Intervalo de tiempo que se simula en una ronda. Su duración y reglas aparecen en cada juego.","example":"En Puerto de guardia, una ventana representa diez minutos de operación.","aliases":["ventanas","ventana de tiempo"],"games":[]},{"term":"Pronóstico","definition":"Resultado que calculáis o esperáis antes de ejecutar la prueba. Sirve para comparar vuestra idea con lo que ocurre.","example":"Antes de despachar, sumáis la capacidad de las vías y la limitáis por la autorización disponible.","aliases":["pronósticos"],"games":[]},{"term":"Supuesto","definition":"Condición que se da por válida en el modelo para poder razonar. Si cambia, puede cambiar el resultado.","example":"Que el directorio responda es un supuesto del primer ensayo. La revancha permite comprobar qué ocurre cuando falla.","aliases":["supuestos"],"games":[]},{"term":"Ensayo","definition":"Prueba de una decisión en unas condiciones conocidas, con un resultado que se puede observar.","example":"Compráis una alternativa y la probáis antes de atribuirle una reducción de las interrupciones.","aliases":["ensayos","ensayar"],"games":[]},{"term":"Eficacia","definition":"Grado en que una medida consigue el resultado previsto en las condiciones comprobadas.","example":"La ruta alternativa es eficaz para el mínimo si transporta las órdenes necesarias dentro del plazo.","aliases":["eficaz","eficaces","efectividad"],"games":[]},{"term":"Evidencia","definition":"Información comprobable que sirve para sostener una afirmación. Hay que conservar su origen y entender sus límites.","example":"Un recibo demuestra lo que llegó al cliente; una luz encendida solo demuestra que ese equipo tenía alimentación.","aliases":["evidencias"],"games":[]},{"term":"Trazabilidad","definition":"Posibilidad de seguir qué ocurrió, con qué elemento, cuándo y quién intervino.","example":"Un resguardo numerado ayuda a relacionar una salida física con la anotación que se incorpora después.","aliases":["trazable"],"games":[]},{"term":"Responsable","definition":"Persona o área que debe decidir, responder del resultado y mantener el seguimiento.","example":"El área de taquilla confirma que la venta vuelve a funcionar; el equipo técnico aporta las pruebas.","aliases":["responsables"],"games":[]},{"term":"Incidente","definition":"Suceso que compromete o amenaza la seguridad o el funcionamiento esperado y requiere una actuación organizada.","example":"Un borrado que impide asignar las reservas necesita identificación, contención y recuperación.","aliases":["incidentes"],"games":[]},{"term":"Plan de respuesta","definition":"Acuerdo previo sobre quién actúa, cómo se avisa y qué pasos se siguen ante un incidente.","example":"Dejar claro a quién llamar evita que cada persona espere a que otra comunique el problema.","aliases":["plan de respuesta a incidentes","respuesta a incidentes","Incident Response","Incident Response Management"],"games":[]},{"term":"CIS Controls","definition":"Conjunto priorizado de buenas prácticas de seguridad. Incluye medidas técnicas y también aspectos de organización, formación y respuesta.","example":"Proteger las copias, formar al personal y preparar la respuesta atienden problemas distintos que se complementan.","aliases":["CIS","CIS Control"],"games":[]},{"term":"NIST","definition":"Instituto Nacional de Estándares y Tecnología de Estados Unidos. Publica guías y marcos que ayudan a organizar y evaluar la ciberseguridad.","example":"Un marco de NIST puede ayudar a ordenar resultados deseados; no sustituye la decisión concreta de quién mantiene el embarque.","aliases":[],"games":[]},{"term":"NIST CSF","definition":"Cybersecurity Framework, marco de ciberseguridad de NIST. Su versión 2.0 organiza resultados mediante gobernar, identificar, proteger, detectar, responder y recuperar.","example":"Podéis relacionar la preparación de permisos con proteger y la prueba de reapertura con recuperar.","aliases":["CSF","CSF 2.0"],"games":[]},{"term":"Framework","definition":"Marco de trabajo que organiza ideas, objetivos o prácticas. No suele ser una receta que se aplique igual a todas las organizaciones.","example":"NIST CSF ayuda a ordenar lo que se quiere conseguir; el plan de vuestra organización concreta responsables y acciones.","aliases":["frameworks","marco de trabajo"],"games":[]},{"term":"PDF","definition":"Portable Document Format, formato de documento que conserva la composición de las páginas.","example":"El parte en PDF permite guardar las decisiones y resultados para revisarlos después.","aliases":[],"games":[]},{"term":"JSON","definition":"JavaScript Object Notation, formato de texto para guardar datos mediante nombres y valores.","example":"Una exportación JSON puede guardar el estado de la partida para que un programa vuelva a leerlo.","aliases":[],"games":[]},{"term":"Urgentes","definition":"Trabajos cuyo plazo vence antes y que deben priorizarse según las reglas del encargo.","example":"Una carga refrigerada puede perder su utilidad si espera a la siguiente salida.","aliases":["urgente","urgencia","urgencias"],"games":[]},{"term":"Política de cola","definition":"Regla que determina qué trabajo pasa primero cuando no se puede atender todo a la vez.","example":"Por llegada atiende según el orden de entrada; urgentes primero da prioridad a los plazos críticos.","aliases":["disciplina de cola"],"games":[]},{"term":"FIFO","definition":"First In, First Out: lo primero que entra es lo primero que sale. Es una regla de atención por orden de llegada.","example":"El lote que llegó antes pasa antes que otro posterior, aunque este último sea urgente.","aliases":["por llegada","por antigüedad"],"games":[]},{"term":"Cola","definition":"Trabajo que está esperando porque todavía no ha podido pasar al siguiente paso.","example":"Los lotes pueden acumularse antes de la prensa o antes de registrar la expedición.","aliases":["colas"],"games":[]},{"term":"P95","definition":"Percentil 95. Se ordenan los tiempos de los lotes expedidos y se toma la posición que alcanza el 95 % de ellos. Los lotes que siguen esperando se contabilizan aparte.","example":"En diez lotes ordenados, el juego usa la posición redondeada hacia arriba de 0,95 × 10: la décima. Por eso también hay que mirar la cola pendiente.","aliases":["percentil 95"],"games":[]},{"term":"Percentil","definition":"Valor que marca una posición al ordenar un conjunto de datos. Sirve para mirar cómo se reparten los resultados, además de la media.","example":"El percentil 95 señala un tiempo que alcanza al menos el 95 % de los lotes expedidos.","aliases":["percentiles"],"games":[]},{"term":"Lote","definition":"Grupo de unidades que se procesa y registra como un trabajo en el modelo.","example":"Cada lote que sale de la prensa necesita su registro antes de considerarse expedido.","aliases":["lotes"],"games":["flujo"]},{"term":"Prensa","definition":"Máquina que aplica fuerza para dar forma al material. En este juego es un puesto de producción con capacidad limitada.","example":"Cada persona asignada a la prensa procesa dos lotes por minuto según las reglas del tablero.","aliases":["prensas"],"games":["flujo"]},{"term":"Laminación","definition":"Proceso industrial que transforma el material al hacerlo pasar entre rodillos. El juego simplifica esa operación para estudiar continuidad y colas.","example":"Aunque la parte industrial tenga capacidad, el registro de salidas puede limitar la expedición.","aliases":[],"games":["flujo"]},{"term":"Cotejo","definition":"Comparación entre dos registros para comprobar que se refieren a la misma operación y coinciden.","example":"Se compara el resguardo local con el registro central para evitar olvidar o duplicar una salida.","aliases":[],"games":[]},{"term":"Resguardo","definition":"Justificante local que acredita una operación realizada y permite registrarla o comprobarla después.","example":"Cuando el sistema central está aislado, se conserva un resguardo de cada lote expedido.","aliases":["resguardos"],"games":[]},{"term":"Talonario numerado","definition":"Cuaderno de justificantes con números distintos y consecutivos que permiten seguir las operaciones.","example":"Es más lento de rellenar que un papel libre en el modelo, pero permite cotejar después más resguardos por persona.","aliases":[],"games":[]},{"term":"Conciliación","definition":"Comprobación de que dos registros o el registro y la realidad vuelven a coincidir, resolviendo pérdidas y duplicados.","example":"Después de trabajar en papel, comparáis los lotes que salieron con las salidas guardadas en el sistema central.","aliases":["reconciliación","conciliar","reconciliar","conciliadas","cotejar","conciliadas","conciliados","reconciliados","reconciliadas","por reconciliar"],"games":[]},{"term":"Expedición","definition":"Salida registrada de un producto o pedido hacia su destino.","example":"Producir un lote no equivale a expedirlo: todavía necesita completar el registro de salida.","aliases":["expediciones","expedidos","expedid"],"games":["flujo","restauracion"]},{"term":"Sistema central","definition":"Registro o servicio compartido del que depende normalmente el trabajo de varios puestos.","example":"Si el registro central queda aislado, los puestos pueden necesitar justificantes locales para continuar.","aliases":["registro central"],"games":[]},{"term":"Relevo","definition":"Traspaso de una tarea entre personas o equipos, con lo que funciona, lo que falta y quién debe continuar.","example":"El siguiente turno recibe un acta con pruebas, pendientes y condiciones para cerrar el incidente.","aliases":[],"games":[]},{"term":"Revancha","definition":"Repetición comparativa de un caso con una condición modificada. Permite comprobar qué parte del plan dependía de ella.","example":"Repetís el plan anterior y comparáis el resultado antes de ajustar la decisión.","aliases":["repetición comparativa"],"games":[]},{"term":"min","definition":"Abreviatura de minutos. Conviene distinguir el tiempo de una fase del tiempo total transcurrido.","example":"Preparar durante treinta minutos y restaurar durante veinte ya consume cincuenta minutos.","aliases":["min."],"games":[]},{"term":"pers.","definition":"Abreviatura de personas asignadas a un puesto.","example":"Dos pers. en registro significa que dos de las seis personas disponibles se dedican a registrar los lotes.","aliases":[],"games":[]},{"term":"Disponibilidad","definition":"Posibilidad de acceder a la información o utilizar un servicio cuando se necesita y con las condiciones requeridas.","example":"La biblioteca puede estar físicamente abierta mientras su catálogo digital no está disponible.","aliases":[],"games":[]},{"term":"Certificación","definition":"Evaluación por la que se reconoce que un alcance concreto cumple unos requisitos. No significa ausencia de incidentes.","example":"Una certificación de un sistema de gestión debe leerse junto a su alcance y condiciones.","aliases":["certificaciones","certificado"],"games":[]},{"term":"Copia aislada","definition":"Copia protegida para que un fallo o una cuenta comprometida en el sistema principal no puedan modificarla por el mismo camino. Debe ser recuperable y estar probada.","example":"Si la cuenta que borra las reservas también puede borrar todas sus copias, todavía hay un problema compartido. Separáis permisos y mantenéis una versión protegida.","aliases":["copias aisladas"],"games":[]},{"term":"Albarán","definition":"Documento que deja constancia de una entrega de mercancía. Permite contrastar qué salió y qué recibió la otra parte.","example":"Antes de repetir un pedido aparentemente perdido, revisáis su albarán para no enviar dos veces la misma mercancía.","aliases":["albaranes"],"games":[]},{"term":"Extrusión","definition":"Proceso industrial que hace pasar un material por una abertura para darle una forma continua.","example":"El informe de Hydro habla de unidades de extrusión. La planta de laminación del juego es una recreación docente distinta y sus cifras no son las de aquella noticia.","aliases":[],"games":["flujo"]},{"term":"Índice de folios","definition":"Relación de las hojas o justificantes numerados para poder localizar y contrastar cada operación.","example":"Cuando vuelve la aplicación, el número de cada resguardo os ayuda a comprobar si ya se registró sin contarlo dos veces.","aliases":[],"games":["flujo"]},{"term":"Ciberataque","definition":"Acción intencionada contra sistemas, información o servicios digitales para acceder, alterar, interrumpir o causar otro perjuicio.","example":"Un ataque puede obligar a trabajar con registros manuales; la continuidad busca mantener el servicio esencial mientras se responde.","aliases":["ciberataques","cyber attack","cyber-attack"],"games":[]},{"term":"BIA","definition":"Business Impact Analysis, o análisis de impacto en el negocio. Estudia qué actividades importan, qué daño produce interrumpirlas y cuánto tiempo puede tolerarse.","example":"En el puerto se transforma en un encargo concreto: sacar un mínimo de órdenes y todas las urgentes antes de que salga el barco.","aliases":["análisis de impacto en el negocio"],"games":[]},{"term":"Riesgo residual","definition":"Riesgo que permanece después de aplicar las medidas. Cumplir un mínimo no hace desaparecer todo lo pendiente.","example":"Con la alternativa salen dieciséis de veinte órdenes. Las cuatro restantes todavía necesitan una decisión y seguimiento.","aliases":["riesgos residuales"],"games":[]},{"term":"Dependencia","definition":"Elemento que debe funcionar para que otra actividad pueda realizarse.","example":"La taquilla necesita tanto datos de reservas como una identidad autorizada para vender.","aliases":["dependencias"],"games":[]}];
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/\s+/g,' ').trim();
const byId=new Map(),aliases=new Map();
function add(item){
 const id=normalize(item.term);const previous=byId.get(id);
 const record={term:item.term,definition:item.definition,example:item.example||'',aliases:[...new Set([item.term,...(previous?.aliases||[]),...(item.aliases||[])])]};
 byId.set(id,record);
 for(const a of record.aliases)aliases.set(normalize(a),id);
}
for(const [term,definition] of Object.entries(window.continuidadApplied?.config?.gloss||{}))add({term,definition});
for(const item of additions)add(item);
// A canonical entry superseded by a more helpful alias need not appear twice.
for(const [id,r] of byId)if(aliases.get(id)!==id)byId.delete(id);
const records=[...byId.entries()].sort((a,b)=>a[1].term.localeCompare(b[1].term,'es'));
function patternPart(s){return normalize(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[aeioun]/g,c=>({a:'[aá]',e:'[eé]',i:'[ií]',o:'[oó]',u:'[uúü]',n:'[nñ]'}[c])).replace(/ /g,'\\s+');}
const pattern=new RegExp('(?<![\\p{L}\\p{N}_])('+[...aliases.keys()].sort((a,b)=>b.length-a.length).map(patternPart).join('|')+')(?![\\p{L}\\p{N}_])','giu');
function matches(s){pattern.lastIndex=0;return [...String(s).matchAll(pattern)].map(m=>({text:m[0],index:m.index,id:aliases.get(normalize(m[0]))})).filter(m=>m.id);}
function idsIn(s){return [...new Set(matches(s).map(m=>m.id))];}
function surfaceText(node){const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);const parts=[];let n;while((n=w.nextNode()))parts.push(n.textContent);return parts.join(' ');}

function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function showDefinition(id,remember=true){
 const r=byId.get(id);if(!r)return;
 if(remember&&currentIds.length===1&&currentIds[0]!==id)history.push(currentIds[0]);
 currentIds=[id];content.replaceChildren();const h=el('h2',r.term);h.id='lex-heading';h.tabIndex=-1;content.append(h);
 const p=el('p',r.definition);p.id='lex-definition';content.append(p);
 if(r.example){const ex=el('p',undefined,'lex-example');ex.append(el('b','Ejemplo en la práctica'),document.createTextNode(r.example));content.append(ex);}
 for(const p of content.querySelectorAll('p')){
  const walk=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=walk.nextNode()))if(n.parentElement.tagName!=='B')nodes.push(n);
  for(const node of nodes){const found=matches(node.textContent).filter(x=>x.id!==id);if(!found.length)continue;let at=0;const frag=document.createDocumentFragment();for(const m of found){frag.append(document.createTextNode(node.textContent.slice(at,m.index)));const b=el('button',m.text,'lex-term');b.type='button';b.dataset.lexPick=m.id;frag.append(b);at=m.index+m.text.length;}frag.append(document.createTextNode(node.textContent.slice(at)));node.replaceWith(frag);}
 }
 dialog.querySelector('#lex-back').hidden=!history.length;results.replaceChildren();search.value='';if(dialog.open)h.focus({preventScroll:true});
}
function showList(ids,title){
 currentIds=ids;content.replaceChildren();const h=el('h2',title||'Glosario del juego');h.id='lex-heading';h.tabIndex=-1;content.append(h);
 const p=el('p','Elegid una palabra para leer su significado y un ejemplo. Consultar esta ayuda no ejecuta ninguna orden.');p.id='lex-definition';content.append(p);drawList(ids);search.value='';
}
function drawList(ids){
 results.replaceChildren();const count=el('p',ids.length+' '+(ids.length===1?'término':'términos'),'lex-count');count.setAttribute('role','status');results.append(count);
 if(!ids.length){results.append(el('p','No aparece ese término. Probad con la sigla, una parte de la palabra o su significado.'));return;}
 const list=el('div',undefined,'lex-results');for(const id of ids){const r=byId.get(id),b=el('button',r.term);b.type='button';b.dataset.lexPick=id;const short=r.definition.length>100?r.definition.slice(0,97).replace(/\s+\S*$/,'')+'…':r.definition;b.append(el('small',short));list.append(b);}results.append(list);

function open(ids,trigger){

dialog.addEventListener('keydown',ev=>{
 if(ev.key!=='Tab')return;
 const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(n=>!n.hidden&&n.getClientRects().length);
 if(!focusable.length){ev.preventDefault();return;}
 const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
 if(ev.shiftKey&&(active===first||!dialog.contains(active))){ev.preventDefault();last.focus()}

});
