ct';const routes={norte:{n:'Fibra norte',cp:18,c:1,dep:'galería'},sur:{n:'Fibra sur',cp:15,c:1,dep:'galería'},radio:{n:'Radioenlace',cp:10,c:2,dep:'torre'},mesa:{n:'Mensajería',cp:6,c:1,dep:'pista'},ninguna:{n:'Sin apoyo',cp:0,c:0,dep:''}};

const baseTurns=[

const ice=[
P('Salida del buque sanitario','La fibra norte está en reparación. Mantened el embarque urgente y dejad expedientes listos para inspección.','El transportista acepta un comprobante emitido por el puesto de atraque.', ['norte'],true,22,9,17,9,3),
P('Pérdida de credenciales centrales','El enlace de radio está reservado para comunicaciones de seguridad. La identidad central no contesta.','Revisad el límite de altas locales antes de enviar al muelle más órdenes de las que puede autorizar.', ['torre'],false,19,8,14,8,3),
P('La canalización se inunda','Una entrada de agua corta la galería. La torre y el carril de mensajería funcionan.','Sumad la capacidad de los dos medios de transporte y comprobad después el techo de autorización.', ['galería'],true,24,9,15,9,4)];
const replay=ice.map((r,i)=>({...r,b:i===2?'La misma inundación deja la galería fuera. En esta hipótesis el directorio también pierde su enlace con el puesto de atraque.':r.b,remote:i===2?false:r.remote}));

ice[2].min=14;replay[2].min=14;
function routecap(k,r){const a=routes[k];return r.fail.includes(a.dep)||r.fail.includes(k)?0:a.cp}
function model(r,p){const a=routecap(p.main,r),b=routecap(p.spare,r),v=p.auth==='red'&&!r.remote?0:auth[p.auth][1],m=Math.min(r.demand,a+b,v),u=p.prio==='urg'?Math.min(m,r.urgent):Math.floor(m*r.urgent/r.demand),cost=routes[p.main].c+routes[p.spare].c+auth[p.auth][2];return {a,b,v,m,u,cost}}

e="#e7c17e"/><text x="419" y="125" text-anchor="middle" fill="white" font-size="11">Permiso</text><text x="419" y="145" text-anchor="middle" fill="#f3cd87" font-size="12">'+mc.v+' plazas</text><path d="M457 131h19" stroke="#8fb3b6" stroke-width="3"/><path d="M469 135h77l-11 13h-53z" fill="#73baae"/><path d="M479 133v-15h14v15m3 0v-19h14v19m3 0v-12h13v12" fill="#c9a478"/><path d="M524 114V85h5v30m-5-30h-42l-2 4h37" fill="#8daeb3"/><text x="506" y="169" fill="white" text-anchor="middle" font-size="11">Embarque</text><text x="12" y="258" fill="#bed4d4" font-size="10">Línea de puntos: tramo cortado · Capacidad por ventana de 10 min</text></svg>'}
const game={id:'puerto',title:'Puerto de guardia',company:'A.P. Moller – Maersk',board:'Plano de la terminal',command:'Orden de despacho',unit:'Una ventana = 10 minutos',run:'Despachar y medir',refs:[{autor:'A.P. Moller – Maersk',titulo:'Annual Report 2017 · riesgos y operaciones',url:'https://investor.maersk.com/system/files-encrypted/nasdaq_kms/assets/2018/04/25/13-00-21/A.P._Moller_-_Maersk_Annual_Report_2017.pdf'},{autor:'A.P. Moller – Maersk',titulo:'Interim Report Q2 2017',url:'https://investor.maersk.com/news-releases/news-release-details/interim-report-q2-2017'}],fact:'En junio de 2017 NotPetya afectó a Maersk Line, APM Terminals y Damco. El informe anual de Maersk estima el impacto total en 250–300 millones de dólares, incluyendo pérdida de ingresos y restauración de sistemas.',scope:'El tablero recrea las decisiones de un puerto dependiente de órdenes electrónicas. La terminal, las obras, las capacidades y las órdenes son supuestos didácticos. El informe de Maersk no atribuye el incidente a una zanja inundada.',lesson:'Una orden llega a embarque cuando dispone de transporte y autorización. El servicio mínimo se comprueba con órdenes completadas y urgentes atendidas.',gloss:{'BIA':'Análisis de impacto en el negocio. Identifica qué actividad debe mantenerse, a quién perjudica su interrupción y cuánto tiempo puede tolerarse.','servicio mínimo':'Cantidad mínima de trabajo válido que debe completarse en un intervalo. Aquí exige un total y un número de órdenes urgentes.','dependencia común':'Componente compartido cuyo fallo puede inutilizar dos alternativas. Aquí la galería transporta ambas fibras.','directorio':'Servicio central que permite comprobar si la persona que emite una orden está autorizada.','permiso local':'Autorización previamente aprobada, verificable en el puesto sin consultar el directorio.','capacidad':'Número máximo de órdenes que pasa en una ventana.','radioenlace':'Conexión de datos por radio que usa la torre y evita la galería subterránea.','lista firmada':'Relación de autorizaciones ya verificadas que puede comprobarse sin conexión.','urgentes':'Órdenes con vencimiento en esta ventana, como las de un contenedor refrigerado.','revancha':'Repetición de la misión anterior con un solo supuesto modificado.'},cases:[{name:'Primer atraque',turns:baseTurns},{name:'Patio refrigerado',turns:val},{name:'Ventana sanitaria',turns:ice},{name:'El mismo muelle',turns:replay,delta:'Repetid las mismas decisiones de Ventana sanitaria. Solo cambia la disponibilidad del directorio en la tercera ventana. Anotad cuántas órdenes se pierden y qué recupera el permiso local.'}],initial:()=>({total:0,urgent:0}),defaults:()=>({main:'norte',spare:'ninguna',auth:'red',prio:'fifo'}),goal:r=>'Mínimo '+r.min+' de '+r.demand+' órdenes, incluidas '+r.essential+' de '+r.urgent+' urgentes. Presupuesto: '+r.budget+' créditos.',
controls(p,r){return btnset('Vía principal · capacidad / créditos','main',Object.entries(routes).filter(([k])=>k!=='ninguna').map(([k,v])=>[k,v.n+' '+v.cp+'/'+v.c]),p.main)+btnset('Vía de apoyo · capacidad restante','spare',Object.entries(routes).map(([k,v])=>[k,k==='ninguna'?'Ninguna':v.n]),p.spare)+btnset('Cómo se autoriza · plazas / créditos','auth',Object.entries(auth).map(([k,v])=>[k,v[0]+' '+v[1]+'/'+v[2]]),p.auth)+btnset('Política de cola','prio',Object.entries(prior),p.prio)},
change(p,k,v){if((k==='main'&&v===p.spare)||(k==='spare'&&v===p.main))return 'Cada vía solo aporta su capacidad una vez. Elegid una ruta distinta.';p[k]=v},coach(r,p,z){if(z)return z.ok?'Comprobad ambos objetivos en el parte y abrid la siguiente ventana.':'Leed la causa del fallo y pulsad «Repetir esta ventana». Conserváis el mismo aviso.';const f=['main','spare','auth','prio'],i=f.findIndex((k,i)=>p[k]!==r.guide[i]);return i<0?'El plan está listo. Antes de pulsar «Despachar y medir», calculad cuántas órdenes caben.':['En «Vía principal» elegid '+routes[r.guide[0]].n+'. El mapa marca qué tramos se han cortado.','Ahora marcad '+routes[r.guide[1]].n+' como apoyo. Se utiliza cuando se llena la vía principal.','Elegid '+auth[r.guide[2]][0]+'. Este control determina cuántas órdenes podrán firmarse.','En «Política de cola», elegid «Urgentes primero» para reservar plazas a las órdenes con plazo.'][i]},art:scene,metrics(r,p,prev,z){const q=model(r,p);return [['Transporte disponible',(q.a+q.b)+' plazas'],['Validación disponible',q.v+' plazas'],['Coste del plan',q.cost+' / '+r.budget]]},simulate(r,p,prev){const q=model(r,p),ok=q.m>=r.min&&q.u>=r.essential&&q.cost<=r.budget,detail='Pasan '+q.a+' plazas por la vía principal y '+q.b+' por el apoyo. De '+r.demand+' órdenes, '+q.m+' tienen transporte y permiso, incluidas '+q.u+' urgentes. Coste '+q.cost+' de '+r.budget+' créditos.',why=q.cost>r.budget?'El plan supera el presupuesto. Retirad un medio que no añade entregas.':q.m<r.min?(q.v<r.min?'El límite está en la autorización. Probad un permiso que siga operativo.':'El límite está en las rutas. Buscad un respaldo que evite el componente cortado.'):(q.u<r.essential?'El caudal basta, pero se quedan urgencias en cola. Cambiad el orden de despacho.':'El plan conserva el servicio mínimo y la prioridad dentro del presupuesto.');return {ok,detail,why,summary:q.m+'/'+r.demand+' despachadas · '+q.u+'/'+r.urgent+' urgentes · '+q.cost+' créditos',plan:planText(p),after:{total:prev.total+q.m,urgent:prev.urgent+q.u}}},rules(r){return '<p>Una ventana dura diez minutos. Las vías principal y de apoyo suman sus plazas disponibles. Si comparten un componente cortado, ambas pierden su capacidad. El directorio valida 24 órdenes cuando está disponible. El permiso local valida 14 y cuesta un crédito. La lista firmada valida 8.</p><p>Órdenes completadas = el menor valor entre demanda, plazas de transporte y plazas de validación. Con prioridad urgente se atienden primero todas las urgentes que caben. Al elegir «Por llegada», el modelo las reparte en proporción a la demanda y redondea hacia abajo. Las órdenes no despachadas pierden su ventana y se registran como pendientes de otro embarque.</p><p>Los costes se muestran en la primera fila. El apoyo paga el mismo coste que la vía principal. La incidencia permite ejecutar un ensayo con exceso de presupuesto, pero ese plan no cumple el encargo.</p>'}};

function enhanceInline(){const keys=Object.keys(cfg.gloss).sort((a,b)=>b.length-a.length),pattern=new RegExp('(?<![\\p{L}\\p{N}])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu'),walk=document.createTreeWalker(host,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=walk.nextNode())if(!n.parentElement.closest('button,summary,.apply-terms,ol'))nodes.push(n);for(const node of nodes){const str=node.textContent;pattern.lastIndex=0;if(!pattern.test(str))continue;pattern.lastIndex=0;const f=document.createDocumentFragment();let end=0;for(const m of str.matchAll(pattern)){f.append(document.createTextNode(str.slice(end,m.index)));const b=document.createElement('button');b.className='apply-inline';b.dataset.applyTerm=keys.find(k=>k.toLocaleLowerCase('es')===m[0].toLocaleLowerCase('es'));b.textContent=m[0];f.append(b);end=m.index+m[0].length}f.append(document.createTextNode(str.slice(end)));node.replaceWith(f)}}
function render(){const d=cfg.decisiones[st.index],v=st.answers[st.index],o=v===null?null:d.opciones[v];
 host.innerHTML='<header><div><div class="apply-kicker">Última orden · decisiones con consecuencias</div><h2>Entregad un servicio que podáis defender</h2></div><div class="apply-meter">'+score()+' / 3</div></header><p>Aplicad los conceptos al servicio que acabáis de operar. Las consecuencias de estas tres tarjetas son supuestos explícitos del ejercicio; no cambian las reglas del tablero. Probad una orden, leed qué produce y corregidla cuando haga falta.</p><div class="apply-kicker">Decisión '+(st.index+1)+' de 3 · '+e(d.concepto)+'</div><h3>'+e(d.titulo)+'</h3><p>'+e(d.contexto)+'</p><details id="apply-hint"><summary>Ayuda de guardia</summary><p>'+e(d.pista)+'</p></details><div class="apply-choices">'+d.opciones.map((x,i)=>'<button data-apply-option="'+i+'" aria-pressed="'+(v===i)+'">'+e(x.titulo)+'</button>').join('')+'</div>'+(o?'<div class="apply-feedback" data-ok="'+o.correcta+'" role="status"><b>'+e(o.efecto)+'</b><p>'+e(o.porque)+'</p><small>'+(o.correcta?'Orden justificada. Podéis conservarla en el parte.':'Volved a los datos y ensayad otra orden; el intento queda registrado.')+'</small></div>':'')+'<div class="apply-actions">'+(st.index?'<button data-apply-nav="'+(st.index-1)+'">Revisar anterior</button>':'')+(st.index<2?'<button class="primary" data-apply-nav="'+(st.index+1)+'" '+(!o?.correcta?'disabled':'')+'>Conservar y continuar</button>':score()===3?'<strong>✓ Cierre aplicado completo · incluido en vuestro PDF</strong>':'')+'<button data-apply-reset>Repetir estas decisiones</button></div><div class="apply-terms">'+Object.keys(cfg.gloss).map(t=>'<button data-apply-term="'+e(t)+'">'+e(t)+'</button>').join('')+'</div><details><summary>Conceptos y fuentes</summary><p>'+e(cfg.concepto)+'</p><ol>'+cfg.fuentes.map(r=>'<li>'+e(r.autor)+'. <a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+e(r.titulo)+'</a>.</li>').join('')+'</ol><p>Datos de estas decisiones: modelo docente; no son cifras del incidente histórico.</p></details><p><small>'+(saving?'Estas decisiones se guardan en este navegador y se incluyen en el parte imprimible.':'El navegador no permite guardar. Conservad vuestro parte en PDF.')+'</small> · <a href="ejemplos/'+String(cfg.numero).padStart(2,'0')+'_Parte_resuelto.pdf" target="_blank" rel="noopener">Descargar parte resuelto en PDF</a></p>';
enhanceInline();
}
host.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if('applyOption'in d){const v=Number(d.applyOption);if(!Number.isInteger(v)||v<0||v>2)return;st.answers[st.index]=v;st.attempts[st.index].push(v);st.attempts[st.index]=st.attempts[st.index].slice(-30);persist();render();host.querySelector('.apply-feedback')?.scrollIntoView({block:'nearest',behavior:'instant'})}else if('applyNav'in d){const n=Number(d.applyNav);if(n<0||n>2||n>st.index&&!cfg.decisiones[st.index].opciones[st.answers[st.index]]?.correcta)return;st.index=n;persist();render();host.scrollIntoView({block:'start',behavior:'instant'})}else if('applyTerm'in d)glossary(d.applyTerm);else if('applyReset'in d){st={index:0,answers:[null,null,null],attempts:[[],[],[]]};persist();render()}});
const jump=document.createElement('button');jump.textContent='Última orden · aplicar conceptos';jump.className='apply-shortcut';jump.id='apply-jump';jump.onclick=()=>{host.scrollIntoView({block:'start',behavior:'instant'});host.querySelector('summary')?.focus({preventScroll:true})};const tools=document.querySelector('.tools')||document.querySelector('.head');tools?.append(jump);
function report(){return '<section class="apply-doc" data-apply-report><h2>Última orden · justificación del cierre</h2><p>'+score()+' de 3 decisiones justificadas. Datos de este apartado: supuestos docentes independientes del incidente histórico.</p>'+cfg.decisiones.map((d,i)=>{const v=st.answers[i],o=v===null?null:d.opciones[v];return '<article><h3>'+e(d.titulo)+'</h3><p>'+e(d.contexto)+'</p>'+(o?'<p><b>Orden:</b> '+e(o.titulo)+'</p><p><b>Resultado:</b> '+e(o.efecto)+'</p><p><b>Razón:</b> '+e(o.porque)+'</p><p>Estado: '+(o.correcta?'justificada':'requiere revisión')+' · '+st.attempts[i].length+' ensayos.</p>':'<p>Pendiente de resolver.</p>')+'</article>'}).join('')+'<h3>Marco de los conceptos</h3><ol class="sources">'+cfg.fuentes.map(r=>'<li>'+e(r.autor)+'. '+e(r.titulo)+'. '+e(r.url)+'</li>').join('')+'</ol></section>'}
function appendReport(id){const el=document.getElementById(id);if(el){el.querySelector('[data-apply-report]')?.remove();el.insertAdjacentHTML('beforeend',report())}}
if(cfg.id==='puerto'||cfg.id==='flujo'){const old=reportHTML;reportHTML=function(){return old()+report()};window.addEventListener('beforeprint',()=>appendReport('printArea'))}
else if(cfg.id==='relevo'){const old=renderPrint;renderPrint=function(){old();appendReport('print')};window.addEventListener('beforeprint',()=>appendReport('print'))}
else{const old=makeReport;makeReport=function(){old();appendReport('report')};window.addEventListener('beforeprint',()=>appendReport('report'))}
// Source definitions remain editable; no remote script, tracking or generated answer request.
render();window.continuidadApplied={config:cfg,state:()=>JSON.parse(JSON.stringify(st)),report};
})();
</script>

<script>
(()=>{'use strict';
/* Definitions are local. This layer never changes an order, score or saved game. */
const additions=[{"term":"Ciberseguridad","definition":"Protección de los sistemas, los datos y los servicios frente a usos no autorizados, alteraciones e interrupciones.","example":"Una cuenta con permisos limitados reduce lo que puede hacer quien consiga robarla.","aliases":["Cybersecurity"],"games":[]},{"term":"Continuidad","definition":"Forma prevista de mantener las actividades importantes cuando falla la manera habitual de trabajar.","example":"Una taquilla puede seguir vendiendo con un procedimiento alternativo, aunque su aplicación principal esté caída.","aliases":["continuidad del negocio"],"games":[]},{"term":"Recuperación","definition":"Restablecimiento comprobado del servicio y de las condiciones acordadas para utilizarlo.","example":"Encender el servidor es un paso; comprobar que una reserva se guarda una sola vez permite saber si el servicio vuelve a funcionar.","aliases":["recuperaciones","recovery","disaster recovery","data recovery","event recovery"],"games":[]},{"term":"Restauración","definition":"Proceso de reconstruir datos o sistemas a partir de una copia conservada. Después hay que comprobar que sirven para trabajar.","example":"Recuperáis la base de reservas de las 11:25 y aplicáis los cambios posteriores que se conservaron.","aliases":["restaurar"],"games":[]},{"term":"BIA","definition":"Business Impact Analysis, o análisis de impacto en el negocio. Estudia qué actividades importan, qué daño produce interrumpirlas y cuánto tiempo puede tolerarse.","example":"En el puerto se transforma en un encargo concreto: sacar un mínimo de órdenes y todas las urgentes antes de que salga el barco.","aliases":["análisis de impacto en el negocio"],"games":[]},{"term":"Servicio mínimo","definition":"Nivel de trabajo que la organización considera indispensable durante una interrupción. Puede exigir cantidad, plazo, calidad y prioridades a la vez.","example":"Enviar las siete cargas urgentes no basta si el encargo exige también completar al menos catorce órdenes.","aliases":["mínimo de servicio","mínimos de servicio"],"games":[]},{"term":"Activo","definition":"Algo que tiene valor para la organización y necesita atención: datos, equipos, personas, instalaciones o servicios.","example":"Las órdenes de embarque y la galería por la que pasan los cables son activos distintos, y ambos pueden afectar al puerto.","aliases":["activos"],"games":[]},{"term":"Amenaza","definition":"Suceso o circunstancia que puede causar daño. No tiene por qué ser un atacante.","example":"Una excavadora que corta la galería amenaza las dos conexiones que comparten ese recorrido.","aliases":["amenazas"],"games":[]},{"term":"Vulnerabilidad","definition":"Debilidad que una amenaza puede aprovechar para causar daño. Puede estar en un programa, un proceso o un diseño.","example":"Dos fibras en la misma galería ofrecen dos contratos, pero conservan la debilidad de un único punto de corte.","aliases":["vulnerabilidades"],"games":[]},{"term":"Impacto","definition":"Consecuencia que el incidente produce en la organización o en las personas.","example":"Si una carga refrigerada pierde el barco, el impacto puede incluir retraso, mercancía dañada y compromisos incumplidos.","aliases":["impactos"],"games":[]},{"term":"Riesgo","definition":"Posibilidad de que un suceso perjudique un objetivo, considerando tanto qué podría ocurrir como sus consecuencias.","example":"Aunque hoy el directorio funcione, hay que valorar qué pasaría si dejara de autorizar órdenes durante el embarque.","aliases":["riesgos"],"games":[]},{"term":"Riesgo residual","definition":"Riesgo que permanece después de aplicar las medidas. Cumplir un mínimo no hace desaparecer todo lo pendiente.","example":"Con la alternativa salen dieciséis de veinte órdenes. Las cuatro restantes todavía necesitan una decisión y seguimiento.","aliases":["riesgos residuales"],"games":[]},{"term":"Salvaguarda","definition":"Medida que reduce la posibilidad de un problema o sus consecuencias. Puede ser técnica, física u organizativa.","example":"Una lista de permisos preparada de antemano permite autorizar trabajo cuando falla el directorio central.","aliases":["salvaguardas"],"games":[]},{"term":"Control","definition":"Medida que modifica un riesgo o ayuda a comprobar que se cumplen unas condiciones. Debe tener un propósito y probarse.","example":"La prueba de reserva y relectura comprueba algo más útil que mirar si la portada de la aplicación carga.","aliases":["controles"],"games":[]},{"term":"Dependencia","definition":"Elemento que debe funcionar para que otra actividad pueda realizarse.","example":"La taquilla necesita tanto datos de reservas como una identidad autorizada para vender.","aliases":["dependencias"],"games":[]},{"term":"Dependencia común","definition":"Elemento compartido cuyo fallo puede inutilizar varias alternativas a la vez.","example":"Dos cables de compañías distintas siguen dependiendo de la misma galería si pasan por ella.","aliases":["dependencias comunes","dependencia compartida","dependencias compartidas"],"games":[]},{"term":"Redundancia","definition":"Disponibilidad de elementos alternativos para continuar cuando alguno falla. Su utilidad depende de que el mismo problema no los inutilice juntos.","example":"Una conexión por radio puede aportar una alternativa a la fibra enterrada; otra fibra en la misma zanja puede caer a la vez.","aliases":[],"games":[]},{"term":"Independencia","definition":"Separación suficiente para que una misma causa no haga fallar las alternativas al mismo tiempo. Hay que comprobarla, no deducirla del nombre del proveedor.","example":"Radio y mensajería evitan la galería, aunque pueden conservar otras dependencias comunes.","aliases":[],"games":[]},{"term":"Capacidad","definition":"Cantidad máxima de trabajo que una parte del sistema puede realizar en el intervalo indicado.","example":"Un canal que permite diez órdenes por ventana no puede transportar veinte solo porque esas veinte sean urgentes.","aliases":["capacidades"],"games":[]},{"term":"Ventana","definition":"Intervalo de tiempo que se simula en una ronda. Su duración y reglas aparecen en cada juego.","example":"En Puerto de guardia, una ventana representa diez minutos de operación.","aliases":["ventanas","ventana de tiempo"],"games":[]},{"term":"Crédito","definition":"Unidad del presupuesto del juego. Permite comparar el coste de las decisiones y no representa un precio real del incidente.","example":"Podéis gastar hasta cuatro créditos en canales y autorizaciones durante una ventana.","aliases":["créditos"],"games":[]},{"term":"Pronóstico","definition":"Resultado que calculáis o esperáis antes de ejecutar la prueba. Sirve para comparar vuestra idea con lo que ocurre.","example":"Antes de despachar, sumáis la capacidad de las vías y la limitáis por la autorización disponible.","aliases":["pronósticos"],"games":[]},{"term":"Supuesto","definition":"Condición que se da por válida en el modelo para poder razonar. Si cambia, puede cambiar el resultado.","example":"Que el directorio responda es un supuesto del primer ensayo. La revancha permite comprobar qué ocurre cuando falla.","aliases":["supuestos"],"games":[]},{"term":"Ensayo","definition":"Prueba de una decisión en unas condiciones conocidas, con un resultado que se puede observar.","example":"Compráis una alternativa y la probáis antes de atribuirle una reducción de las interrupciones.","aliases":["ensayos","ensayar"],"games":[]},{"term":"Eficacia","definition":"Grado en que una medida consigue el resultado previsto en las condiciones comprobadas.","example":"La ruta alternativa es eficaz para el mínimo si transporta las órdenes necesarias dentro del plazo.","aliases":["eficaz","eficaces","efectividad"],"games":[]},{"term":"Hipótesis","definition":"Explicación posible que todavía necesita comprobarse.","example":"Pensar que se rompió un disco puede orientar una prueba, pero un mensaje de pasillo no demuestra que esa sea la causa.","aliases":["hipótesis causal"],"games":[]},{"term":"Validación","definition":"Comprobación de que un resultado cumple las condiciones acordadas para su uso.","example":"Una reserva se considera recuperada cuando ocupa una butaca y aparece una sola vez en la caja, no solo cuando el archivo se abre.","aliases":["validar","validaciones"],"games":[]},{"term":"Aceptación","definition":"Decisión explícita de dar por suficiente un resultado o conservar un riesgo según los criterios acordados. Requiere una persona responsable.","example":"Un cierre parcial deja constancia de qué funciona, qué falta y qué prueba permitiría cerrar lo pendiente.","aliases":["aceptar el riesgo","aceptación del riesgo"],"games":[]},{"term":"Responsable","definition":"Persona o área que debe decidir, responder del resultado y mantener el seguimiento.","example":"El área de taquilla confirma que la venta vuelve a funcionar; el equipo técnico aporta las pruebas.","aliases":["responsables"],"games":[]},{"term":"Incidente","definition":"Suceso que compromete o amenaza la seguridad o el funcionamiento esperado y requiere una actuación organizada.","example":"Un borrado que impide asignar las reservas necesita identificación, contención y recuperación.","aliases":["incidentes"],"games":[]},{"term":"NIST","definition":"Instituto Nacional de Estándares y Tecnología de Estados Unidos. Publica guías y marcos que ayudan a organizar y evaluar la ciberseguridad.","example":"Un marco de NIST puede ayudar a ordenar resultados deseados; no sustituye la decisión concreta de quién mantiene el embarque.","aliases":[],"games":[]},{"term":"NIST CSF","definition":"Cybersecurity Framework, marco de ciberseguridad de NIST. Su versión 2.0 organiza resultados mediante gobernar, identificar, proteger, detectar, responder y recuperar.","example":"Podéis relacionar la preparación de permisos con proteger y la prueba de reapertura con recuperar.","aliases":["CSF","CSF 2.0"],"games":[]},{"term":"Framework","definition":"Marco de trabajo que organiza ideas, objetivos o prácticas. No suele ser una receta que se aplique igual a todas las organizaciones.","example":"NIST CSF ayuda a ordenar lo que se quiere conseguir; el plan de vuestra organización concreta responsables y acciones.","aliases":["frameworks","marco de trabajo"],"games":[]},{"term":"PDF","definition":"Portable Document Format, formato de documento que conserva la composición de las páginas.","example":"El parte en PDF permite guardar las decisiones y resultados para revisarlos después.","aliases":[],"games":[]},{"term":"JSON","definition":"JavaScript Object Notation, formato de texto para guardar datos mediante nombres y valores.","example":"Una exportación JSON puede guardar el estado de la partida para que un programa vuelva a leerlo.","aliases":[],"games":[]},{"term":"Offline","definition":"Sin conexión al servicio o la red de la que depende la operación habitual.","example":"Un catálogo local puede consultarse aunque la conexión al sistema central no funcione.","aliases":["sin conexión"],"games":[]},{"term":"NotPetya","definition":"Programa destructivo que se extendió en 2017 y provocó interrupciones graves en varias organizaciones. Su apariencia de rescate no hacía viable recuperar los datos pagando.","example":"El caso de Maersk sirve para hablar de dependencias y continuidad; las cifras del tablero son supuestos docentes.","aliases":[],"games":[]},{"term":"Directorio","definition":"Servicio central que permite comprobar identidades y autorizaciones. Si deja de responder, puede impedir operaciones aunque la red funcione.","example":"El canal transporta dieciséis órdenes, pero ninguna sale si nadie puede confirmar que están autorizadas.","aliases":["directorios"],"games":[]},{"term":"Credencial","definition":"Dato o documento usado para acreditar una identidad o una autorización.","example":"Una credencial de sala permite comprobar quién puede acceder cuando el sistema central no responde.","aliases":["credenciales"],"games":[]},{"term":"Autorización","definition":"Permiso para realizar una acción concreta. Es diferente de que exista una conexión disponible.","example":"Tener radio no basta para embarcar si el puesto no puede comprobar el permiso de la orden.","aliases":["autorizaciones","autoriza"],"games":[]},{"term":"Permiso local","definition":"Autorización preparada que puede comprobarse en el propio puesto, sin consultar el directorio central.","example":"Puede mantener catorce órdenes por ventana, aunque las comunicaciones permitan transportar más.","aliases":["permisos locales"],"games":[]},{"term":"Lista firmada","definition":"Relación de autorizaciones cuyo origen se ha confirmado y que se puede consultar localmente. La firma y el procedimiento usados deben permitir confiar en ella.","example":"El puesto usa una lista aprobada mientras no puede consultar el directorio.","aliases":["listas firmadas"],"games":[]},{"term":"Radioenlace","definition":"Conexión de datos mediante radio entre puntos. En el juego utiliza una torre y evita la galería enterrada.","example":"Si las obras cortan las fibras, la radio puede seguir aportando diez plazas.","aliases":["radioenlaces"],"games":[]},{"term":"Fibra","definition":"Cable que transporta información mediante luz. Su recorrido físico importa aunque el servicio se contrate por separado.","example":"Fibra norte y fibra sur pueden fallar juntas porque atraviesan la misma galería.","aliases":["fibras","fibra óptica"],"games":["puerto"]},{"term":"Galería","definition":"Conducto o paso por el que discurren instalaciones. En este juego las dos fibras comparten ese recorrido.","example":"Una excavación que corta la galería deja fuera las dos fibras a la vez.","aliases":["galerías"],"games":["puerto"]},{"term":"Mensajería","definition":"Alternativa en la que las órdenes se trasladan físicamente por una ruta disponible. Aquí no significa un chat.","example":"Un mensajero lleva hasta seis órdenes al puesto cuando las conexiones no bastan.","aliases":[],"games":["puerto"]},{"term":"Atraque","definition":"Puesto y operación de colocar un buque en el muelle para trabajar con él.","example":"Primer atraque es el caso guiado del puerto, con una ventana concreta de embarque.","aliases":["atraques"],"games":["puerto"]},{"term":"Urgentes","definition":"Trabajos cuyo plazo vence antes y que deben priorizarse según las reglas del encargo.","example":"Una carga refrigerada puede perder su utilidad si espera a la siguiente salida.","aliases":["urgente","urgencia","urgencias"],"games":[]},{"term":"Política de cola","definition":"Regla que determina qué trabajo pasa primero cuando no se puede atender todo a la vez.","example":"Por llegada atiende según el orden de entrada; urgentes primero da prioridad a los plazos críticos.","aliases":["disciplina de cola"],"games":[]},{"term":"FIFO","definition":"First In, First Out: lo primero que entra es lo primero que sale. Es una regla de atención por orden de llegada.","example":"El lote que llegó antes pasa antes que otro posterior, aunque este último sea urgente.","aliases":["por llegada","por antigüedad"],"games":[]},{"term":"Cola","definition":"Trabajo que está esperando porque todavía no ha podido pasar al siguiente paso.","example":"Los lotes pueden acumularse antes de la prensa o antes de registrar la expedición.","aliases":["colas"],"games":[]},{"term":"Identidad","definition":"Información que permite reconocer a una persona, cuenta o servicio para decidir qué puede hacer.","example":"La taquilla necesita reconocer a la cuenta que realiza la venta antes de autorizarla.","aliases":["identidades"],"games":[]},{"term":"Exposición","definition":"Situación de un activo o servicio frente a un posible daño. En El patronato se observa con un indicador de interrupciones esperadas, no con toda la evaluación de riesgos.","example":"Un horario más largo de uso del catálogo puede aumentar las horas-servicio esperadas si no cambia la protección.","aliases":["exposiciones"],"games":[]},{"term":"Relevo","definition":"Traspaso de una tarea entre personas o equipos, con lo que funciona, lo que falta y quién debe continuar.","example":"El siguiente turno recibe un acta con pruebas, pendientes y condiciones para cerrar el incidente.","aliases":[],"games":[]},{"term":"Revancha","definition":"Repetición comparativa de un caso con una condición modificada. Permite comprobar qué parte del plan dependía de ella.","example":"Repetís el plan anterior y comparáis el resultado antes de ajustar la decisión.","aliases":["repetición comparativa"],"games":[]},{"term":"min","definition":"Abreviatura de minutos. Conviene distinguir el tiempo de una fase del tiempo total transcurrido.","example":"Preparar durante treinta minutos y restaurar durante veinte ya consume cincuenta minutos.","aliases":["min."],"games":[]},{"term":"Software","definition":"Programas e instrucciones que permiten realizar tareas en un equipo.","example":"La aplicación de reservas es software; el corte de una galería necesita una medida física, no solo corregir ese programa.","aliases":[],"games":[]},{"term":"Servidor","definition":"Equipo o programa que presta un servicio a otros equipos o personas.","example":"Un servidor puede estar encendido y responder, pero el servicio de venta seguir fallando porque los datos son incorrectos.","aliases":["servidores"],"games":[]},{"term":"Disponibilidad","definition":"Posibilidad de acceder a la información o utilizar un servicio cuando se necesita y con las condiciones requeridas.","example":"La biblioteca puede estar físicamente abierta mientras su catálogo digital no está disponible.","aliases":[],"games":[]},{"term":"CSRC","definition":"Computer Security Resource Center, el centro de recursos de seguridad informática del NIST. Reúne publicaciones y un glosario técnico.","example":"En las fuentes del juego, CSRC indica dónde se publica una guía o se puede comprobar el significado de un término.","aliases":[],"games":[]},{"term":"Q2","definition":"Second quarter: segundo trimestre de un año, de abril a junio. Es una abreviatura habitual en informes económicos.","example":"En una referencia histórica, Q2 señala el periodo del informe. No describe una fase del incidente ni una puntuación del juego.","aliases":[],"games":["puerto"]},{"term":"Ciberresiliencia","definition":"Capacidad de anticipar un problema digital, seguir prestando lo esencial mientras ocurre, recuperar el servicio y aprender para la próxima vez.","example":"Si falla el sistema de préstamos, la biblioteca mantiene una salida controlada en papel y después comprueba que los libros y el registro coinciden.","aliases":[],"games":[]}];
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/\s+/g,' ').trim();
const byId=new Map(),aliases=new Map();
function add(item){
 const id=normalize(item.term);const previous=byId.get(id);
 const record={term:item.term,definition:item.definition,example:item.example||'',aliases:[...new Set([item.term,...(previous?.aliases||[]),...(item.aliases||[])])]};
 byId.set(id,record);
 for(const a of record.aliases)aliases.set(normalize(a),id);
}
for(const [term,definition] of Object.entries(window.continuidadApplied?.config?.gloss||{}))add({term,definition});
for(const item of additions)add(item);
// A canonical entry superseded by a more helpful alias need not appear twice.
for(const [id,r] of byId)if(aliases.get(id)!==id)byId.delete(id);
const records=[...byId.entries()].sort((a,b)=>a[1].term.localeCompare(b[1].term,'es'));

document.head.append(style);
const dialog=document.createElement('dialog');dialog.id='lex-dialog';dialog.setAttribute('aria-labelledby','lex-heading');dialog.setAttribute('aria-describedby','lex-definition');

setSize();

function showDefinition(id,remember=true){
 const r=byId.get(id);if(!r)return;
 if(remember&&currentIds.length===1&&currentIds[0]!==id)history.push(currentIds[0]);
 currentIds=[id];content.replaceChildren();const h=el('h2',r.term);h.id='lex-heading';h.tabIndex=-1;content.append(h);

 if(r.example){const ex=el('p',undefined,'lex-example');ex.append(el('b','Ejemplo en la práctica'),document.createTextNode(r.example));content.append(ex);}
 for(const p of content.querySelectorAll('p')){
  const walk=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=walk.nextNode()))if(n.parentElement.tagName!=='B')nodes.push(n);
  for(const node of nodes){const found=matches(node.textContent).filter(x=>x.id!==id);if(!found.length)continue;let at=0;const frag=document.createDocumentFragment();for(const m of found){frag.append(document.createTextNode(node.textContent.slice(at,m.index)));const b=el('button',m.text,'lex-term');b.type='button';b.dataset.lexPick=m.id;frag.append(b);at=m.index+m.text.length;}frag.append(document.createTextNode(node.textContent.slice(at)));node.replaceWith(frag);}
 }
 dialog.querySelector('#lex-back').hidden=!history.length;results.replaceChildren();search.value='';if(dialog.open)h.focus({preventScroll:true});
}
function showList(ids,title){
 currentIds=ids;content.replaceChildren();const h=el('h2',title||'Glosario del juego');h.id='lex-heading';h.tabIndex=-1;content.append(h);
 const p=el('p','Elegid una palabra para leer su significado y un ejemplo. Consultar esta ayuda no ejecuta ninguna orden.');p.id='lex-definition';content.append(p);drawList(ids);search.value='';
}
function drawList(ids){
 results.replaceChildren();const count=el('p',ids.length+' '+(ids.length===1?'término':'términos'),'lex-count');count.setAttribute('role','status');results.append(count);
 if(!ids.length){results.append(el('p','No aparece ese término. Probad con la sigla, una parte de la palabra o su significado.'));return;}
 const list=el('div',undefined,'lex-results');for(const id of ids){const r=byId.get(id),b=el('button',r.term);b.type='button';b.dataset.lexPick=id;const short=r.definition.length>100?r.definition.slice(0,97).replace(/\s+\S*$/,'')+'…':r.definition;b.append(el('small',short));list.append(b);}results.append(list);

function open(ids,trigger){
 const valid=[...new Set((ids||[]).filter(id=>byId.has(id)))];returnFocus=trigger||document.activeElement;
 history=[];currentIds=[];dialog.querySelector('#lex-back').hidden=true;

function close(){dialog.close();}
dialog.querySelector('#lex-close').addEventListener('click',close);

dialog.querySelector('#lex-size').addEventListener('click',()=>{isLarge=!isLarge;setSize();try{localStorage.setItem('continuidad.vocabulario.texto-grande',isLarge?'1':'0')}catch{}});
dialog.addEventListener('click',ev=>{const p=ev.target.closest('[data-lex-pick]');if(p){ev.preventDefault();showDefinition(p.dataset.lexPick)}else if(ev.target===dialog)close();});

dialog.addEventListener('keydown',ev=>{
 if(ev.key!=='Tab')return;
 const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(n=>!n.hidden&&n.getClientRects().length);
 if(!focusable.length){ev.preventDefault();return;}
 const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;

const legacyTerms='[data-term],[data-apply-term],[data-do="term"]';
function legacyId(node){return aliases.get(normalize(node.dataset.term||node.dataset.applyTerm||node.dataset.v||''));}
const ownSelector='#lex-dialog,#continuidad-vocabulary-style,.lex-reading-guide';
const excluded='script,style,code,pre,kbd,samp,input,textarea,option,select,svg,button,a,label,summary,noscript,#printArea,#report,#print,[data-apply-report],'+ownSelector;

function enrich(){
 observer.disconnect();
 try{
  for(const node of document.querySelectorAll(legacyTerms)){

   const found=matches(n.textContent);if(!found.length)continue;const fragment=document.createDocumentFragment();let at=0;
   for(const match of found){fragment.append(document.createTextNode(n.textContent.slice(at,match.index)));const b=el('button',match.text,'lex-term');b.type='button';attachAccessibility(b,[match.id]);b.setAttribute('aria-label','Explicar '+match.text);fragment.append(b);at=match.index+match.text.length;}
   fragment.append(document.createTextNode(n.textContent.slice(at)));n.replaceWith(fragment);
  }

   if(s.closest(ownSelector))continue;const ids=idsIn(s.textContent);if(!ids.length)continue;s.classList.add('lex-svg');s.setAttribute('role','button');s.setAttribute('tabindex','0');attachAccessibility(s,ids);s.setAttribute('aria-label','Explicar '+ids.map(id=>byId.get(id).term).join(', '));s.closest('svg')?.setAttribute('role','group');
  }

  for(const control of controls){
   if(control.closest(ownSelector+',#printArea,#report,#print,[data-apply-report]')||control.matches('.lex-term,.lex-help,[data-lex-all],[data-lex-ids],[data-lex-summary]')||control.closest('.lex-pair')||control.closest('button,a,label,summary,select')!==control)continue;

const guide=el('div',undefined,'lex-reading-guide');guide.id='lex-reading-guide';guide.setAttribute('role','note');guide.append(el('p','Palabras subrayadas: definición. El botón ? explica un control sin ejecutarlo.'));const find=el('button','Buscar una palabra');find.type='button';find.dataset.lexAll='';guide.append(find);
const header=document.querySelector('header')||document.querySelector('.head');if(header)header.after(guide);else document.body.prepend(guide);
document.addEventListener('click',ev=>{

function audit(){
