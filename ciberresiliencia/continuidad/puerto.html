ct';const routes={norte:{n:'Fibra norte',cp:18,c:1,dep:'galería'},sur:{n:'Fibra sur',cp:15,c:1,dep:'galería'},radio:{n:'Radioenlace',cp:10,c:2,dep:'torre'},mesa:{n:'Mensajería',cp:6,c:1,dep:'pista'},ninguna:{n:'Sin apoyo',cp:0,c:0,dep:''}};

const baseTurns=[

const ice=[
P('Salida del buque sanitario','La fibra norte está en reparación. Mantened el embarque urgente y dejad expedientes listos para inspección.','El transportista acepta un comprobante emitido por el puesto de atraque.', ['norte'],true,22,9,17,9,3),
P('Pérdida de credenciales centrales','El enlace de radio está reservado para comunicaciones de seguridad. La identidad central no contesta.','Revisad el límite de altas locales antes de enviar al muelle más órdenes de las que puede autorizar.', ['torre'],false,19,8,14,8,3),
P('La canalización se inunda','Una entrada de agua corta la galería. La torre y el carril de mensajería funcionan.','Sumad la capacidad de los dos medios de transporte y comprobad después el techo de autorización.', ['galería'],true,24,9,15,9,4)];
const replay=ice.map((r,i)=>({...r,b:i===2?'La misma inundación deja la galería fuera. En esta hipótesis el directorio también pierde su enlace con el puesto de atraque.':r.b,remote:i===2?false:r.remote}));

ice[2].min=14;replay[2].min=14;
function routecap(k,r){const a=routes[k];return r.fail.includes(a.dep)||r.fail.includes(k)?0:a.cp}
function model(r,p){const a=routecap(p.main,r),b=routecap(p.spare,r),v=p.auth==='red'&&!r.remote?0:auth[p.auth][1],m=Math.min(r.demand,a+b,v),u=p.prio==='urg'?Math.min(m,r.urgent):Math.floor(m*r.urgent/r.demand),cost=routes[p.main].c+routes[p.spare].c+auth[p.auth][2];return {a,b,v,m,u,cost}}

e="#e7c17e"/><text x="419" y="125" text-anchor="middle" fill="white" font-size="11">Permiso</text><text x="419" y="145" text-anchor="middle" fill="#f3cd87" font-size="12">'+mc.v+' plazas</text><path d="M457 131h19" stroke="#8fb3b6" stroke-width="3"/><path d="M469 135h77l-11 13h-53z" fill="#73baae"/><path d="M479 133v-15h14v15m3 0v-19h14v19m3 0v-12h13v12" fill="#c9a478"/><path d="M524 114V85h5v30m-5-30h-42l-2 4h37" fill="#8daeb3"/><text x="506" y="169" fill="white" text-anchor="middle" font-size="11">Embarque</text><text x="12" y="258" fill="#bed4d4" font-size="10">Línea de puntos: tramo cortado · Capacidad por ventana de 10 min</text></svg>'}
const game={id:'puerto',title:'Puerto de guardia',company:'A.P. Moller – Maersk',board:'Plano de la terminal',command:'Orden de despacho',unit:'Una ventana = 10 minutos',run:'Despachar y medir',refs:[{autor:'A.P. Moller – Maersk',titulo:'Annual Report 2017 · riesgos y operaciones',url:'https://investor.maersk.com/system/files-encrypted/nasdaq_kms/assets/2018/04/25/13-00-21/A.P._Moller_-_Maersk_Annual_Report_2017.pdf'},{autor:'A.P. Moller – Maersk',titulo:'Interim Report Q2 2017',url:'https://investor.maersk.com/news-releases/news-release-details/interim-report-q2-2017'}],fact:'En junio de 2017 NotPetya afectó a Maersk Line, APM Terminals y Damco. El informe anual de Maersk estima el impacto total en 250–300 millones de dólares, incluyendo pérdida de ingresos y restauración de sistemas.',scope:'El tablero recrea las decisiones de un puerto dependiente de órdenes electrónicas. La terminal, las obras, las capacidades y las órdenes son supuestos didácticos. El informe de Maersk no atribuye el incidente a una zanja inundada.',lesson:'Una orden llega a embarque cuando dispone de transporte y autorización. El servicio mínimo se comprueba con órdenes completadas y urgentes atendidas.',gloss:{'BIA':'Análisis de impacto en el negocio. Identifica qué actividad debe mantenerse, a quién perjudica su interrupción y cuánto tiempo puede tolerarse.','servicio mínimo':'Cantidad mínima de trabajo válido que debe completarse en un intervalo. Aquí exige un total y un número de órdenes urgentes.','dependencia común':'Componente compartido cuyo fallo puede inutilizar dos alternativas. Aquí la galería transporta ambas fibras.','directorio':'Servicio central que permite comprobar si la persona que emite una orden está autorizada.','permiso local':'Autorización previamente aprobada, verificable en el puesto sin consultar el directorio.','capacidad':'Número máximo de órdenes que pasa en una ventana.','radioenlace':'Conexión de datos por radio que usa la torre y evita la galería subterránea.','lista firmada':'Relación de autorizaciones ya verificadas que puede comprobarse sin conexión.','urgentes':'Órdenes con vencimiento en esta ventana, como las de un contenedor refrigerado.','revancha':'Repetición de la misión anterior con un solo supuesto modificado.'},cases:[{name:'Primer atraque',turns:baseTurns},{name:'Patio refrigerado',turns:val},{name:'Ventana sanitaria',turns:ice},{name:'El mismo muelle',turns:replay,delta:'Repetid las mismas decisiones de Ventana sanitaria. Solo cambia la disponibilidad del directorio en la tercera ventana. Anotad cuántas órdenes se pierden y qué recupera el permiso local.'}],initial:()=>({total:0,urgent:0}),defaults:()=>({main:'norte',spare:'ninguna',auth:'red',prio:'fifo'}),goal:r=>'Mínimo '+r.min+' de '+r.demand+' órdenes, incluidas '+r.essential+' de '+r.urgent+' urgentes. Presupuesto: '+r.budget+' créditos.',
controls(p,r){return btnset('Vía principal · capacidad / créditos','main',Object.entries(routes).filter(([k])=>k!=='ninguna').map(([k,v])=>[k,v.n+' '+v.cp+'/'+v.c]),p.main)+btnset('Vía de apoyo · capacidad restante','spare',Object.entries(routes).map(([k,v])=>[k,k==='ninguna'?'Ninguna':v.n]),p.spare)+btnset('Cómo se autoriza · plazas / créditos','auth',Object.entries(auth).map(([k,v])=>[k,v[0]+' '+v[1]+'/'+v[2]]),p.auth)+btnset('Política de cola','prio',Object.entries(prior),p.prio)},
change(p,k,v){if((k==='main'&&v===p.spare)||(k==='spare'&&v===p.main))return 'Cada vía solo aporta su capacidad una vez. Elegid una ruta distinta.';p[k]=v},coach(r,p,z){if(z)return z.ok?'Comprobad ambos objetivos en el parte y abrid la siguiente ventana.':'Leed la causa del fallo y pulsad «Repetir esta ventana». Conserváis el mismo aviso.';const f=['main','spare','auth','prio'],i=f.findIndex((k,i)=>p[k]!==r.guide[i]);return i<0?'El plan está listo. Antes de pulsar «Despachar y medir», calculad cuántas órdenes caben.':['En «Vía principal» elegid '+routes[r.guide[0]].n+'. El mapa marca qué tramos se han cortado.','Ahora marcad '+routes[r.guide[1]].n+' como apoyo. Se utiliza cuando se llena la vía principal.','Elegid '+auth[r.guide[2]][0]+'. Este control determina cuántas órdenes podrán firmarse.','En «Política de cola», elegid «Urgentes primero» para reservar plazas a las órdenes con plazo.'][i]},art:scene,metrics(r,p,prev,z){const q=model(r,p);return [['Transporte disponible',(q.a+q.b)+' plazas'],['Validación disponible',q.v+' plazas'],['Coste del plan',q.cost+' / '+r.budget]]},simulate(r,p,prev){const q=model(r,p),ok=q.m>=r.min&&q.u>=r.essential&&q.cost<=r.budget,detail='Pasan '+q.a+' plazas por la vía principal y '+q.b+' por el apoyo. De '+r.demand+' órdenes, '+q.m+' tienen transporte y permiso, incluidas '+q.u+' urgentes. Coste '+q.cost+' de '+r.budget+' créditos.',why=q.cost>r.budget?'El plan supera el presupuesto. Retirad un medio que no añade entregas.':q.m<r.min?(q.v<r.min?'El límite está en la autorización. Probad un permiso que siga operativo.':'El límite está en las rutas. Buscad un respaldo que evite el componente cortado.'):(q.u<r.essential?'El caudal basta, pero se quedan urgencias en cola. Cambiad el orden de despacho.':'El plan conserva el servicio mínimo y la prioridad dentro del presupuesto.');return {ok,detail,why,summary:q.m+'/'+r.demand+' despachadas · '+q.u+'/'+r.urgent+' urgentes · '+q.cost+' créditos',plan:planText(p),after:{total:prev.total+q.m,urgent:prev.urgent+q.u}}},rules(r){return '<p>Una ventana dura diez minutos. Las vías principal y de apoyo suman sus plazas disponibles. Si comparten un componente cortado, ambas pierden su capacidad. El directorio valida 24 órdenes cuando está disponible. El permiso local valida 14 y cuesta un crédito. La lista firmada valida 8.</p><p>Órdenes completadas = el menor valor entre demanda, plazas de transporte y plazas de validación. Con prioridad urgente se atienden primero todas las urgentes que caben. Al elegir «Por llegada», el modelo las reparte en proporción a la demanda y redondea hacia abajo. Las órdenes no despachadas pierden su ventana y se registran como pendientes de otro embarque.</p><p>Los costes se muestran en la primera fila. El apoyo paga el mismo coste que la vía principal. La incidencia permite ejecutar un ensayo con exceso de presupuesto, pero ese plan no cumple el encargo.</p>'}};

game.checkpoint=(i,z,r,p)=>{const m=model(r,p),q=[['¿Cuántas órdenes quedan sin embarcar?',r.demand-m.m,'Restad las órdenes completadas a las que llegaron.'],['¿Qué margen queda sobre el mínimo de órdenes?',m.m-r.min,'Restad el mínimo exigido al total despachado.'],['¿Cuántos créditos del presupuesto han sobrado?',r.budget-m.cost,'Restad el coste del plan a los créditos disponibles.']][i];return {actual:m.m,ask:q[0],answer:q[1],clue:q[2]}};

const $=id=>document.getElementById(id), clone=o=>JSON.parse(JSON.stringify(o)), safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), key='mec.continuidad.'+game.id+'.20261122.v1';
let ci=0,book;try{book=JSON.parse(localStorage.getItem(key));if(!Array.isArray(book)||book.length!==4)book=null}catch{}if(!book)book=Array.from({length:4},()=>null);
const query=new URLSearchParams(location.search);if(query.has('caso'))ci=Math.max(0,Math.min(3,Number(query.get('caso'))-1||0));
function save(){try{localStorage.setItem(key,JSON.stringify(book))}catch{}}
function fresh(){return {i:0,states:[game.initial()],choices:[game.defaults()],done:[],pending:null,finished:false,last:[],tries:0}}
function cur(){return book[ci]||(book[ci]=fresh())}
function selected(){return cur().choices[cur().i]}function round(){return game.cases[ci].turns[cur().i]}
function modal(h){$('dialogText').innerHTML=h;$('modal').showModal();$('close').focus()}
function btnset(label,field,vals,chosen){return '<fieldset><legend>'+label+'</legend><div class="choices">'+vals.map(([v,t])=>'<button data-field="'+field+'" data-value="'+v+'" aria-pressed="'+(chosen===v)+'">'+t+'</button>').join('')+'</div></fieldset>'}
function render(){
const s=cur(),c=game.cases[ci],r=round(),dec=selected(),prev=s.states[s.i];$('cases').innerHTML=game.cases.map((x,i)=>'<button data-case="'+i+'" aria-current="'+(i===ci)+'"><small>'+['Tutorial · 6 min','Misión · 8 min','Misión · 10 min','Revancha · 6 min'][i]+(book[i]?.finished?' · completado':'')+'</small>'+x.name+'</button>').join('');
$('series').textContent=c.name+' · Ventana '+(s.i+1)+' de '+c.turns.length;$('mission').textContent=r.t;$('brief').textContent=r.b;$('objective').innerHTML='<span class="eyebrow">Condición de servicio</span><div>'+game.goal(r)+'</div>';
$('bt').textContent=game.board;$('bh').textContent=game.unit;$('ct').textContent=game.command;$('state').textContent=s.finished?'Caso cerrado':s.pending?'Turno comprobado':'Preparación';
$('draw').innerHTML=game.art(r,dec,prev,s.pending);$('metrics').innerHTML=game.metrics(r,dec,prev,s.pending).map(([n,v])=>'<div class="metric">'+n+'<strong>'+v+'</strong></div>').join('');
$('advice').innerHTML='<b>'+(ci===0?'Tutorial · Próxima acción':ci===3?'Ensayo comparado':'Parte del relevo')+'</b>'+ (ci===0?game.coach(r,dec,s.pending):ci===3?c.delta:r.tip);
$('choices').innerHTML=game.controls(dec,r)+'<label class="predict">Pronóstico antes de resolver <span>'+game.predictLabel+'</span><input id="guess" type="number" min="0" step="1" inputmode="numeric" placeholder="Vuestra cifra" value="'+(Number.isInteger(dec.guess)?dec.guess:'')+'" '+(s.pending?'disabled':'')+'></label>';if(!s.pending)$('guess').oninput=()=>{const v=$('guess').value;dec.guess=v===''?null:Number(v);save()};if(s.pending||s.finished)$('choices').querySelectorAll('button,select').forEach(b=>b.disabled=true);
$('run').textContent=s.finished?'Abrir parte final':s.pending?(s.pending.ok?(s.i===c.turns.length-1?'Cerrar caso':'Abrir siguiente ventana'):'Repetir esta ventana'):game.run;
$('feedback').hidden=true;$('back').disabled=s.i===0;
const z=s.pending;$('result').hidden=!z;if(z){$('result').innerHTML='<div class="resultHead '+(z.ok?'win':'')+'"><h3>'+(z.ok?'Objetivo alcanzado':'Objetivo pendiente')+'</h3><span class="kicker">Ventana '+(s.i+1)+'</span></div><div class="body"><p>'+z.detail+'</p><p class="compact">'+z.why+'</p><p class="compact"><strong>Vuestro pronóstico:</strong> '+z.guess+' · Resultado: '+z.actual+'.</p>'+(z.ok&&!s.finished?'<label class="check">Lectura del parte · '+z.ask+' <input id="check" type="number" inputmode="numeric" placeholder="Vuestra cifra" aria-label="Respuesta al parte"></label>':'')+'</div>'}
$('audit').innerHTML=s.done.length?s.done.map((x,i)=>'<p><strong>'+safe(c.turns[i].t)+'</strong> · '+safe(x.summary)+'</p>').join(''):'Los resultados se incorporan cuando validáis una ventana.';
if(s.pending&&!s.finished){const bt=document.createElement('button');bt.textContent='Comparar otro plan en esta ventana';bt.id='tryOther';$('result').querySelector('.body').append(bt);bt.onclick=()=>{s.last[s.i]=s.pending.summary;s.pending=null;render()};if(s.last[s.i]){const q=document.createElement('p');q.className='compact';q.textContent='Ensayo anterior: '+s.last[s.i];$('result').querySelector('.body').append(q)}}game.wire?.();enhanceTerms();save();
}
function openTerms(term){const ar=Object.entries(game.gloss);modal('<h2>Glosario de guardia</h2><dl>'+ar.filter(([a])=>!term||a===term).map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join('')+'</dl>')}
function enhanceTerms(){const keys=Object.keys(game.gloss).sort((a,b)=>b.length-a.length);const pattern=new RegExp('(?<![\\p{L}\\p{N}])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu');for(const id of ['brief','objective','advice','result']){const root=$(id),tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=tw.nextNode())if(!n.parentElement.closest('button'))nodes.push(n);for(const node of nodes){const v=node.textContent;pattern.lastIndex=0;if(!pattern.test(v))continue;pattern.lastIndex=0;const fr=document.createDocumentFragment();let end=0;for(const m of v.matchAll(pattern)){fr.append(document.createTextNode(v.slice(end,m.index)));const b=document.createElement('button');b.className='term';b.dataset.term=keys.find(k=>k.toLocaleLowerCase('es')===m[0].toLocaleLowerCase('es'));b.textContent=m[0];fr.append(b);end=m.index+m[0].length}fr.append(document.createTextNode(v.slice(end)));node.replaceWith(fr)}}}
function act(field,value){const s=cur();if(s.pending||s.finished)return;const msg=game.change(selected(),field,value,round());render();if(msg){$('feedback').hidden=false;$('feedback').textContent=msg}const q=[...$('choices').querySelectorAll('[data-field]')].find(b=>b.dataset.field===field&&b.dataset.value===value);if(q&&!q.disabled)q.focus({preventScroll:true})}
document.addEventListener('click',e=>{const q=e.target.closest('[data-case],[data-field],[data-term]');if(!q)return;if(q.dataset.term){openTerms(q.dataset.term);return}if(q.hasAttribute('data-case')){ci=+q.dataset.case;render();return}act(q.dataset.field,q.dataset.value)});
function reportHTML(){const s=cur(),c=game.cases[ci];const arr=[...s.done];if(s.pending&&!(s.finished))arr.push(s.pending);return '<h1>'+game.title+'</h1><h2>'+c.name+'</h2><p>'+(!arr.length?'Preparación iniciada.':(s.finished?'Parte cerrado.':'Parte provisional.'))+' '+arr.length+' de '+c.turns.length+' ventanas documentadas. Ensayos ejecutados: '+s.tries+'.</p>'+arr.map((z,i)=>'<article><h3>'+c.turns[i].t+'</h3><p>'+z.plan+'</p><p><strong>'+z.summary+'</strong></p><p>'+z.detail+'</p><p>Pronóstico: '+z.guess+'. Observación: '+z.actual+'.</p></article>').join('')+'<p>'+game.lesson+'</p>'+comparison()+'<small>Simulación docente inspirada en '+game.company+'. Las cifras y reglas del tablero son supuestos de aula.</small>'}
function comparison(){if(ci!==3)return '';const base=book[2];const dat=cur();if(!base?.finished)return '<p>Para comparar, completad la misión anterior con el mismo plan.</p>';const last=(dat.finished?dat.done.at(-1):dat.pending);return last?'<p><b>Comparación de los resultados</b><br>Referencia · '+safe(base.done[Math.min(dat.i,base.done.length-1)].summary)+'<br>Revancha · '+safe(last.summary)+'<br>'+game.cases[3].delta+'</p>':''}
function showReport(){modal(reportHTML()+'<p><button id="printNow" class="primary">Imprimir o guardar PDF</button></p>');$('printNow').onclick=()=>{$('printArea').innerHTML=reportHTML();window.print()}}
window.addEventListener('beforeprint',()=>{$('printArea').innerHTML=reportHTML()});
$('run').onclick=()=>{const s=cur(),n=game.cases[ci].turns.length;if(s.finished){showReport();return}if(s.pending){if(!s.pending.ok){s.pending=null;render();return}const cv=$('check')?.value;if(cv===''||Number(cv)!==s.pending.answer){$('feedback').hidden=false;$('feedback').textContent='Completad la lectura del parte. '+s.pending.clue;$('check')?.focus();return}s.done.push(s.pending);if(s.i===n-1){s.finished=true;render();showReport();return}s.states.push(s.pending.after);s.i++;s.choices.push(game.defaults());s.pending=null;render();return}const v=selected().guess;if(!Number.isSafeInteger(v)||v<0){$('feedback').hidden=false;$('feedback').textContent='Antes del ensayo, escribid vuestro pronóstico. Si falla, el parte permitirá medir la diferencia.';$('guess').focus();return}const z=game.simulate(round(),clone(selected()),clone(s.states[s.i]));Object.assign(z,game.checkpoint(s.i,z,round(),selected(),s.states[s.i]));z.guess=v;s.pending=z;s.tries++;render();$('result').scrollIntoView({block:'nearest',behavior:'instant'})};
$('back').onclick=()=>{let s=cur();if(s.i<1)return;s.finished=false;s.pending=null;s.i--;s.done=s.done.slice(0,s.i);s.states=s.states.slice(0,s.i+1);s.choices=s.choices.slice(0,s.i+1);render()};
$('reset').onclick=()=>{modal('<h2>Reiniciar '+game.cases[ci].name+'</h2><p>Se borrará el parte de este caso en este navegador. Podéis imprimirlo antes desde «Parte e impresión PDF».</p><button id="erase">Reiniciar el caso</button>');$('erase').onclick=()=>{$('modal').close();book[ci]=fresh();render()}};
$('record').onclick=showReport;$('terms').onclick=()=>openTerms();$('why').onclick=()=>modal('<h2>Cómo se calcula el turno</h2>'+game.rules(round()));$('source').onclick=()=>modal('<h2>El incidente documentado</h2><p>'+game.fact+'</p><h3>Qué se reproduce en la partida</h3><p>'+game.scope+'</p>'+game.refs.map(r=>'<p><a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+r.autor+' · '+r.titulo+'</a></p>').join(''));$('close').onclick=()=>$('modal').close();$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').close()});render();

</script></html>
