gn:left;background:#ede2c6;border:1px solid #b4b197;color:#213d37;display:flex;min-height:54px;flex-direction:column;justify-content:space-between;gap:4px}.gear>strong{font-size:12px;line-height:1.22;max-width:95%}.gear .cost{font:10px monospace;display:flex;align-items:center;justify-content:space-between}.gear[aria-pressed=true]{background:#25594f;color:#fff5dd;border-color:#193e36}.gear[aria-pressed=true] .check{color:#ffcf7c}.gear:disabled:not([aria-pressed=true]){opacity:.61}.op{width:100%;padding:6px 7px;background:#fff9e8;border:1px solid #a6af97;color:#233b34;font-size:13px;font-weight:630}.detail{color:#3b554a;font-size:12px;line-height:1.38;margin-top:5px}.power{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.power input{accent-color:#2b675b;flex:1;min-width:50px}.power output{font:700 12px monospace;min-width:55px}.resolve,.next,.print{background:#edbd65;color:#20352f;border:1px solid #9f7b41;font-weight:750;padding:9px 11px;min-height:36px;text-align:center}.resolve{width:100%}.resolve:disabled{background:#d4c6a7;color:#5c6355}.actionmsg{color:#804326;font-size:12px;font-weight:650}.receipt{margin-top:11px;padding:13px 16px;background:#f3ead5;color:#213833;border-left:5px solid #d6a85c}.receipt .micro{color:#386555}.receipt.fail{border-color:#cf7a5c}.receipt h3{font-size:17px;line-height:1.3;margin:4px 0}.receipt p,.modal p{font-size:14px;line-height:1.5}.figures{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.figures div{padding:4px 0;border-block:1px solid #b6bc9d}.figures span{display:block;font-size:10px;color:#476654}.figures b{font:700 13px monospace}.next{margin-top:10px;display:block;width:100%}.after{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;color:#a7bdb3;font-size:11px}.after p{max-width:540px}.hud{font:700 10px monospace;letter-spacing:.6px;color:#d0d9bc}.history{display:flex;gap:5px}.history i{display:inline-block;width:18px;height:5px;background:#5468 <header><div class="brand"><svg viewBox="0 0 34 37" aria-hidden="true"><path d="M2 28L17 2L31 28L17 35Z" fill="none" stroke="#e9bc72" stroke-width="2"/><path d="M8 27L17 11L25 27L17 30Z" fill="#90bca0"/><path d="M11 26L17 16L21 26Z" fill="#25463f"/></svg><div>Guardia de continuidad<small>MESA DE OPERACIONES</small></div></div><div class="tools"><button class="topbtn" id="gloss">Glosario</button><button class="topbtn" id="sample">Ver ejemplo</button><button class="topbtn" id="report">Mi informe</button></div></header>

<script>
const GAMES=[
{title:'Faro Norte',role:'Responsable de continuidad',tag:'Dependencias y servicio mínimo',theme:'coast',icon:'faro',unit:'informes',goal:'Entregad al menos 80 informes válidos de cada 100 en las tres alertas.',intro:'Tres estaciones costeras envían informes a un boletín. Dos contratos de fibra cruzan la misma zanja. Elegid las piezas de reserva y la orden que se ejecutará al saltar cada alarma.',nodes:[['Estación','torre'],['Transporte','antena'],['Redacción','casa'],['Boletín','faro']],gear:[
['radio','Radio independiente',2,'Abre una vía física de reserva con capacidad para 55 informes si cae la fibra.','La radio une la estación con redacción sin utilizar la canalización compartida.'],
['local','Credencial local',2,'Permite validar hasta 62 informes si la identidad central cae.','Antes de la caída se ha de provisionar y ensayar una credencial independiente.'],
['mesa','Mesa manual',2,'Añade capacidad manual para 18 informes durante el fallo.','El equipo puede tramitar una parte de los informes sin utilizar el flujo automatizado.'],
['sello','Cotejo de origen',2,'Recupera 36 informes si la red mezcla observaciones antiguas y nuevas.','Dos lecturas con el mismo valor pueden proceder de instantes diferentes. El cotejo detecta su antigüedad.']],
ops:[['desviar','Desviar a la reserva','Con radio equipada, añade 5 informes por punto de esfuerzo.'],['turno','Reforzar la mesa','Con mesa equipada, suma 7 informes por punto de esfuerzo.'],['contrastar','Contrastar la serie','Recupera 9 informes de origen dudoso por punto durante la mezcla.']],
gloss:[['Dependencia','Recurso que debe funcionar para prestar el servicio.'],['Fallo común','Una misma causa puede derribar dos alternativas.'],['Servicio mínimo','Cantidad y calidad que se exige conservar durante una interrupción.'],['Modo degradado','Forma temporal de seguir prestando una parte del servicio.'],['Autenticidad','Capacidad de acreditar de dónde procede la observación.']],
rounds:[
['Dos contratos, una zanja','La excavadora corta el conducto compartido.','Hay 100 informes. Solo 16 alcanzan la redacción por las rutas que quedan. La radio usa otra ladera.','Transporte',['radio','mesa'],'desviar',2,'Recuperar un enlace separado protege frente al fallo común; la mesa absorbe parte de lo que queda en cola.'],
['El directorio no contesta','Las dos rutas están operativas, pero la identidad central está caída.','Llegan 100 informes. Solo 10 superan la validación con los recursos de guardia habituales.','Identidad',['local','mesa'],'turno',2,'Una carretera alternativa tampoco abre una puerta cerrada. La credencial local y la mesa sostienen la validación.'],
['Mensajes de ayer','El transporte mezcla observaciones antiguas y actuales.','Sin comprobación adicional solo 34 informes cumplen la condición de actualidad. Los mensajes llegan a tiempo, pero difieren los sellos.','Origen',['sello','mesa'],'contrastar',2,'La recepción física ha funcionado; ahora hay que comprobar el origen y la antigüedad antes de publicar.']],
threshold:'80 informes válidos por turno',caseHint:'Una radio que comparte la alimentación principal también puede tener un fallo común.'},
{title:'Central de pedidos',role:'Responsable de explotación',tag:'Capacidad y saturación',theme:'works',icon:'central',unit:'pedidos/min',goal:'Atended al menos el 95 % de los pedidos legítimos en cada pico de demanda.',intro:'Una tienda recibe pedidos mientras otros trabajos consumen su enlace y sus servidores. El tablero mueve los pedidos del acceso al mostrador de cobro; cada cola tiene un límite distinto.',nodes:[['Clientes','tienda'],['Enlace','antena'],['Cómputo','rack'],['Cobro','central']],gear:[
['enlace','Tránsito adicional',2,'Añade 50 peticiones/min al enlace.','Ampliar la tubería de entrada deja pasar pedidos que antes se quedaban esperando fuera.'],
['nodos','Nodos de cálculo',2,'Añaden 45 pedidos/min al proceso.','Los nodos solo ayudan a los pedidos que ya alcanzaron la aplicación.'],
['filtro','Separador de cargas',2,'Retira hasta 35 trabajos de fondo/min antes del enlace.','Separar las tareas de sincronización aguas arriba libera paso antes de que la cola se llene.'],
['caja','Caja de reserva',2,'Añade 35 cobros/min a la salida.','Un pedido solo cuenta cuando el cobro lo acepta; el último puesto también puede limitar el ritmo.']],
ops:[['regular','Escalonar el fondo','Pospone 10 trabajos de fondo/min por punto de esfuerzo.'],['repartir','Repartir el cálculo','Suma 8 pedidos/min de proceso por punto.'],['cobrar','Abrir otro turno','Suma 8 cobros/min por punto de esfuerzo.']],
gloss:[['Capacidad','Cantidad de trabajo que una etapa puede completar por unidad de tiempo.'],['Cuello de botella','Etapa que impone el límite al ritmo de todo el recorrido.'],['Demanda legítima','Peticiones del servicio que realmente se pretende atender.'],['Cola','Trabajo que ha llegado y espera a que haya recursos.'],['Nivel de servicio','Condición observable que debe cumplirse para los usuarios.']],
rounds:[
['La puerta se estrecha','Una sincronización coincide con el inicio de las rebajas.','Demanda 100 pedidos/min · fondo 65/min · enlace 100/min · cómputo 105/min · cobro 105/min.','Acceso',['enlace','filtro'],'regular',2,'Los trabajos de fondo ocupan la entrada antes de que los servidores puedan recibir los pedidos.'],
['La puerta está abierta','El catálogo usa más tiempo de cálculo en cada compra.','Demanda 120/min · fondo 5/min · enlace 130/min · cómputo 65/min · cobro 95/min.','Cómputo',['nodos','caja'],'repartir',2,'El enlace admite la demanda. Hacen falta capacidad de cálculo y cobro para completar la compra.'],
['La cola se muda','Los pedidos llegan al final del recorrido y se acumulan en caja.','Demanda 110/min · fondo 20/min · enlace 125/min · cómputo 95/min · cobro 65/min.','Cobro',['caja','nodos'],'cobrar',2,'Abrir otra caja permite convertir el cálculo disponible en compras terminadas; el acceso aún marca un techo.']],
threshold:'95 % de pedidos completados',caseHint:'Un procesador casi vacío puede significar que la entrada está bloqueada.'},
{title:'Archivo de guardia',role:'Coordinador de recuperación',tag:'Copias, RTO y RPO',theme:'archive',icon:'archivo',unit:'min',goal:'Volved a operar en 60 minutos, con 15 minutos de pérdida de datos como máximo y una operación real comprobada.',intro:'Un archivo tramita reservas. Elegid cómo conservar el estado y cómo comprobar que la copia restaurada vuelve a aceptar una reserva. Las dos agujas miden tiempos distintos.',nodes:[['Original','torre'],['Copias','archivo'],['Restaurar','rack'],['Reserva','tienda']],gear:[
['aislada','Copia aislada',2,'Aporta una copia limpia de hace 35 minutos si el original se altera.','Aislar la copia evita que una alteración se replique en ella. Su antigüedad aún debe contrastarse con el objetivo.'],
['diario','Diario independiente',2,'Reconstruye hasta los últimos 10 minutos si hay una copia limpia.','El diario independiente permite rehacer trabajo posterior al último punto limpio.'],
['cred','Identidad de reserva',2,'Evita 38 minutos de espera cuando el acceso al archivo principal está bloqueado.','La persona que restaura necesita una identidad admitida aunque el directorio habitual esté indisponible.'],
['banco','Banco preparado',2,'Reduce en 30 minutos el arranque de la restauración.','Preparar y probar el entorno antes de la crisis acorta el trabajo tras la declaración.']],
ops:[['probar','Validar una reserva','Comprueba la operación completa; añade entre 4 y 6 minutos.'],['iniciar','Priorizar arranque','Resta 7 minutos de preparación por punto, pero deja pendiente la prueba de servicio.'],['leer','Comprobar lectura','Verifica solo lectura y deja pendiente la escritura de una reserva.']],

rounds:[
['La réplica también cambió','Una modificación errónea llegó a la réplica en línea.','Restauración base de 42 min. La réplica en línea está alterada. La copia aislada conserva el último punto de hace 35 min.','Copia limpia',['aislada','diario'],'probar',2,'Primero necesitáis una base fiable; el diario permite recuperar operaciones posteriores. Comprobad que se registra una nueva reserva.'],
['La llave del archivo','La última réplica limpia tiene ocho minutos, pero el directorio se ha caído.','Restauración base de 62 min y espera adicional de 38 min por identidad. Antigüedad de la réplica limpia: 8 min.','Acceso',['cred','banco'],'probar',2,'Aquí el dato llega fresco y la espera se concentra en el acceso y el arranque.'],
['Un volumen que ha crecido','La restauración completa tarda más y el último punto limpio se ha quedado atrás.','Restauración base de 78 min. Hay una copia limpia de hace 31 min y el directorio responde.','Volumen',['banco','diario'],'probar',2,'El banco preparado recorta tiempo de retorno; el diario recorta pérdida de datos. Son objetivos diferentes.']],
threshold:'RTO ≤ 60 min · RPO ≤ 15 min · reserva comprobada',caseHint:'La última copia puede ser reciente y, aun así, tardar demasiado en restaurarse.'},
{title:'Consejo de continuidad',role:'Responsable de presupuesto',tag:'Presupuesto y medición',theme:'civic',icon:'central',unit:'servicios',goal:'Conseguid que al menos el 75 % de los servicios en alcance tenga un retorno probado dentro del plazo.',intro:'Tres comités distribuyen la misma bolsa entre servicios, personas y ensayos. El consejo solo reconoce los que estaban en el alcance, se probaron y volvieron dentro de plazo.',nodes:[['Alcance','central'],['Preparar','casa'],['Ensayar','rack'],['Firmar','archivo']],gear:[

function simulate(k,r,items,order,e){

 let ok,main,metrics,explain,flow;

  const manual=18*on('mesa'),bonus=order==='turno'?7*e*on('mesa'):order==='desviar'&&r===0?5*e*on('radio'):order==='contrastar'&&r===2?9*e:0;

 }else if(k===1){
  const [d,f,l,c,p]=[[100,65,100,105,105],[120,5,130,65,95],[110,20,125,95,65]][r];
  const fondo=Math.max(0,f-35*on('filtro')-(order==='regular'?10*e:0));
  const cap=l+50*on('enlace')-fondo,calc=c+45*on('nodos')+(order==='repartir'?8*e:0),caja=p+35*on('caja')+(order==='cobrar'?8*e:0);
  const n=Math.min(d,cap,calc,caja),pct=n*100/d;
  main=n+' de '+d+' pedidos/min · '+pct.toLocaleString('es-ES',{maximumFractionDigits:1})+' %';ok=pct>=95;
  metrics=[['Al acceso',cap+' /min'],['Al proceso',calc+' /min'],['Al cobro',caja+' /min']];
  explain='Quedan '+fondo+' trabajos de fondo/min. El acceso admite '+cap+' pedidos/min, el cálculo '+calc+' y el cobro '+caja+'. Con '+d+' pedidos/min de demanda, se completan '+n+' y quedan '+(d-n)+' pendientes por minuto.';
  flow=[d,Math.min(cap,d),Math.min(cap,calc,d),n];
 }else if(k===2){
  const clean=r!==0||on('aislada'),age=Math.min([35,8,31][r],on('diario')?10:999);
  const t0=[42,62,78][r],waiting=r===1&&!on('cred')?38:0,fast=30*on('banco'),operation=order==='probar'?7-e:order==='iniciar'?-7*e:0;
  const t=Math.max(1,t0+waiting-fast+operation),validated=clean&&order==='probar',loss=clean?age+' min':'desconocida';
  main=clean?t+' min de retorno · '+loss+' de pérdida':'Sin punto limpio confirmado';ok=!!validated&&t<=60&&age<=15;
  metrics=[['Tiempo técnico',t+' min'],['Pérdida',loss],['Reserva creada',validated?'Sí':'Pendiente']];
  explain='Trabajo técnico: '+t0+' min de partida + '+waiting+' min de espera − '+fast+' min de preparación '+(operation<0?'− ':'+ ')+Math.abs(operation)+' min de la orden = '+t+' min. '+(clean?'El punto recuperado deja '+age+' min de pérdida.':'La copia disponible está alterada. No hay pérdida de datos cuantificable.')+' '+(validated?'Una reserva ha quedado escrita y leída.':'Falta demostrar que se puede registrar una reserva.');
  flow=[t0,clean?age:0,t,validated?1:0];
 }else if(k===3){
  const [scope,bp,bt,ba]=[[8,3,4,6],[10,7,4,6],[12,8,7,5]][r];
  const p=bp+3*on('ruta')+2*on('guardia')+(order==='activar'?e:0),t=bt+4*on('ensayo')+(order==='probar'?e:0),a=ba+3*on('firma')+on('guardia')+(order==='validar'?e:0);

  flow=[4,on('huella'),on(tool),n];
 }
 return {ok:!!ok,main,metrics,explain,flow};
}

el('rules').onclick=()=>modal('Reglamento del puesto',g.tag,'<p>'+esc(g.goal)+'</p><div class="well">Cada uno de los tres turnos concede '+(mode==='tight'?5:6)+' créditos nuevos. Cada reserva ocupa un puesto y cuesta dos créditos. Una orden consume entre uno y tres créditos. Como máximo un crédito sin gastar pasa al turno siguiente. Las reservas se eligen de nuevo porque son asignaciones de guardia temporales.</div><div class="rules-grid">'+g.gear.map(a=>'<div><b>'+esc(a[1])+'</b>'+esc(a[3])+'</div>').join('')+'</div><h3>Las órdenes</h3>'+g.ops.map(a=>'<p><b>'+esc(a[1])+'.</b> '+esc(a[2])+'</p>').join('')+'<h3>Ejercicio individual</h3><p>Completad la campaña, identificad un cuello de botella y repetid cambiando una sola decisión. Escribid la diferencia en el informe.</p>');
function linkTerms(id){
 const box=el(id),str=box.textContent, terms=g.gloss.map(x=>x[0]).sort((a,b)=>b.length-a.length);
 const pattern=new RegExp('(?<![\\p{L}])('+terms.join('|')+')(?![\\p{L}])','giu');
 const nodes=[];let pos=0;for(const m of str.matchAll(pattern)){nodes.push(document.createTextNode(str.slice(pos,m.index)));const btn=document.createElement('button');btn.type='button';btn.className='inline-term';btn.textContent=m[0];const entry=g.gloss.find(x=>x[0].toLocaleLowerCase('es')===m[0].toLocaleLowerCase('es'));btn.onclick=()=>modal('Glosario del puesto',entry[0],'<p>'+esc(entry[1])+'</p>');nodes.push(btn);pos=m.index+m[0].length;}if(nodes.length){nodes.push(document.createTextNode(str.slice(pos)));box.replaceChildren(...nodes);}
}
function receiptView(rec){const x=rec.result;return '<div class="micro">Turno '+(s.turn+1)+' cerrado · '+(x.ok?'objetivo cumplido':'objetivo pendiente')+'</div><h3 id="resultSummary">'+esc(x.main)+'</h3><div class="figures">'+x.metrics.map(([t,v])=>'<div><span>'+esc(t)+'</span><b>'+esc(v)+'</b></div>').join('')+'</div><p>'+esc(x.explain)+'</p><button class="next" id="next">'+(s.turn<2?'Abrir el siguiente turno →':'Cerrar la campaña y ver informe →')+'</button>';}
function refresh(){
 const r=current(),q=g.rounds[r];el('mode').value=mode;el('mode').disabled=busy;
 el('tag').textContent='Guardia '+String(k+1).padStart(2,'0')+' / '+g.tag;el('title').textContent=g.title;el('role').textContent=g.role+' · '+g.threshold;el('turn').textContent='TURNO '+String(s.turn+1).padStart(2,'0')+' / 03';
 el('alertTitle').textContent=q[0];el('event').textContent=q[1];el('fixture').textContent=q[2];el('threshold').textContent=g.threshold;
 el('board').innerHTML=drawBoard(k,r,s.items,s.last?.result,busy);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)el('board').querySelector('svg')?.pauseAnimations?.();
 el('credits').textContent=(budget()-spent())+' / '+budget()+' créditos libres';
 el('gears').innerHTML=g.gear.map(([id,name,cost,effect])=>{const on=s.items.includes(id);return '<button class="gear" data-item="'+id+'" aria-pressed="'+on+'" '+(busy||s.last||!on&&(s.items.length>=2||budget()-spent()<cost)?'disabled':'')+' title="'+esc(effect)+'"><strong>'+esc(name)+'</strong><span class="cost"><span>'+cost+' créditos</span> <span class="check">'+(on?'✓ EQUIPADA':'+')+'</span></span></button>';}).join('');
 el('gearTip').textContent=s.items.length?g.gear.find(a=>a[0]===s.items[s.items.length-1])[3]:'El reglamento explica el efecto de cada reserva antes de equiparla.';
 el('gears').querySelectorAll('button').forEach(b=>b.onclick=()=>{const id=b.dataset.item;s.items=s.items.includes(id)?s.items.filter(z=>z!==id):s.items.concat([id]);save();refresh();el('gears').querySelector('[data-item="'+id+'"]').focus({preventScroll:true});});
 el('order').innerHTML='<option value="">Elegid una orden…</option>'+g.ops.map(a=>'<option value="'+a[0]+'">'+esc(a[1])+'</option>').join('');el('order').value=s.order;el('order').disabled=busy||!!s.last;
 el('opTip').textContent=(g.ops.find(a=>a[0]===s.order)||['','','La orden solo se ejecuta al resolver el turno.'])[2];
 el('effort').value=s.eff;el('effort').disabled=busy||!!s.last;el('eff').textContent=s.eff+(s.eff===1?' punto':' puntos');
 for(const id of ['role','fixture','threshold','gearTip','opTip'])linkTerms(id);
 el('resolve').disabled=busy||!!s.last||!s.order||spent()>budget();el('resolve').textContent=busy?'Resolviendo el turno…':s.last?'Turno ejecutado':'Ejecutar turno →';
 el('msg').textContent=spent()>budget()?'Faltan '+(spent()-budget())+' créditos. Bajad el esfuerzo o retirad una reserva.':'';
 el('receipt').hidden=!s.last;el('receipt').classList.toggle('fail',!!s.last&&!s.last.result.ok);
 if(s.last){el('receipt').innerHTML=receiptView(s.last);el('next').onclick=()=>{if(s.turn===2){openReport(false);return;}s.bank=Math.min(1,s.last.left);s.turn++;s.last=null;s.items=[];s.order='';s.eff=1;save();refresh();el('stage').scrollIntoView({block:'nearest'});el('intel').focus({preventScroll:true});};}else el('receipt').replaceChildren();
 el('history').innerHTML=[0,1,2].map(i=>'<i class="'+(s.history[i]?(s.history[i].result.ok?'yes':'no'):'')+'"></i>').join('');el('status').textContent=s.history.length+' / 3 resueltos';
}
el('order').onchange=e=>{s.order=e.target.value;save();refresh();};
el('effort').oninput=e=>{s.eff=Number(e.target.value);save();refresh();};
el('resolve').onclick=()=>{if(busy||s.last||!s.order||spent()>budget())return;busy=true;refresh();const m=mode;setTimeout(()=>{if(mode!==m)return;busy=false;const r=current();s.last={r,items:[...s.items],order:s.order,eff:s.eff,budget:budget(),left:budget()-spent(),result:simulate(k,r,s.items,s.order,s.eff)};s.history[s.turn]=s.last;save();refresh();el('receipt').scrollIntoView({block:'nearest'});el('next').focus({preventScroll:true});},matchMedia('(prefers-reduced-motion: reduce)').matches?120:1050);};
function openReport(example){
 const records=example?g.rounds.map((q,r)=>({r,items:q[4],order:q[5],eff:q[6],budget:6,left:0,result:simulate(k,r,q[4],q[5],q[6])})):s.history;
 const passed=records.filter(z=>z.result.ok).length;
 const title=(example?'Ejemplo resuelto':'Mi informe')+' · '+g.title;
 const html='<div class="report"><p class="well"><b>'+passed+' de '+records.length+' objetivos cumplidos.</b> '+esc(g.goal)+'</p>'+(!records.length?'<p>El primer resultado aparecerá aquí al ejecutar un turno.</p>':'')+records.map((rec,i)=>{const q=g.rounds[rec.r];return '<div class="report-item"><h3>'+esc(q[0])+'</h3><p><b>Decisión.</b> '+esc(rec.items.map(id=>g.gear.find(a=>a[0]===id)[1]).join(' + ')||'Sin reservas')+' · '+esc(g.ops.find(a=>a[0]===rec.order)[1])+' · esfuerzo '+rec.eff+' · '+(rec.budget-rec.left)+' de '+rec.budget+' créditos.</p><p><b>'+esc(rec.result.main)+'.</b> '+esc(rec.result.explain)+'</p></div>';}).join('')+(!example?'<label for="memo">Mi justificación y qué cambiaría en la revancha</label><textarea class="memo" id="memo" maxlength="1800" placeholder="Al cambiar una reserva, observé que…"></textarea><p class="memo-print" id="memoPrint"></p>':'<p class="ref">Solución de referencia de la campaña base. Se pueden ensayar otras decisiones y comparar los resultados.</p>')+'<p class="ref">Guardia de continuidad · Escenario docente con cifras simuladas · '+esc(example?'Campaña base':el('mode').selectedOptions[0].textContent)+'</p><div class="modal-actions"><button class="print" id="print">Imprimir / guardar en PDF</button></div></div>';
 modal(example?'Campaña base / ejemplo':'Parte individual',title,html);
 if(!example){el('memo').value=s.memo||'';el('memoPrint').textContent=s.memo||'';el('memo').oninput=()=>{s.memo=el('memo').value;el('memoPrint').textContent=s.memo;save();};}
 el('print').onclick=()=>window.print();
}
el('report').onclick=()=>openReport(false);el('sample').onclick=()=>openReport(true);
el('mode').onchange=e=>{mode=e.target.value;const u=new URL(location.href);u.searchParams.set('juego',k+1);u.searchParams.set('modo',mode);try{history.replaceState(null,'',u);}catch(e){}load();refresh();};
el('reset').onclick=()=>{if(busy)return;modal('Nueva guardia','Reiniciar esta modalidad','<p>Se borrarán los turnos y la justificación de esta campaña. Podéis guardar primero el informe en PDF.</p><div class="modal-actions"><button id="doReset" class="print">Reiniciar partida</button></div>');el('doReset').onclick=()=>{s=blank();save();el('dialog').close();refresh();};};
el('nav').innerHTML=GAMES.map((p,i)=>'<a href="?juego='+(i+1)+'" '+(i===k?'aria-current="page"':'')+'><span>0'+(i+1)+'</span>'+esc(p.title)+'</a>').join('');
document.title=g.title+' · Guardia de continuidad';load();refresh();
</script></body></html>
