</style></head><body><main class="shell"><header><div><p>Sala de recuperación · bitácora de copias</p><h1>La última copia</h1></div><div class="tools"><button data-do="info">Incidente y fuentes</button><button data-do="gloss">Glosario</button><button data-do="example">Parte de ejemplo</button></div></header><div id="app"></div><footer>Continuidad y recuperación · Partida individual guardada en este navegador. Los controles funcionan con teclado.</footer></main><section id="report" class="report"></section><dialog id="pop"><div id="popbody"></div><div class="actions"><button data-do="close" autofocus>Cerrar y volver al juego</button></div></dialog><script>const q = sel=>document.querySelector(sel);
const esc = v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n=>Number(n.toFixed(2)).toLocaleString('es-ES',{maximumFractionDigits:2});
const tag = t=>'<button class="term" data-do="term" data-v="'+esc(t)+'">'+esc(t)+'</button>';

function modal(title,body){q('#popbody').innerHTML='<h2>'+esc(title)+'</h2>'+body;q('#pop').showModal()}

function showInfo(){modal('Del incidente al ejercicio',info+'<p><strong>Ritmo de clase · 30 min estimados</strong></p><p>6 min para el tutorial, 8 min para el primer encargo, 10 min para el segundo y 6 min para comparar una revancha y justificar la decisión. Podéis jugar a vuestro ritmo.</p>')}
function showGloss(){modal('Glosario de la guardia','<dl>'+Object.entries(gloss).map(([a,b])=>'<dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd>').join('')+'</dl>')}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function load(){try{const a=JSON.parse(localStorage.getItem(key));if(a&&a.version===1&&Array.isArray(a.cases)&&a.cases.length===3&&Number.isInteger(a.active)&&a.active>=0&&a.active<3)return a}catch(e){}return {version:1,active:0,cases:[fresh(),fresh(),fresh()]}}
function caseBtn(c,i){const played=data.cases[i].history.some(h=>h.ok);return '<button data-do="case" data-v="'+i+'" aria-current="'+(data.active===i)+'">'+(i===0?'Tutorial':('Encargo '+i))+' · '+esc(c.short)+(played?' ✓':'')+'</button>'}
function parts(x){return '<div class="metrics">'+x.map(([a,b])=>'<div><strong>'+esc(a)+'</strong><span>'+esc(b)+'</span></div>').join('')+'</div>'}
function button(a,label,val='',extra=''){return '<button type="button" data-do="'+a+'" data-v="'+esc(val)+'" '+extra+'>'+label+'</button>'}

function init(){document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,v=b.dataset.v||'';if(a==='close'){q('#pop').close();return}if(a==='term'){termView(v);return}if(a==='gloss'){showGloss();return}if(a==='info'){showInfo();return}if(a==='example'){exampleView();return}if(a==='case'){data.active=+v;message='';save();render();return}if(a==='print'){makeReport();window.print();return}handle(a,v)});document.addEventListener('input',ev=>{if(ev.target.matches('[data-memo]')){state().memo=ev.target.value.slice(0,1600);save()}});window.addEventListener('beforeprint',makeReport);render()}
function nav(){return cases.map(caseBtn).join('')}
function state(){return data.cases[data.active]}
function current(){return cases[data.active]}
function guideText(k){return data.active===0?'Tutor de guardia':'Encargo de operaciones'}
function reviewBox(){return '<label for="memo"><b>Nota para el relevo</b></label><textarea id="memo" data-memo maxlength="1600" placeholder="¿Qué decisión conservaríais y qué comprobaríais después?">'+esc(state().memo)+'</textarea>'}

const key='aula.ultimaCopia.v1',title='La última copia';
const sources=[{autor:'GitLab',titulo:'Postmortem of database outage of January 31 (2017)',url:'https://about.gitlab.com/blog/postmortem-of-database-outage-of-january-31/'},{autor:'GitLab',titulo:'How we used delayed replication for disaster recovery with PostgreSQL (2019)',url:'https://about.gitlab.com/blog/delayed-replication-for-disaster-recovery-with-postgresql/'}];
const info='<p>En enero de 2017 GitLab sufrió un borrado accidental de datos y una interrupción de unas 18 horas. Se perdieron cambios en la base de datos. Los repositorios de código estuvieron inaccesibles durante la caída, pero conservaron su contenido.</p><p>Los tres expedientes trasladan esa distinción a servicios ficticios de reservas, pedidos y billetes. Sus horas, copias, dependencias y objetivos son datos del ejercicio.</p>'+sources.map(s=>'<p><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.autor+' · '+s.titulo+'</a></p>').join('');
const gloss={'RTO':'Tiempo objetivo de recuperación. Se compara con el tiempo total transcurrido desde la interrupción hasta que el servicio definido vuelve a estar disponible.','RPO':'Antigüedad máxima tolerable de los datos que se recuperan, medida hacia atrás desde la interrupción.','Prueba de negocio':'Operación representativa completa que demuestra que una persona puede usar el servicio y que los datos quedan correctos.','Diario':'Secuencia de cambios guardados después de la copia base. Para reproducirla hacen falta los tramos íntegros y consecutivos.','Réplica':'Copia que sigue los cambios de otra máquina y puede llegar a repetir un borrado.','Integridad':'Propiedad que permite confiar en que el contenido conserva el estado esperado. Un archivo legible puede contener un estado de negocio incorrecto.','Reconciliación':'Contraste entre el estado recuperado y otra fuente para localizar operaciones perdidas o duplicadas.','Dependencia':'Componente que debe estar disponible para que otro pueda funcionar.'};
const cases=[
{short:'Reservas',name:'La última reserva de mediodía',line:'Una oficina acaba de cerrar la venta de entradas. El servicio se interrumpe a las 12:00. Conserváis el registro independiente del terminal de taquilla.',cut:720,rpo:15,rto:63,rate:2,unit:'reservas',event:'Una reserva debe ocupar una butaca y figurar una sola vez en el libro de caja.',copies:[['Archivo nocturno',570,16,590,6,1,'Copia íntegra. El diario conservado termina a las 09:50.'],['Imagen de sala',685,20,710,8,1,'Copia íntegra. Hay diario continuo hasta las 11:50.'],['Espejo de cabina',715,9,715,0,0,'El espejo ya reprodujo la pérdida de asignaciones.']],nodes:['Identidad','Base de reservas','Taquilla','Conciliador'],dep:[[],[],[0,1],[2]],times:[4,6,5,4],tests:['Abrir portada','Reservar y releer','Cuadrar caja'],delays:[2,4,5],required:[1,2],winning:1,purpose:'la reserva y el asiento contable',owner:'Taquilla'},
{short:'Pedidos',name:'El lote que parece completo',line:'A las 16:00 se interrumpe el registro de órdenes de un distribuidor. El almacén conserva una lista independiente de salidas por minuto.',cut:960,rpo:10,rto:72,rate:3,unit:'pedidos',event:'Un pedido confirmado debe aparecer una sola vez en la lista de expediciones con su referencia.',copies:[['Copia del muelle',940,24,955,7,1,'Copia íntegra y diario consecutivo hasta las 15:55.'],['Copia del almacén',954,17,954,0,0,'El registro de prueba del pedido 618 falta en el contenido.'],['Copia de seguridad',900,18,940,9,1,'El diario tiene un hueco a las 15:40. Hasta ese punto es continuo.']],nodes:['Directorio','Índice de pedidos','Ventanilla','Expediciones'],dep:[[],[],[0,1],[2]],times:[5,6,6,4],tests:['Comprobar puerto','Registrar y releer','Cuadrar expedición'],delays:[2,5,6],required:[1,2],winning:0,purpose:'el pedido y la expedición',owner:'Almacén'},
{short:'Billetes',name:'Billetes antes del primer tren',line:'Son las 09:30. La taquilla ha perdido la conexión con el libro de billetes. Los tornos conservan una lista separada de los derechos de acceso.',cut:570,rpo:12,rto:58,rate:4,unit:'billetes',event:'Una compra válida debe emitir un derecho de acceso único que el lector del torno pueda reconocer.',copies:[['Imagen regional',550,30,565,9,1,'El diario llega a las 09:25. La transferencia de esta imagen ocupa media hora.'],['Copia de estación',561,15,561,0,1,'Imagen íntegra de las 09:21. El registro posterior no está disponible.'],['Réplica de tornos',568,9,568,0,0,'Esta copia contiene accesos parciales y carece de compras.']],nodes:['Llaves de acceso','Libro de billetes','Taquilla digital','Control de tornos'],dep:[[],[],[0,1],[2]],times:[6,5,5,3],tests:['Ver pantalla inicial','Emitir y releer','Validar en torno'],delays:[2,4,6],required:[1,2],winning:1,purpose:'el billete y el acceso al andén',owner:'Operación ferroviaria'}
];
function fresh(){return {stage:0,pick:-1,journal:false,route:'',order:[],tests:[],memo:'',history:[],variant:false,run:null}}
let data=load(),message='';
const clock=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function metrics(){const s=state(),c=current(),p=c.copies[s.pick];if(!p)return null;const recovered=s.journal?p[3]:p[1],gap=c.cut-recovered,base=p[2]+(s.variant?12:0),copyTime=s.route==='fast'?Math.ceil(base*.65)+3:base+3,elapsed=copyTime+(s.journal?p[4]:0)+c.times.reduce((a,b)=>a+b,0)+s.tests.reduce((a,i)=>a+c.delays[i],0);return {recovered,gap,lost:c.rate*gap,elapsed,copyTime,rpo:gap<=c.rpo,rto:elapsed<=c.rto,integrity:!!p[5],service:c.required.every(i=>s.tests.includes(i)),ok:gap<=c.rpo&&elapsed<=c.rto&&!!p[5]&&c.required.every(i=>s.tests.includes(i)),p:p[0],rtoGoal:c.rto,rpoGoal:c.rpo,route:s.route,variant:s.variant,order:s.order.map(i=>c.nodes[i]),tests:s.tests.map(i=>c.tests[i]),journal:s.journal,unit:c.unit}}
const stageNames=['Elegir copia','Preparar sala','Arrancar servicios','Probar una operación','Parte de guardia'];
function rail(c,s){const low=Math.min(...c.copies.map(p=>p[1]))-5,high=c.cut+5;return '<div class="scope"><div class="rulerhead"><span>ARCHIVO / SEÑAL HORARIA</span><b>'+clock(c.cut)+' · CORTE</b></div><div class="ruler">'+c.copies.map((p,i)=>'<i style="left:'+((p[1]-low)/(high-low)*100)+'%" class="'+(s.pick===i?'on':'')+'"><em>'+String.fromCharCode(65+i)+'</em></i>').join('')+'<u style="left:'+((c.cut-low)/(high-low)*100)+'%"></u></div><div class="rulerhead"><span>'+clock(low)+'</span><span>Minutos de la guardia</span><span>'+clock(high)+'</span></div></div>'}
function tutor(s,c){return ['Leed las fichas. El espejo reciente ya contiene el fallo. Pulsad Imagen de sala y activad el diario para llegar a las 11:50. Comparad los diez minutos de desfase con el RPO de quince.','La sala local necesita tres minutos de preparación. Elegid Sala local y conservad el equipo de reserva para otra guardia. El coste temporal aparece en el recuadro.','Arrancad Identidad y Base de reservas en cualquiera de los dos órdenes. Después, Taquilla y Conciliador. Si os adelantáis, el tablero os dirá qué falta.','Activad Reservar y releer y Cuadrar caja. El tiempo de ambas comprobaciones forma parte del RTO. Ejecutad el ensayo para ver si abrís con evidencia suficiente.','Comparad los dos relojes con sus objetivos y escribid qué comprobaríais al volver a abrir. Pulsad Encargo 1 para resolver el siguiente expediente.'][s.stage]}

pto": "RTO · prueba de negocio", "pista": "Sumad todo lo necesario para que una persona pueda completar la operación, incluidas las pruebas.", "opciones": [{"titulo": "Declarar recuperación a los 23 minutos", "efecto": "La copia ha llegado, pero todavía no se ha demostrado una reserva.", "porque": "La transferencia es una parte del camino, no la operación recuperada.", "correcta": false}, {"titulo": "Acreditar la reapertura a los 59 minutos", "efecto": "59 ≤ 63: quedan cuatro minutos de margen temporal.", "porque": "23 + 8 + 19 + 9 = 59. El desfase de datos sigue siendo diez minutos: RTO y RPO responden a preguntas diferentes.", "correcta": true}, {"titulo": "Sumar diez minutos de RPO al tiempo de reapertura", "efecto": "Se mezclan el reloj de recuperación y la antigüedad de los datos.", "porque": "El desfase hacia atrás no es una duración extra de la restauración; no se suma al RTO de ese modo.", "correcta": false}]}, {"titulo": "Proteger la siguiente copia", "contexto": "La misma cuenta de administración puede borrar producción y todas las copias accesibles. Tenéis que reducir ese fallo común antes de dar por preparada la próxima recuperación.", "concepto": "Salvaguarda · copia aislada · riesgo residual", "pista": "La separación debe existir en permisos y vías de modificación; después comprobad una restauración real.", "opciones": [{"titulo": "Crear una carpeta llamada copia-segura en el mismo servidor", "efecto": "La cuenta comprometida conserva acceso a producción y copia.", "porque": "El nombre no cambia las dependencias ni los permisos.", "correcta": false}, {"titulo": "Separar acceso, mantener una versión aislada y ensayar su restauración", "efecto": "Se limita el daño común y se verifica que los datos se pueden usar.", "porque": "CIS Control 11 reúne proceso, protección, aislamiento y pruebas. Aun así debéis revisar cobertura, frecuencia y resultados.", "correcta": true}, {"titulo": "Cifrar la copia y omitir cualquier prueba", "efecto": "La confidencialidad puede mejorar; la recuperabilidad sigue sin evidencia.", "porque": "Además de proteger el contenido necesitáis disponer de claves, datos íntegros y una operación funcional.", "correcta": false}]}], "revancha": "Añadid doce minutos a cada transferencia. En Reservas la sala local pasa de 59 a 71 minutos y supera RTO 63. La prioritaria reduce la transferencia: 21 + 3 + 8 + 19 + 9 = 60 minutos. Conservad el punto de datos y comparad solo la ruta.", "id": "restauracion", "numero": 3, "fuentes": [{"autor": "Center for Internet Security", "titulo": "CIS Control 11: Data Recovery, v8.1", "url": "https://cas.docs.cisecurity.org/en/latest/source/Controls11/"}, {"autor": "NIST", "titulo": "The NIST Cybersecurity Framework (CSF) 2.0, 2024", "url": "https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20"}, {"autor": "NIST", "titulo": "CSRC Glossary: residual risk", "url": "https://csrc.nist.gov/glossary/term/residual_risk"}], "gloss": {"Riesgo residual": "Riesgo que permanece después del tratamiento. Reducirlo no lo convierte automáticamente en aceptable.", "Salvaguarda": "Medida que modifica un riesgo. Puede ser técnica, humana, física o de organización; hay que comprobar su efecto.", "CIS Controls": "Conjunto priorizado de salvaguardas de ciberseguridad. Incluye tecnología, personas y procesos; puede apoyar un sistema de gestión.", "Copia aislada": "Copia protegida de las mismas credenciales o vías de modificación que el sistema original. La separación limita daños comunes; además hay que probarla.", "Réplica": "Copia sincronizada que puede propagar también un borrado o una corrupción. No sustituye por sí sola una copia recuperable."}}, e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function enhanceInline(){const keys=Object.keys(cfg.gloss).sort((a,b)=>b.length-a.length),pattern=new RegExp('(?<![\\p{L}\\p{N}])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu'),walk=document.createTreeWalker(host,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=walk.nextNode())if(!n.parentElement.closest('button,summary,.apply-terms,ol'))nodes.push(n);for(const node of nodes){const str=node.textContent;pattern.lastIndex=0;if(!pattern.test(str))continue;pattern.lastIndex=0;const f=document.createDocumentFragment();let end=0;for(const m of str.matchAll(pattern)){f.append(document.createTextNode(str.slice(end,m.index)));const b=document.createElement('button');b.className='apply-inline';b.dataset.applyTerm=keys.find(k=>k.toLocaleLowerCase('es')===m[0].toLocaleLowerCase('es'));b.textContent=m[0];f.append(b);end=m.index+m[0].length}f.append(document.createTextNode(str.slice(end)));node.replaceWith(f)}}

 host.innerHTML='<header><div><div class="apply-kicker">Última orden · decisiones con consecuencias</div><h2>Entregad un servicio que podáis defender</h2></div><div class="apply-meter">'+score()+' / 3</div></header><p>Aplicad los conceptos al servicio que acabáis de operar. Las consecuencias de estas tres tarjetas son supuestos explícitos del ejercicio; no cambian las reglas del tablero. Probad una orden, leed qué produce y corregidla cuando haga falta.</p><div class="apply-kicker">Decisión '+(st.index+1)+' de 3 · '+e(d.concepto)+'</div><h3>'+e(d.titulo)+'</h3><p>'+e(d.contexto)+'</p><details id="apply-hint"><summary>Ayuda de guardia</summary><p>'+e(d.pista)+'</p></details><div class="apply-choices">'+d.opciones.map((x,i)=>'<button data-apply-option="'+i+'" aria-pressed="'+(v===i)+'">'+e(x.titulo)+'</button>').join('')+'</div>'+(o?'<div class="apply-feedback" data-ok="'+o.correcta+'" role="status"><b>'+e(o.efecto)+'</b><p>'+e(o.porque)+'</p><small>'+(o.correcta?'Orden justificada. Podéis conservarla en el parte.':'Volved a los datos y ensayad otra orden; el intento queda registrado.')+'</small></div>':'')+'<div class="apply-actions">'+(st.index?'<button data-apply-nav="'+(st.index-1)+'">Revisar anterior</button>':'')+(st.index<2?'<button class="primary" data-apply-nav="'+(st.index+1)+'" '+(!o?.correcta?'disabled':'')+'>Conservar y continuar</button>':score()===3?'<strong>✓ Cierre aplicado completo · incluido en vuestro PDF</strong>':'')+'<button data-apply-reset>Repetir estas decisiones</button></div><div class="apply-terms">'+Object.keys(cfg.gloss).map(t=>'<button data-apply-term="'+e(t)+'">'+e(t)+'</button>').join('')+'</div><details><summary>Conceptos y fuentes</summary><p>'+e(cfg.concepto)+'</p><ol>'+cfg.fuentes.map(r=>'<li>'+e(r.autor)+'. <a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+e(r.titulo)+'</a>.</li>').join('')+'</ol><p>Datos de estas decisiones: modelo docente; no son cifras del incidente histórico.</p></details><p><small>'+(saving?'Estas decisiones se guardan en este navegador y se incluyen en el parte imprimible.':'El navegador no permite guardar. Conservad vuestro parte en PDF.')+'</small> · <a href="ejemplos/'+String(cfg.numero).padStart(2,'0')+'_Parte_resuelto.pdf" target="_blank" rel="noopener">Descargar parte resuelto en PDF</a></p>';

<script>
(()=>{'use strict';
/* Definitions are local. This layer never changes an order, score or saved game. */
const additions=[{"term":"Ciberseguridad","definition":"Protección de los sistemas, los datos y los servicios frente a usos no autorizados, alteraciones e interrupciones.","example":"Una cuenta con permisos limitados reduce lo que puede hacer quien consiga robarla.","aliases":["Cybersecurity"],"games":[]},{"term":"Continuidad","definition":"Forma prevista de mantener las actividades importantes cuando falla la manera habitual de trabajar.","example":"Una taquilla puede seguir vendiendo con un procedimiento alternativo, aunque su aplicación principal esté caída.","aliases":["continuidad del negocio"],"games":[]},{"term":"Recuperación","definition":"Restablecimiento comprobado del servicio y de las condiciones acordadas para utilizarlo.","example":"Encender el servidor es un paso; comprobar que una reserva se guarda una sola vez permite saber si el servicio vuelve a funcionar.","aliases":["recuperaciones","recovery","disaster recovery","data recovery","event recovery"],"games":[]},{"term":"Restauración","definition":"Proceso de reconstruir datos o sistemas a partir de una copia conservada. Después hay que comprobar que sirven para trabajar.","example":"Recuperáis la base de reservas de las 11:25 y aplicáis los cambios posteriores que se conservaron.","aliases":["restaurar"],"games":[]},{"term":"Riesgo","definition":"Posibilidad de que un suceso perjudique un objetivo, considerando tanto qué podría ocurrir como sus consecuencias.","example":"Aunque hoy el directorio funcione, hay que valorar qué pasaría si dejara de autorizar órdenes durante el embarque.","aliases":["riesgos"],"games":[]},{"term":"Riesgo residual","definition":"Riesgo que permanece después de aplicar las medidas. Cumplir un mínimo no hace desaparecer todo lo pendiente.","example":"Con la alternativa salen dieciséis de veinte órdenes. Las cuatro restantes todavía necesitan una decisión y seguimiento.","aliases":["riesgos residuales"],"games":[]},{"term":"Salvaguarda","definition":"Medida que reduce la posibilidad de un problema o sus consecuencias. Puede ser técnica, física u organizativa.","example":"Una lista de permisos preparada de antemano permite autorizar trabajo cuando falla el directorio central.","aliases":["salvaguardas"],"games":[]},{"term":"Control","definition":"Medida que modifica un riesgo o ayuda a comprobar que se cumplen unas condiciones. Debe tener un propósito y probarse.","example":"La prueba de reserva y relectura comprueba algo más útil que mirar si la portada de la aplicación carga.","aliases":["controles"],"games":[]},{"term":"Dependencia","definition":"Elemento que debe funcionar para que otra actividad pueda realizarse.","example":"La taquilla necesita tanto datos de reservas como una identidad autorizada para vender.","aliases":["dependencias"],"games":[]},{"term":"Ventana","definition":"Intervalo de tiempo que se simula en una ronda. Su duración y reglas aparecen en cada juego.","example":"En Puerto de guardia, una ventana representa diez minutos de operación.","aliases":["ventanas","ventana de tiempo"],"games":[]},{"term":"Supuesto","definition":"Condición que se da por válida en el modelo para poder razonar. Si cambia, puede cambiar el resultado.","example":"Que el directorio responda es un supuesto del primer ensayo. La revancha permite comprobar qué ocurre cuando falla.","aliases":["supuestos"],"games":[]},{"term":"Ensayo","definition":"Prueba de una decisión en unas condiciones conocidas, con un resultado que se puede observar.","example":"Compráis una alternativa y la probáis antes de atribuirle una reducción de las interrupciones.","aliases":["ensayos","ensayar"],"games":[]},{"term":"Indicador","definition":"Medida que ayuda a observar una parte de la situación. Conviene saber qué cuenta y qué deja fuera.","example":"Las horas-servicio del juego ayudan a comparar interrupciones, pero no describen por sí solas todos los daños.","aliases":["indicadores"],"games":[]},{"term":"Cobertura","definition":"Parte del conjunto que está atendida por una medida. Tener mucha cobertura no prueba por sí solo que esa medida funcione bien.","example":"Cubrir catálogo, accesos y préstamos exige que los tres servicios tengan alguna medida probada.","aliases":[],"games":[]},{"term":"Evidencia","definition":"Información comprobable que sirve para sostener una afirmación. Hay que conservar su origen y entender sus límites.","example":"Un recibo demuestra lo que llegó al cliente; una luz encendida solo demuestra que ese equipo tenía alimentación.","aliases":["evidencias"],"games":[]},{"term":"Validación","definition":"Comprobación de que un resultado cumple las condiciones acordadas para su uso.","example":"Una reserva se considera recuperada cuando ocupa una butaca y aparece una sola vez en la caja, no solo cuando el archivo se abre.","aliases":["validar","validaciones"],"games":[]},{"term":"Prueba funcional","definition":"Operación representativa que comprueba si una función hace lo que se espera.","example":"Cambiar una configuración y volver a leerla prueba esa función del panel; no demuestra que los registros lleguen al cliente.","aliases":["pruebas funcionales"],"games":[]},{"term":"Prueba de negocio","definition":"Operación completa que comprueba si las personas pueden realizar el trabajo real y si los datos quedan correctos.","example":"Reservar, releer la reserva y cuadrar la caja permite comprobar el servicio de venta.","aliases":["pruebas de negocio"],"games":[]},{"term":"Responsable","definition":"Persona o área que debe decidir, responder del resultado y mantener el seguimiento.","example":"El área de taquilla confirma que la venta vuelve a funcionar; el equipo técnico aporta las pruebas.","aliases":["responsables"],"games":[]},{"term":"Incidente","definition":"Suceso que compromete o amenaza la seguridad o el funcionamiento esperado y requiere una actuación organizada.","example":"Un borrado que impide asignar las reservas necesita identificación, contención y recuperación.","aliases":["incidentes"],"games":[]},{"term":"CIS Controls","definition":"Conjunto priorizado de buenas prácticas de seguridad. Incluye medidas técnicas y también aspectos de organización, formación y respuesta.","example":"Proteger las copias, formar al personal y preparar la respuesta atienden problemas distintos que se complementan.","aliases":["CIS","CIS Control"],"games":[]},{"term":"NIST","definition":"Instituto Nacional de Estándares y Tecnología de Estados Unidos. Publica guías y marcos que ayudan a organizar y evaluar la ciberseguridad.","example":"Un marco de NIST puede ayudar a ordenar resultados deseados; no sustituye la decisión concreta de quién mantiene el embarque.","aliases":[],"games":[]},{"term":"NIST CSF","definition":"Cybersecurity Framework, marco de ciberseguridad de NIST. Su versión 2.0 organiza resultados mediante gobernar, identificar, proteger, detectar, responder y recuperar.","example":"Podéis relacionar la preparación de permisos con proteger y la prueba de reapertura con recuperar.","aliases":["CSF","CSF 2.0"],"games":[]},{"term":"Framework","definition":"Marco de trabajo que organiza ideas, objetivos o prácticas. No suele ser una receta que se aplique igual a todas las organizaciones.","example":"NIST CSF ayuda a ordenar lo que se quiere conseguir; el plan de vuestra organización concreta responsables y acciones.","aliases":["frameworks","marco de trabajo"],"games":[]},{"term":"PDF","definition":"Portable Document Format, formato de documento que conserva la composición de las páginas.","example":"El parte en PDF permite guardar las decisiones y resultados para revisarlos después.","aliases":[],"games":[]},{"term":"JSON","definition":"JavaScript Object Notation, formato de texto para guardar datos mediante nombres y valores.","example":"Una exportación JSON puede guardar el estado de la partida para que un programa vuelva a leerlo.","aliases":[],"games":[]},{"term":"Copia de seguridad","definition":"Copia conservada para poder recuperar información si la original se pierde, se altera o deja de estar disponible. Debe protegerse y probarse.","example":"Una copia antigua puede estar íntegra y aun así dejar fuera demasiadas reservas recientes.","aliases":["copias de seguridad","backup","backups"],"games":[]},{"term":"Directorio","definition":"Servicio central que permite comprobar identidades y autorizaciones. Si deja de responder, puede impedir operaciones aunque la red funcione.","example":"El canal transporta dieciséis órdenes, pero ninguna sale si nadie puede confirmar que están autorizadas.","aliases":["directorios"],"games":[]},{"term":"Credencial","definition":"Dato o documento usado para acreditar una identidad o una autorización.","example":"Una credencial de sala permite comprobar quién puede acceder cuando el sistema central no responde.","aliases":["credenciales"],"games":[]},{"term":"Autorización","definition":"Permiso para realizar una acción concreta. Es diferente de que exista una conexión disponible.","example":"Tener radio no basta para embarcar si el puesto no puede comprobar el permiso de la orden.","aliases":["autorizaciones","autoriza"],"games":[]},{"term":"Conciliación","definition":"Comprobación de que dos registros o el registro y la realidad vuelven a coincidir, resolviendo pérdidas y duplicados.","example":"Después de trabajar en papel, comparáis los lotes que salieron con las salidas guardadas en el sistema central.","aliases":["reconciliación","conciliar","reconciliar","conciliadas","cotejar","conciliadas","conciliados","reconciliados","reconciliadas","por reconciliar"],"games":[]},{"term":"Expedición","definition":"Salida registrada de un producto o pedido hacia su destino.","example":"Producir un lote no equivale a expedirlo: todavía necesita completar el registro de salida.","aliases":["expediciones","expedidos","expedid"],"games":["flujo","restauracion"]},{"term":"RTO","definition":"Recovery Time Objective: tiempo objetivo de recuperación. Marca cuánto se pretende tardar, desde la interrupción, en recuperar el servicio definido.","example":"Si el objetivo es 63 minutos, se suman preparación, restauración, arranque de dependencias y validación; no solo la copia de archivos.","aliases":["Recovery Time Objective"],"games":[]},{"term":"RPO","definition":"Recovery Point Objective: objetivo del punto de recuperación. Expresa la pérdida de datos tolerable medida hacia atrás desde la interrupción.","example":"Si se interrumpe a las 12:00 y recuperáis datos hasta las 11:50, la pérdida temporal observada es de diez minutos.","aliases":["Recovery Point Objective"],"games":[]},{"term":"Réplica","definition":"Copia que recibe los cambios de otro sistema. Puede mejorar la disponibilidad, pero también propagar un borrado o una alteración.","example":"El espejo de cabina ya ha repetido la pérdida de asignaciones; ser reciente no lo convierte en una buena copia de recuperación.","aliases":["réplicas","espejo de cabina","espejo"],"games":["restauracion"]},{"term":"Diario","definition":"Secuencia conservada de cambios que permite avanzar desde una copia anterior hasta un punto posterior. Necesita tramos íntegros y consecutivos.","example":"Una copia de las 11:25 y un diario continuo hasta las 11:50 permiten recuperar un estado más reciente.","aliases":["diarios","journal","log","logs","diario continuo"],"games":["restauracion"]},{"term":"Imagen de sistema","definition":"Copia del estado de un sistema o de un conjunto de datos usada para reconstruirlo. Aquí no es una fotografía.","example":"Imagen de sala es una de las copias que debéis evaluar por antigüedad, integridad y tiempo de recuperación.","aliases":["imagen de sala","imagen"],"games":["restauracion"]},{"term":"Integridad","definition":"Propiedad que permite confiar en que la información conserva el contenido y estado que se espera. Poder abrir un archivo no basta.","example":"Una base de reservas puede abrirse y, aun así, haber perdido qué butaca corresponde a cada persona.","aliases":["íntegra","íntegras","íntegro","íntegros"],"games":[]},{"term":"Identidad","definition":"Información que permite reconocer a una persona, cuenta o servicio para decidir qué puede hacer.","example":"La taquilla necesita reconocer a la cuenta que realiza la venta antes de autorizarla.","aliases":["identidades"],"games":[]},{"term":"Base de datos","definition":"Conjunto organizado de información que un sistema guarda y consulta.","example":"La base de reservas relaciona entradas, butacas y operaciones.","aliases":["bases de datos","base de reservas","database"],"games":[]},{"term":"Puerto de red","definition":"Punto lógico por el que un servicio de un equipo recibe o intercambia comunicaciones. Que responda no demuestra que toda la aplicación funcione.","example":"Comprobar puerto puede confirmar conectividad, pero registrar un pedido y releerlo prueba algo más cercano al trabajo real.","aliases":["puerto"],"games":["restauracion"]},{"term":"Reapertura","definition":"Vuelta a prestar un servicio después de comprobar las condiciones necesarias. Puede ser parcial y tener pendientes explícitos.","example":"La taquilla se reabre cuando las pruebas de reserva y caja son correctas y se acepta lo que queda por conciliar.","aliases":["reabrir"],"games":[]},{"term":"Coste anual","definition":"En este ejercicio, suma del alta y el mantenimiento del primer año, expresada en miles de euros.","example":"Una medida con alta de tres y mantenimiento de uno consume cuatro unidades del presupuesto anual.","aliases":[],"games":[]},{"term":"Horas-servicio","definition":"Unidad que suma tiempo de interrupción por servicio. Es un indicador parcial del daño y no el número de horas de trabajo del personal.","example":"Si dos servicios se interrumpen una hora cada uno, se suman dos horas-servicio.","aliases":["horas servicio","h-servicio","horas-servicio esperadas"],"games":[]},{"term":"Mantenimiento","definition":"Trabajo y coste necesarios para que una medida continúe funcionando después de ponerla en marcha.","example":"Una lista de permisos local pierde utilidad si nunca se actualiza cuando cambian los usuarios.","aliases":[],"games":[]},{"term":"Relevo","definition":"Traspaso de una tarea entre personas o equipos, con lo que funciona, lo que falta y quién debe continuar.","example":"El siguiente turno recibe un acta con pruebas, pendientes y condiciones para cerrar el incidente.","aliases":[],"games":[]},{"term":"Revancha","definition":"Repetición comparativa de un caso con una condición modificada. Permite comprobar qué parte del plan dependía de ella.","example":"Repetís el plan anterior y comparáis el resultado antes de ajustar la decisión.","aliases":["repetición comparativa"],"games":[]},{"term":"Bitácora","definition":"Registro ordenado de lo que se ha hecho y observado durante una operación.","example":"Anotáis qué copia elegisteis, cuánto tardó la restauración y qué prueba confirmó el resultado.","aliases":["bitácoras"],"games":[]},{"term":"min","definition":"Abreviatura de minutos. Conviene distinguir el tiempo de una fase del tiempo total transcurrido.","example":"Preparar durante treinta minutos y restaurar durante veinte ya consume cincuenta minutos.","aliases":["min."],"games":[]},{"term":"Servidor","definition":"Equipo o programa que presta un servicio a otros equipos o personas.","example":"Un servidor puede estar encendido y responder, pero el servicio de venta seguir fallando porque los datos son incorrectos.","aliases":["servidores"],"games":[]},{"term":"Repositorio","definition":"Lugar organizado donde se guardan y gestionan datos, archivos o copias.","example":"Un repositorio de copias separado del sistema afectado puede conservar información útil para la recuperación.","aliases":["repositorios"],"games":[]},{"term":"Confidencialidad","definition":"Protección para que la información solo llegue a quienes tienen autorización para conocerla.","example":"Recuperar el servicio no resuelve por sí solo una filtración de datos personales.","aliases":[],"games":[]},{"term":"Copia aislada","definition":"Copia protegida para que un fallo o una cuenta comprometida en el sistema principal no puedan modificarla por el mismo camino. Debe ser recuperable y estar probada.","example":"Si la cuenta que borra las reservas también puede borrar todas sus copias, todavía hay un problema compartido. Separáis permisos y mantenéis una versión protegida.","aliases":["copias aisladas"],"games":[]},{"term":"Albarán","definition":"Documento que deja constancia de una entrega de mercancía. Permite contrastar qué salió y qué recibió la otra parte.","example":"Antes de repetir un pedido aparentemente perdido, revisáis su albarán para no enviar dos veces la misma mercancía.","aliases":["albaranes"],"games":[]},{"term":"CSRC","definition":"Computer Security Resource Center, el centro de recursos de seguridad informática del NIST. Reúne publicaciones y un glosario técnico.","example":"En las fuentes del juego, CSRC indica dónde se publica una guía o se puede comprobar el significado de un término.","aliases":[],"games":[]},{"term":"Post mortem","definition":"Revisión posterior a un incidente para reconstruir qué ocurrió, qué medidas funcionaron y qué se debe cambiar.","example":"El informe de un fallo de copias puede revelar que una copia existía, pero nadie había comprobado que se pudiera restaurar.","aliases":["postmortem","post-mortem"],"games":[]},{"term":"PostgreSQL","definition":"Sistema de gestión de bases de datos: software que organiza, guarda y permite consultar información.","example":"En las fuentes de GitLab aparece como la tecnología de la base de datos. El juego explica la decisión de recuperación sin exigir que instaléis ese producto.","aliases":[],"games":["restauracion"]},{"term":"Réplica retrasada","definition":"Copia que aplica los cambios del sistema de origen después de un intervalo previsto. Puede dar tiempo a detener un cambio no deseado antes de que llegue a esa copia.","example":"Si se borra información por error, una réplica con retraso podría conservarla todavía; debéis comprobar el punto recuperable y las condiciones reales.","aliases":["delayed replication"],"games":["restauracion"]},{"term":"Ciberresiliencia","definition":"Capacidad de anticipar un problema digital, seguir prestando lo esencial mientras ocurre, recuperar el servicio y aprender para la próxima vez.","example":"Si falla el sistema de préstamos, la biblioteca mantiene una salida controlada en papel y después comprueba que los libros y el registro coinciden.","aliases":[],"games":[]},{"term":"BIA","definition":"Business Impact Analysis, o análisis de impacto en el negocio. Estudia qué actividades importan, qué daño produce interrumpirlas y cuánto tiempo puede tolerarse.","example":"En el puerto se transforma en un encargo concreto: sacar un mínimo de órdenes y todas las urgentes antes de que salga el barco.","aliases":["análisis de impacto en el negocio"],"games":[]}];
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').replace(/\s+/g,' ').trim();
const byId=new Map(),aliases=new Map();
function add(item){
 const id=normalize(item.term);const previous=byId.get(id);
 const record={term:item.term,definition:item.definition,example:item.example||'',aliases:[...new Set([item.term,...(previous?.aliases||[]),...(item.aliases||[])])]};
 byId.set(id,record);
 for(const a of record.aliases)aliases.set(normalize(a),id);
}
for(const [term,definition] of Object.entries(window.continuidadApplied?.config?.gloss||{}))add({term,definition});
for(const item of additions)add(item);
// A canonical entry superseded by a more helpful alias need not appear twice.
for(const [id,r] of byId)if(aliases.get(id)!==id)byId.delete(id);
const records=[...byId.entries()].sort((a,b)=>a[1].term.localeCompare(b[1].term,'es'));
function patternPart(s){return normalize(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[aeioun]/g,c=>({a:'[aá]',e:'[eé]',i:'[ií]',o:'[oó]',u:'[uúü]',n:'[nñ]'}[c])).replace(/ /g,'\\s+');}
const pattern=new RegExp('(?<![\\p{L}\\p{N}_])('+[...aliases.keys()].sort((a,b)=>b.length-a.length).map(patternPart).join('|')+')(?![\\p{L}\\p{N}_])','giu');
function matches(s){pattern.lastIndex=0;return [...String(s).matchAll(pattern)].map(m=>({text:m[0],index:m.index,id:aliases.get(normalize(m[0]))})).filter(m=>m.id);}
function idsIn(s){return [...new Set(matches(s).map(m=>m.id))];}
function surfaceText(node){const w=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);const parts=[];let n;while((n=w.nextNode()))parts.push(n.textContent);return parts.join(' ');}

const dialog=document.createElement('dialog');dialog.id='lex-dialog';dialog.setAttribute('aria-labelledby','lex-heading');dialog.setAttribute('aria-describedby','lex-definition');
dialog.innerHTML='<div class="lex-shell"><div class="lex-top"><span class="lex-kicker">VOCABULARIO DEL JUEGO</span><button type="button" id="lex-close">Cerrar y volver</button></div><div id="lex-content"></div><label class="lex-search-label" for="lex-search">Buscar un término o una sigla</label><input id="lex-search" type="search" autocomplete="off" spellcheck="false" placeholder="Por ejemplo: RTO, cotejo, hash…"><div id="lex-search-results"></div><div class="lex-actions"><button type="button" id="lex-back" hidden>Definición anterior</button><button type="button" id="lex-all">Ver todo el glosario</button><button type="button" id="lex-size" aria-pressed="false">Texto grande</button></div></div>';
document.body.append(dialog);
const content=dialog.querySelector('#lex-content'),search=dialog.querySelector('#lex-search'),results=dialog.querySelector('#lex-search-results');
let returnFocus=null,currentIds=[],isLarge=false,history=[];

setSize();
function el(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(className)n.className=className;return n;}
function showDefinition(id,remember=true){
 const r=byId.get(id);if(!r)return;
 if(remember&&currentIds.length===1&&currentIds[0]!==id)history.push(currentIds[0]);
 currentIds=[id];content.replaceChildren();const h=el('h2',r.term);h.id='lex-heading';h.tabIndex=-1;content.append(h);
 const p=el('p',r.definition);p.id='lex-definition';content.append(p);
 if(r.example){const ex=el('p',undefined,'lex-example');ex.append(el('b','Ejemplo en la práctica'),document.createTextNode(r.example));content.append(ex);}
 for(const p of content.querySelectorAll('p')){
  const walk=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=walk.nextNode()))if(n.parentElement.tagName!=='B')nodes.push(n);
  for(const node of nodes){const found=matches(node.textContent).filter(x=>x.id!==id);if(!found.length)continue;let at=0;const frag=document.createDocumentFragment();for(const m of found){frag.append(document.createTextNode(node.textContent.slice(at,m.index)));const b=el('button',m.text,'lex-term');b.type='button';b.dataset.lexPick=m.id;frag.append(b);at=m.index+m.text.length;}frag.append(document.createTextNode(node.textContent.slice(at)));node.replaceWith(frag);}
 }
 dialog.querySelector('#lex-back').hidden=!history.length;results.replaceChildren();search.value='';if(dialog.open)h.focus({preventScroll:true});
}
function showList(ids,title){
 currentIds=ids;content.replaceChildren();const h=el('h2',title||'Glosario del juego');h.id='lex-heading';h.tabIndex=-1;content.append(h);
 const p=el('p','Elegid una palabra para leer su significado y un ejemplo. Consultar esta ayuda no ejecuta ninguna orden.');p.id='lex-definition';content.append(p);drawList(ids);search.value='';
}
function drawList(ids){
 results.replaceChildren();const count=el('p',ids.length+' '+(ids.length===1?'término':'términos'),'lex-count');count.setAttribute('role','status');results.append(count);
 if(!ids.length){results.append(el('p','No aparece ese término. Probad con la sigla, una parte de la palabra o su significado.'));return;}
 const list=el('div',undefined,'lex-results');for(const id of ids){const r=byId.get(id),b=el('button',r.term);b.type='button';b.dataset.lexPick=id;const short=r.definition.length>100?r.definition.slice(0,97).replace(/\s+\S*$/,'')+'…':r.definition;b.append(el('small',short));list.append(b);}results.append(list);
}
function open(ids,trigger){
 const valid=[...new Set((ids||[]).filter(id=>byId.has(id)))];returnFocus=trigger||document.activeElement;
 history=[];currentIds=[];dialog.querySelector('#lex-back').hidden=true;
 if(valid.length===1)showDefinition(valid[0]);else showList(valid.length?valid:records.map(([id])=>id),valid.length?'Términos de este control':'Glosario del juego');

dialog.addEventListener('keydown',ev=>{

 const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(n=>!n.hidden&&n.getClientRects().length);
 if(!focusable.length){ev.preventDefault();return;}
 const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
 if(ev.shiftKey&&(active===first||!dialog.contains(active))){ev.preventDefault();last.focus()}
 else if(!ev.shiftKey&&(active===last||!dialog.contains(active))){ev.preventDefault();first.focus()}
});

dialog.addEventListener('close',()=>{if(returnFocus?.setAttribute)returnFocus.setAttribute('aria-expanded','false');if(returnFocus?.isConnected&&!returnFocus.disabled)returnFocus.focus({preventScroll:true});else document.querySelector('[data-lex-all]')?.focus({preventScroll:true})});
search.addEventListener('input',()=>{const q=normalize(search.value);const found=records.filter(([id,r])=>normalize(r.term+' '+r.aliases.join(' ')+' '+r.definition).includes(q)).map(([id])=>id);drawList(found);});
const legacyTerms='[data-term],[data-apply-term],[data-do="term"]';
function legacyId(node){return aliases.get(normalize(node.dataset.term||node.dataset.applyTerm||node.dataset.v||''));}
const ownSelector='#lex-dialog,#continuidad-vocabulary-style,.lex-reading-guide';
const excluded='script,style,code,pre,kbd,samp,input,textarea,option,select,svg,button,a,label,summary,noscript,#printArea,#report,#print,[data-apply-report],'+ownSelector;
function attachAccessibility(node,ids){node.dataset.lexIds=JSON.stringify(ids);node.setAttribute('aria-haspopup','dialog');node.setAttribute('aria-controls','lex-dialog');}
function enrich(){
 observer.disconnect();
 try{
  for(const node of document.querySelectorAll(legacyTerms)){
   if(node.closest(ownSelector))continue;const id=legacyId(node);if(!id)continue;node.classList.add('lex-term');attachAccessibility(node,[id]);
  }
  for(const b of document.querySelectorAll('#terms,#glos,[data-do="gloss"]')){b.dataset.lexAll='';b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-controls','lex-dialog');}
  // Inline prose remains text with a light dotted underline. Existing action
  // buttons retain their whole original action and get a separate help control.
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];let node;
  while((node=walker.nextNode()))if(node.parentElement&&!node.parentElement.closest(excluded)&&node.textContent.trim())nodes.push(node);
  for(const n of nodes){
   const found=matches(n.textContent);if(!found.length)continue;const fragment=document.createDocumentFragment();let at=0;
   for(const match of found){fragment.append(document.createTextNode(n.textContent.slice(at,match.index)));const b=el('button',match.text,'lex-term');b.type='button';attachAccessibility(b,[match.id]);b.setAttribute('aria-label','Explicar '+match.text);fragment.append(b);at=match.index+match.text.length;}
   fragment.append(document.createTextNode(n.textContent.slice(at)));n.replaceWith(fragment);
  }
  for(const s of document.querySelectorAll('svg text')){
   if(s.closest(ownSelector))continue;const ids=idsIn(s.textContent);if(!ids.length)continue;s.classList.add('lex-svg');s.setAttribute('role','button');s.setAttribute('tabindex','0');attachAccessibility(s,ids);s.setAttribute('aria-label','Explicar '+ids.map(id=>byId.get(id).term).join(', '));s.closest('svg')?.setAttribute('role','group');
  }
  const controls=[...document.querySelectorAll('button,a,label,summary,select')];
  for(const control of controls){
   if(control.closest(ownSelector+',#printArea,#report,#print,[data-apply-report]')||control.matches('.lex-term,.lex-help,[data-lex-all],[data-lex-ids],[data-lex-summary]')||control.closest('.lex-pair')||control.closest('button,a,label,summary,select')!==control)continue;
   const ids=idsIn(surfaceText(control)||control.getAttribute('aria-label')||'');if(!ids.length)continue;
   // Avoid duplicate help when a label already contains a genuine term button.
   if(control.querySelector('[data-lex-ids]'))continue;
   const help=el('button','?','lex-help');help.type='button';attachAccessibility(help,ids);help.setAttribute('aria-label','Explicar '+ids.map(id=>byId.get(id).term).join(', '));help.title='Consultar el significado sin ejecutar la orden';
   if(control.tagName==='SUMMARY'){control.dataset.lexSummary=JSON.stringify(ids);control.append(help)}else{const pair=el('span',undefined,'lex-pair');pair.style.flex=getComputedStyle(control).flex;control.before(pair);pair.append(control,help);}
  }
 }finally{observer.observe(document.body,{childList:true,subtree:true,characterData:true});}
}
let queued=false;const observer=new MutationObserver(records=>{
 if(records.every(r=>r.target.nodeType===1&&r.target.closest?.(ownSelector)))return;
 if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;enrich()})}
});
const guide=el('div',undefined,'lex-reading-guide');guide.id='lex-reading-guide';guide.setAttribute('role','note');guide.append(el('p','Palabras subrayadas: definición. El botón ? explica un control sin ejecutarlo.'));const find=el('button','Buscar una palabra');find.type='button';find.dataset.lexAll='';guide.append(find);
const header=document.querySelector('header')||document.querySelector('.head');if(header)header.after(guide);else document.body.prepend(guide);
document.addEventListener('click',ev=>{
 if(ev.target.closest('#lex-dialog'))return;
 const trigger=ev.target.closest('[data-lex-ids],[data-lex-all]');if(!trigger)return;
 ev.preventDefault();ev.stopImmediatePropagation();let ids=[];try{ids=JSON.parse(trigger.dataset.lexIds||'[]')}catch{}
 open(ids,trigger);
},true);
document.addEventListener('keydown',ev=>{
 const trigger=ev.target.closest('.lex-svg');if(!trigger||!['Enter',' '].includes(ev.key))return;ev.preventDefault();ev.stopImmediatePropagation();open(JSON.parse(trigger.dataset.lexIds),trigger);
},true);
document.addEventListener('change',()=>{if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;enrich()})}});
function audit(){
 const counts={};const missing=[];const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while((n=w.nextNode())){
  const p=n.parentElement;if(!p||p.closest('script,style,code,pre,kbd,samp,input,textarea,option,noscript,#lex-dialog,#printArea,#report,#print,.lex-reading-guide,[data-apply-report]'))continue;
  for(const match of matches(n.textContent)){
   const covered=!!p.closest('[data-lex-ids],.lex-pair,[data-lex-summary]');const key=byId.get(match.id).term;counts[key]??={occurrences:0,covered:0};counts[key].occurrences++;if(covered)counts[key].covered++;else missing.push({term:key,text:n.textContent.trim().slice(0,160),tag:p.tagName});
  }
 }
 return {definitions:byId.size,terms:counts,missing};
}
enrich();
window.continuidadVocabulary={version:'2026-11-26',definitions:Object.fromEntries(records.map(([id,r])=>[r.term,r])),open:(term)=>open(term?[aliases.get(normalize(term))]:[]),refresh:enrich,audit};
})();

</script>
