</style></head><body><main class="shell"><header><div><p>Biblioteca · mesa de inversiones y ensayos</p><h1>El patronato</h1></div><div class="tools"><button data-do="info">Incidente y fuentes</button><button data-do="gloss">Glosario</button><button data-do="example">Parte de ejemplo</button></div></header><div id="app"></div><footer>Continuidad y recuperación · Partida individual guardada en este navegador. Los controles funcionan con teclado.</footer></main><section id="report" class="report"></section><dialog id="pop"><div id="popbody"></div><div class="actions"><button data-do="close" autofocus>Cerrar y volver al juego</button></div></dialog><script>const q = sel=>document.querySelector(sel);
const esc = v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n=>Number(n.toFixed(2)).toLocaleString('es-ES',{maximumFractionDigits:2});
const tag = t=>'<button class="term" data-do="term" data-v="'+esc(t)+'">'+esc(t)+'</button>';
function tell(text){message=text;render()}
function modal(title,body){q('#popbody').innerHTML='<h2>'+esc(title)+'</h2>'+body;q('#pop').showModal()}
function termView(t){modal(t,'<p>'+esc(gloss[t]||'')+'</p>')}
function showInfo(){modal('Del incidente al ejercicio',info+'<p><strong>Ritmo de clase · 30 min estimados</strong></p><p>6 min para el tutorial, 8 min para el primer encargo, 10 min para el segundo y 6 min para comparar una revancha y justificar la decisión. Podéis jugar a vuestro ritmo.</p>')}
function showGloss(){modal('Glosario de la guardia','<dl>'+Object.entries(gloss).map(([a,b])=>'<dt>'+esc(a)+'</dt><dd>'+esc(b)+'</dd>').join('')+'</dl>')}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function load(){try{const a=JSON.parse(localStorage.getItem(key));if(a&&a.version===1&&Array.isArray(a.cases)&&a.cases.length===3&&Number.isInteger(a.active)&&a.active>=0&&a.active<3)return a}catch(e){}return {version:1,active:0,cases:[fresh(),fresh(),fresh()]}}
function caseBtn(c,i){const played=data.cases[i].history.some(h=>h.ok);return '<button data-do="case" data-v="'+i+'" aria-current="'+(data.active===i)+'">'+(i===0?'Tutorial':('Encargo '+i))+' · '+esc(c.short)+(played?' ✓':'')+'</button>'}
function parts(x){return '<div class="metrics">'+x.map(([a,b])=>'<div><strong>'+esc(a)+'</strong><span>'+esc(b)+'</span></div>').join('')+'</div>'}
function button(a,label,val='',extra=''){return '<button type="button" data-do="'+a+'" data-v="'+esc(val)+'" '+extra+'>'+label+'</button>'}
function flash(s){return '<div class="feedback" role="status">'+esc(s)+'</div>'}
function init(){document.addEventListener('click',ev=>{const b=ev.target.closest('button[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,v=b.dataset.v||'';if(a==='close'){q('#pop').close();return}if(a==='term'){termView(v);return}if(a==='gloss'){showGloss();return}if(a==='info'){showInfo();return}if(a==='example'){exampleView();return}if(a==='case'){data.active=+v;message='';save();render();return}if(a==='print'){makeReport();window.print();return}handle(a,v)});document.addEventListener('input',ev=>{if(ev.target.matches('[data-memo]')){state().memo=ev.target.value.slice(0,1600);save()}});window.addEventListener('beforeprint',makeReport);render()}
function nav(){return cases.map(caseBtn).join('')}
function state(){return data.cases[data.active]}
function current(){return cases[data.active]}
function guideText(k){return data.active===0?'Tutor de guardia':'Encargo de operaciones'}
function reviewBox(){return '<label for="memo"><b>Nota para el relevo</b></label><textarea id="memo" data-memo maxlength="1600" placeholder="¿Qué decisión conservaríais y qué comprobaríais después?">'+esc(state().memo)+'</textarea>'}

const key='aula.patronato.v1',title='El patronato';
const sources=[{autor:'British Library',titulo:'British Library cyber incident review, 8 de marzo de 2024',url:'https://www.bl.uk/files/v5dwkion/production/99206a2d1e9f07b35712b78f7d75fbb09560c08d.pdf/british-library-cyber-incident-review-8-march-2024.pdf'},{autor:'British Library',titulo:'Cyber-attack recovery update',url:'https://www.bl.uk/about/cyber-attack'}];
const info='<p>La British Library mantuvo abiertos sus edificios y salas de lectura tras el ataque de octubre de 2023. Los servicios de investigación quedaron muy limitados. Su revisión explica cómo los sistemas antiguos complicaron la recuperación.</p><p>Aquí dirigís tres bibliotecas ficticias. Las ofertas, presupuestos y reducciones de horas son parámetros de este modelo docente. Ninguna cifra representa un presupuesto o una decisión real de la British Library.</p>'+sources.map(s=>'<p><a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.autor+' · '+s.titulo+'</a></p>').join('');
const gloss={'Cartera':'Conjunto de inversiones que elegís para mejorar los servicios con un presupuesto común.','Riesgo residual':'Riesgo que permanece tras aplicar las medidas. Aquí se sigue con un indicador parcial: horas-servicio esperadas al año. Una evaluación real también considera otros daños, probabilidades y criterios de aceptación.','Cobertura':'Proporción de servicios para los que hay al menos una medida con efecto comprobado.','Coste anual':'En el ejercicio, coste del alta más el mantenimiento del primer año, en miles de euros.','Ensayo':'Prueba de una medida en una operación representativa. En el modelo, solo un ensayo permite atribuirle la reducción al publicar el indicador acreditado.','Responsable':'Área que debe responder del servicio y acordar las siguientes medidas sobre el riesgo restante.','Aceptación':'Decisión explícita de conservar un riesgo después de revisarlo, con una persona responsable y una fecha de reconsideración.','Impacto':'Consecuencia de la interrupción para el servicio. En el ejercicio, el indicador reúne horas de interrupción esperada por servicio durante un año.'};
const areas=['Catálogo','Accesos','Préstamos'],owners=['Colecciones','Atención al público','Circulación'];
const projects=[
{n:'Catálogo portátil',type:'Operación local',setup:3,keep:1,time:2,e:[60,0,0],d:'Una versión de consulta local permite localizar materiales durante la caída.'},
{n:'Restauración común',type:'Recuperación',setup:4,keep:1,time:3,e:[35,45,30],d:'Un equipo recupera los tres sistemas y verifica las transacciones de punta a punta.'},
{n:'Credencial de sala',type:'Procedimiento alternativo',setup:2,keep:1,time:1,e:[0,60,0],d:'Una lista local permite comprobar autorizaciones y reconciliarlas después.'},
{n:'Préstamo en papel',type:'Registro de reserva',setup:3,keep:1,time:2,e:[0,30,70],d:'Un talonario numerado garantiza la trazabilidad de las salidas de libros.'},
{n:'Renovar el núcleo',type:'Migración',setup:6,keep:2,time:4,e:[75,25,15],d:'La biblioteca sustituye un sistema antiguo y ensaya cómo recuperar sus interfaces.'}
];
const cases=[
{short:'Biblioteca central',name:'Apertura de la sala central',brief:'El edificio ya está abierto. Los lectores pueden entrar, pero encontrar un ejemplar y registrar su salida sigue dependiendo de sistemas distintos.',base:[12,8,4],cap:12,hours:5,goal:11,coverage:3,change:0,cause:'Durante la temporada de consultas aumenta en 5 h/año la exposición del catálogo.'},
{short:'Archivo regional',name:'Los permisos de la sala restringida',brief:'El archivo comparte depósito con varias instituciones. Las interrupciones en la validación de lectores explican la mayor parte de las horas de servicio perdidas.',base:[6,17,7],cap:10,hours:4,goal:16,coverage:3,change:1,cause:'El horario ampliado eleva en 5 h/año la exposición del servicio de accesos.'},
{short:'Red de préstamo',name:'La semana de los préstamos',brief:'La red presta lotes a bibliotecas escolares. Logística necesita poder reconciliar los libros que salen aun cuando la aplicación central se interrumpe.',base:[7,8,18],cap:12,hours:5,goal:13,coverage:3,change:2,cause:'La campaña escolar aumenta en 5 h/año la exposición del servicio de préstamos.'}
];
function fresh(){return {stage:0,priority:-1,invest:[],tested:[],owner:-1,review:'',variant:false,history:[],run:null,memo:''}}
let data=load(),message='';const cost=i=>projects[i].setup+projects[i].keep;
function base(c,s){return c.base.map((v,i)=>v+(s.variant&&i===c.change?5:0))}
function evaluate(c,s){const b=base(c,s),eff=ids=>b.map((v,j)=>Math.max(0,...ids.map(i=>projects[i].e[j]))),pot=eff(s.invest),verified=eff(s.tested),after=b.map((v,j)=>Math.round(v*(100-verified[j]))/100),top=after.indexOf(Math.max(...after)),budget=s.invest.reduce((a,i)=>a+cost(i),0),hours=s.tested.reduce((a,i)=>a+projects[i].time,0),res=after.reduce((a,z)=>a+z,0),cov=verified.filter(z=>z>0).length,first=b.indexOf(Math.max(...b)),right=s.owner===top,priority=s.priority===first,review=s.review==='dated';
return {b,after,top,budget,hours,res:Math.round(res*100)/100,cov,potential:b.reduce((a,v,j)=>a+v*(100-pot[j])/100,0),pot,verified,priority,right,review,ok:res<=c.goal+.0001&&cov>=c.coverage&&right&&review&&priority&&budget<=c.cap&&hours<=c.hours,variant:s.variant,invest:[...s.invest],tested:[...s.tested],selected:s.priority,owner:s.owner,cycle:s.review}}
function bars(a,caption,mx){return '<div class="riskbars"><div class="kicker">'+esc(caption)+'</div>'+a.map((v,i)=>'<div class="riskrow"><span>'+areas[i]+'</span><div><i style="width:'+v/mx*100+'%"></i></div><strong>'+fmt(v)+' h</strong></div>').join('')+'</div>'}
function selectable(a,val,title,small,on,mark=''){return button(a,'<b>'+title+'</b><small>'+small+'</small>',val,'class="pick '+mark+'" aria-pressed="'+on+'"')}
const stages=['Orden del día','Adjudicación','Mesa de ensayo','Acta y revisión','Balance'];
function tutor(s){return ['Localizad el servicio con más horas anuales expuestas. Para este edificio es Catálogo, con 12. Pulsad su ficha y ratificad la prioridad.','Financiad Catálogo portátil, Credencial de sala y Préstamo en papel. Sumad alta y mantenimiento del primer año. Quedará 1 de los 12 miles de euros.','Llevad los tres proyectos contratados al banco de ensayos. Consumen 2 + 1 + 2 horas. Observad cómo se acredita la reducción y se extiende a tres servicios.','Elegid Colecciones, el área del catálogo, que conserva 4,8 h/año de riesgo. Programad una revisión a noventa días y firmad el acta.','La cartera deja 9,2 horas-servicio anuales entre tres servicios. En el segundo encargo tendréis otro presupuesto y otro servicio prioritario.'][s.stage]}
function illustration(){const c=current(),s=state(),m=evaluate(c,s);return '<svg class="heroart" viewBox="0 0 268 102" role="img" aria-label="Tres fondos bibliotecarios. Servicios cubiertos por ensayos: '+m.cov+' de tres"><path d="M4 26L133 5l129 21v5H4z" fill="#7b363f"/><path d="M13 33h243v55H13z" fill="#e4ddc6" stroke="#957c68"/><g stroke="#886e5f" stroke-width="2"><path d="M18 36h231M16 62h233M6 89h255M5 94h258"/><path d="M19 34v54m77-54v54m77-54v54m75-54v54"/></g>'+[0,1,2].map((j)=>{const x=25+j*77,ink=m.verified[j]?'#466752':'#98665e';return '<g fill="'+ink+'">'+[0,1,2,3,4,5,6].map((n)=>'<rect x="'+(x+n*8.8)+'" y="'+(39+n%3*2)+'" width="'+(n%2?5:7)+'" height="'+(21-n%3*2)+'"/>').join('')+'</g><text x="'+(x+31)+'" y="77" text-anchor="middle" font-size="8.1" font-weight="bold" font-family="monospace" fill="#403732">'+['CATÁLOGO','ACCESOS','PRÉSTAMOS'][j]+'</text>'}).join('')+'</svg>'}
function render(){const s=state(),c=current(),m=evaluate(c,s),guide=data.active===0&&!s.variant;let html='';
if(s.stage===0){html='<h3>¿Qué servicio abre el orden del día?</h3><p>Las horas estimadas combinan la frecuencia de los cortes y su duración. Señalad el mayor impacto esperado para orientar la reunión.</p>'+bars(m.b,'Horas de interrupción esperada por servicio y año',Math.max(...m.b))+areas.map((a,i)=>selectable('priority',i,a,owners[i]+' · '+fmt(m.b[i])+' h/año',s.priority===i,guide&&i===0?'marked':'')).join('');}
if(s.stage===1){html='<h3>Pliego de inversiones</h3><p>Comprad una combinación que podáis ensayar. Cada oferta indica el porcentaje de interrupción que podría evitar en catálogo, accesos y préstamos, en ese orden.</p><div class="offers">'+projects.map((p,i)=>button('buy','<div class="offerline"><small>'+esc(p.type.toUpperCase())+'</small><b>'+cost(i)+' mil €</b></div><h4>'+(s.invest.includes(i)?'✓ ':'')+esc(p.n)+'</h4><p>'+esc(p.d)+'</p><small>Alta '+p.setup+' + mantenimiento '+p.keep+' · ensayo '+p.time+' h</small><div class="exposures">'+p.e.map((v,j)=>'<span>'+['Cat.','Acc.','Prés.'][j]+' '+v+' %</span>').join('')+'</div>',i,'class="offer '+(s.invest.includes(i)?'bought':'')+'" aria-pressed="'+s.invest.includes(i)+'"')).join('')+'</div>';}
if(s.stage===2){html='<h3>Probad qué funciona de lo contratado</h3><p>Usad el tiempo de ensayo en ejercicios reales de recuperación. Cuando dos medidas cubren el mismo servicio, el indicador de este modelo conserva la mayor reducción acreditada.</p>'+s.invest.map(i=>selectable('test',i,projects[i].n,projects[i].time+' h · '+projects[i].d,s.tested.includes(i))).join('')+bars(m.after,'Interrupción residual acreditada por servicio',Math.max(...m.b));}

function resultLines(r,c){return [['Orden del día',r.priority,'El mayor impacto inicial corresponde a '+areas[r.b.indexOf(Math.max(...r.b))]+'.'],['Cartera y ensayos',r.res<=c.goal&&r.cov>=3,'Quedan '+fmt(r.res)+' h/año frente al máximo de '+c.goal+'. La cobertura acreditada es '+r.cov+'/3.'],['Responsabilidad',r.right,'El mayor riesgo restante corresponde a '+areas[r.top]+' ('+fmt(r.after[r.top])+' h/año), a cargo de '+owners[r.top]+'.'],['Revisión',r.review,r.review?'El área revisará el acuerdo en 90 días y después de cambios importantes.':'Todavía falta concretar cuándo volverá el asunto al patronato.']].map(([t,ok,msg])=>'<div class="logitem"><b>'+(ok?'✓ ':'× ')+t+'</b> · '+msg+'</div>').join('')}

else if(s.stage===2&&(!s.tested.length||(g&&![0,2,3].every(i=>s.tested.includes(i)))))message=g?'Ensayad los tres proyectos para acreditar los tres servicios.':'Ejecutad al menos un ensayo.';
else if(s.stage===3&&((s.owner<0||!s.review)||(g&&(!t.right||!t.review))))message=g?'El riesgo más alto queda en Catálogo. Asignad Colecciones y fijad una revisión.':'Designad el área y seleccionad un acuerdo de seguimiento.';
else if(s.stage===3){s.run=t;s.history.push(t);s.history=s.history.slice(-12);s.stage=4}else if(s.stage<3)s.stage++;

qué podría ocurrir como sus consecuencias.","example":"Aunque hoy el directorio funcione, hay que valorar qué pasaría si dejara de autorizar órdenes durante el embarque.","aliases":["riesgos"],"games":[]},{"term":"Riesgo residual","definition":"Riesgo que permanece después de aplicar las medidas. Cumplir un mínimo no hace desaparecer todo lo pendiente.","example":"Con la alternativa salen dieciséis de veinte órdenes. Las cuatro restantes todavía necesitan una decisión y seguimiento.","aliases":["riesgos residuales"],"games":[]},{"term":"Salvaguarda","definition":"Medida que reduce la posibilidad de un problema o sus consecuencias. Puede ser técnica, física u organizativa.","example":"Una lista de permisos preparada de antemano permite autorizar trabajo cuando falla el directorio central.","aliases":["salvaguardas"],"games":[]},{"term":"Control","definition":"Medida que modifica un riesgo o ayuda a comprobar que se cumplen unas condiciones. Debe tener un propósito y probarse.","example":"La prueba de reserva y relectura comprueba algo más útil que mirar si la portada de la aplicación carga.","aliases":["controles"],"games":[]},{"term":"Dependencia","definition":"Elemento que debe funcionar para que otra actividad pueda realizarse.","example":"La taquilla necesita tanto datos de reservas como una identidad autorizada para vender.","aliases":["dependencias"],"games":[]},{"term":"Supuesto","definition":"Condición que se da por válida en el modelo para poder razonar. Si cambia, puede cambiar el resultado.","example":"Que el directorio responda es un supuesto del primer ensayo. La revancha permite comprobar qué ocurre cuando falla.","aliases":["supuestos"],"games":[]},{"term":"Escenario","definition":"Conjunto de circunstancias con las que se plantea un caso. No es una predicción de que vaya a ocurrir exactamente así.","example":"Una galería cortada y un directorio operativo forman un escenario distinto al mismo corte con el directorio caído.","aliases":["escenarios"],"games":[]},{"term":"Ensayo","definition":"Prueba de una decisión en unas condiciones conocidas, con un resultado que se puede observar.","example":"Compráis una alternativa y la probáis antes de atribuirle una reducción de las interrupciones.","aliases":["ensayos","ensayar"],"games":[]},{"term":"Indicador","definition":"Medida que ayuda a observar una parte de la situación. Conviene saber qué cuenta y qué deja fuera.","example":"Las horas-servicio del juego ayudan a comparar interrupciones, pero no describen por sí solas todos los daños.","aliases":["indicadores"],"games":[]},{"term":"Eficacia","definition":"Grado en que una medida consigue el resultado previsto en las condiciones comprobadas.","example":"La ruta alternativa es eficaz para el mínimo si transporta las órdenes necesarias dentro del plazo.","aliases":["eficaz","eficaces","efectividad"],"games":[]},{"term":"Cobertura","definition":"Parte del conjunto que está atendida por una medida. Tener mucha cobertura no prueba por sí solo que esa medida funcione bien.","example":"Cubrir catálogo, accesos y préstamos exige que los tres servicios tengan alguna medida probada.","aliases":[],"games":[]},{"term":"Evidencia","definition":"Información comprobable que sirve para sostener una afirmación. Hay que conservar su origen y entender sus límites.","example":"Un recibo demuestra lo que llegó al cliente; una luz encendida solo demuestra que ese equipo tenía alimentación.","aliases":["evidencias"],"games":[]},{"term":"Trazabilidad","definition":"Posibilidad de seguir qué ocurrió, con qué elemento, cuándo y quién intervino.","example":"Un resguardo numerado ayuda a relacionar una salida física con la anotación que se incorpora después.","aliases":["trazable"],"games":[]},{"term":"Validación","definition":"Comprobación de que un resultado cumple las condiciones acordadas para su uso.","example":"Una reserva se considera recuperada cuando ocupa una butaca y aparece una sola vez en la caja, no solo cuando el archivo se abre.","aliases":["validar","validaciones"],"games":[]},{"term":"Aceptación","definition":"Decisión explícita de dar por suficiente un resultado o conservar un riesgo según los criterios acordados. Requiere una persona responsable.","example":"Un cierre parcial deja constancia de qué funciona, qué falta y qué prueba permitiría cerrar lo pendiente.","aliases":["aceptar el riesgo","aceptación del riesgo"],"games":[]},{"term":"Responsable","definition":"Persona o área que debe decidir, responder del resultado y mantener el seguimiento.","example":"El área de taquilla confirma que la venta vuelve a funcionar; el equipo técnico aporta las pruebas.","aliases":["responsables"],"games":[]},{"term":"Incidente","definition":"Suceso que compromete o amenaza la seguridad o el funcionamiento esperado y requiere una actuación organizada.","example":"Un borrado que impide asignar las reservas necesita identificación, contención y recuperación.","aliases":["incidentes"],"games":[]},{"term":"ERM","definition":"Enterprise Risk Management, o gestión integral de riesgos de la organización. Relaciona riesgos de distintas áreas con sus objetivos y decisiones.","example":"El patronato compara continuidad, costes, atención al público y responsabilidades en una misma decisión.","aliases":["Enterprise Risk Management"],"games":[]},{"term":"ISO/IEC 27001","definition":"Norma de requisitos para un sistema de gestión de la seguridad de la información. Organiza responsabilidades, evaluación de riesgos, controles y mejora.","example":"Una certificación se refiere al alcance evaluado del sistema de gestión; no promete que nunca habrá incidentes.","aliases":["ISO 27001","ISO/IEC27001"],"games":[]},{"term":"CIS Controls","definition":"Conjunto priorizado de buenas prácticas de seguridad. Incluye medidas técnicas y también aspectos de organización, formación y respuesta.","example":"Proteger las copias, formar al personal y preparar la respuesta atienden problemas distintos que se complementan.","aliases":["CIS","CIS Control"],"games":[]},{"term":"NIST","definition":"Instituto Nacional de Estándares y Tecnología de Estados Unidos. Publica guías y marcos que ayudan a organizar y evaluar la ciberseguridad.","example":"Un marco de NIST puede ayudar a ordenar resultados deseados; no sustituye la decisión concreta de quién mantiene el embarque.","aliases":[],"games":[]},{"term":"PDF","definition":"Portable Document Format, formato de documento que conserva la composición de las páginas.","example":"El parte en PDF permite guardar las decisiones y resultados para revisarlos después.","aliases":[],"games":[]},{"term":"JSON","definition":"JavaScript Object Notation, formato de texto para guardar datos mediante nombres y valores.","example":"Una exportación JSON puede guardar el estado de la partida para que un programa vuelva a leerlo.","aliases":[],"games":[]},{"term":"Credencial","definition":"Dato o documento usado para acreditar una identidad o una autorización.","example":"Una credencial de sala permite comprobar quién puede acceder cuando el sistema central no responde.","aliases":["credenciales"],"games":[]},{"term":"Autorización","definition":"Permiso para realizar una acción concreta. Es diferente de que exista una conexión disponible.","example":"Tener radio no basta para embarcar si el puesto no puede comprobar el permiso de la orden.","aliases":["autorizaciones","autoriza"],"games":[]},{"term":"Talonario numerado","definition":"Cuaderno de justificantes con números distintos y consecutivos que permiten seguir las operaciones.","example":"Es más lento de rellenar que un papel libre en el modelo, pero permite cotejar después más resguardos por persona.","aliases":[],"games":[]},{"term":"Conciliación","definition":"Comprobación de que dos registros o el registro y la realidad vuelven a coincidir, resolviendo pérdidas y duplicados.","example":"Después de trabajar en papel, comparáis los lotes que salieron con las salidas guardadas en el sistema central.","aliases":["reconciliación","conciliar","reconciliar","conciliadas","cotejar","conciliadas","conciliados","reconciliados","reconciliadas","por reconciliar"],"games":[]},{"term":"Transacción","definition":"Operación que debe quedar registrada de forma coherente y completa.","example":"Una venta ocupa una butaca y genera un apunte de caja; si solo ocurre una mitad, el servicio no ha quedado bien recuperado.","aliases":["transacciones"],"games":[]},{"term":"Cartera","definition":"Conjunto de inversiones que se eligen con un presupuesto común. Importa su efecto conjunto y no solo lo atractiva que parece cada compra.","example":"El patronato combina alternativas para catálogo, accesos y préstamos.","aliases":[],"games":[]},{"term":"Coste anual","definition":"En este ejercicio, suma del alta y el mantenimiento del primer año, expresada en miles de euros.","example":"Una medida con alta de tres y mantenimiento de uno consume cuatro unidades del presupuesto anual.","aliases":[],"games":[]},{"term":"Horas-servicio","definition":"Unidad que suma tiempo de interrupción por servicio. Es un indicador parcial del daño y no el número de horas de trabajo del personal.","example":"Si dos servicios se interrumpen una hora cada uno, se suman dos horas-servicio.","aliases":["horas servicio","h-servicio","horas-servicio esperadas"],"games":[]},{"term":"Exposición","definition":"Situación de un activo o servicio frente a un posible daño. En El patronato se observa con un indicador de interrupciones esperadas, no con toda la evaluación de riesgos.","example":"Un horario más largo de uso del catálogo puede aumentar las horas-servicio esperadas si no cambia la protección.","aliases":["exposiciones"],"games":[]},{"term":"Migración","definition":"Traslado a otro sistema o tecnología. Requiere comprobar que los datos y las operaciones siguen funcionando.","example":"Renovar el núcleo sustituye un sistema antiguo; también hay que probar que sus conexiones con otros servicios funcionan.","aliases":["migraciones"],"games":[]},{"term":"Interfaz","definition":"Punto o forma de relación entre dos sistemas o entre una persona y una aplicación.","example":"El catálogo y el préstamo necesitan intercambiar referencias mediante una interfaz compatible.","aliases":["interfaces"],"games":[]},{"term":"Mantenimiento","definition":"Trabajo y coste necesarios para que una medida continúe funcionando después de ponerla en marcha.","example":"Una lista de permisos local pierde utilidad si nunca se actualiza cuando cambian los usuarios.","aliases":[],"games":[]},{"term":"Indicador acreditado","definition":"Valor que el ejercicio permite sostener con las medidas que ya se han probado. No atribuye a una compra pendiente de ensayo un resultado demostrado.","example":"Una inversión seleccionada puede mejorar la previsión, pero su reducción solo se acredita después del ensayo.","aliases":["acreditado","acreditada"],"games":["cartera"]},{"term":"Relevo","definition":"Traspaso de una tarea entre personas o equipos, con lo que funciona, lo que falta y quién debe continuar.","example":"El siguiente turno recibe un acta con pruebas, pendientes y condiciones para cerrar el incidente.","aliases":[],"games":[]},{"term":"Acta","definition":"Documento que deja constancia de lo observado y decidido, con sus límites y responsables.","example":"Un acta parcial puede afirmar que el panel funciona y mantener abierta la comprobación de entrega de registros.","aliases":[],"games":[]},{"term":"Revancha","definition":"Repetición comparativa de un caso con una condición modificada. Permite comprobar qué parte del plan dependía de ella.","example":"Repetís el plan anterior y comparáis el resultado antes de ajustar la decisión.","aliases":["repetición comparativa"],"games":[]},{"term":"min","definition":"Abreviatura de minutos. Conviene distinguir el tiempo de una fase del tiempo total transcurrido.","example":"Preparar durante treinta minutos y restaurar durante veinte ya consume cincuenta minutos.","aliases":["min."],"games":[]},{"term":"h/año","definition":"Horas por año. En El patronato el indicador reúne el tiempo de interrupción esperado de un servicio durante un año.","example":"Una cifra de doce h/año representa doce horas anuales esperadas en el modelo; no significa que se conozca el día exacto de la interrupción.","aliases":[],"games":[]},{"term":"Servidor","definition":"Equipo o programa que presta un servicio a otros equipos o personas.","example":"Un servidor puede estar encendido y responder, pero el servicio de venta seguir fallando porque los datos son incorrectos.","aliases":["servidores"],"games":[]},{"term":"Disponibilidad","definition":"Posibilidad de acceder a la información o utilizar un servicio cuando se necesita y con las condiciones requeridas.","example":"La biblioteca puede estar físicamente abierta mientras su catálogo digital no está disponible.","aliases":[],"games":[]},{"term":"Certificación","definition":"Evaluación por la que se reconoce que un alcance concreto cumple unos requisitos. No significa ausencia de incidentes.","example":"Una certificación de un sistema de gestión debe leerse junto a su alcance y condiciones.","aliases":["certificaciones","certificado"],"games":[]},{"term":"Umbral","definition":"Valor que marca una condición o límite para decidir.","example":"Si el mínimo es catorce órdenes, trece no cumple aunque esté cerca.","aliases":["umbrales"],"games":[]},{"term":"SGSI","definition":"Sistema de gestión de seguridad de la información. Es la forma organizada de decidir qué proteger, quién responde, qué medidas se aplican y cómo se comprueba y mejora su resultado.","example":"En la biblioteca incluye responsables, criterios para aceptar riesgos, pruebas de recuperación y revisión de los resultados; no es un programa que se instala.","aliases":[],"games":[]},{"term":"Indicador residual","definition":"Medida utilizada para seguir una parte del riesgo que permanece tras aplicar las medidas. No resume todos los daños posibles.","example":"En El patronato son horas de interrupción esperadas al año: bajar de 24 a 9,2 permite comparar carteras, pero no demuestra que haya desaparecido todo el riesgo.","aliases":[],"games":[]},{"term":"Albarán","definition":"Documento que deja constancia de una entrega de mercancía. Permite contrastar qué salió y qué recibió la otra parte.","example":"Antes de repetir un pedido aparentemente perdido, revisáis su albarán para no enviar dos veces la misma mercancía.","aliases":["albaranes"],"games":[]},{"term":"Pliego","definition":"Documento que establece qué se necesita contratar y las condiciones que deben cumplir las ofertas.","example":"En El patronato comparáis coste, efecto esperado y tiempo de prueba de cada propuesta, antes de gastar el presupuesto.","aliases":["pliegos"],"games":["cartera"]},{"term":"Adjudicación","definition":"Decisión de qué propuesta se contrata o financia después de comparar opciones y condiciones.","example":"Elegís las tres medidas que caben en el presupuesto y que además podréis ensayar durante el tiempo disponible.","aliases":[],"games":["cartera"]},{"term":"ISO","definition":"Organización Internacional de Normalización, que publica normas acordadas entre especialistas y organismos nacionales. Una norma concreta tiene su propio número y alcance.","example":"ISO/IEC 27001 organiza un sistema de gestión de seguridad de la información; ISO 22301 se refiere a la gestión de continuidad. No son nombres de programas informáticos.","aliases":["ISO/IEC"],"games":[]},{"term":"CSRC","definition":"Computer Security Resource Center, el centro de recursos de seguridad informática del NIST. Reúne publicaciones y un glosario técnico.","example":"En las fuentes del juego, CSRC indica dónde se publica una guía o se puede comprobar el significado de un término.","aliases":[],"games":[]},{"term":"IR","definition":"Informe de la serie técnica del NIST. El número que lo acompaña permite localizar el documento concreto.","example":"NIST IR 8286 relaciona los riesgos de ciberseguridad con la gestión de riesgos de toda la organización.","aliases":[],"games":["cartera"]},{"term":"Catálogo","definition":"Servicio que permite localizar qué materiales tiene una biblioteca y dónde están.","example":"La abreviatura Cat. de una oferta indica cuánto podría reducir esa medida las interrupciones de este servicio.","aliases":["Cat."],"games":["cartera"]},{"term":"Accesos","definition":"Servicio que comprueba quién puede utilizar la sala o sus recursos.","example":"La abreviatura Acc. indica el efecto de una medida sobre este servicio. Comprobar una autorización es distinto de registrar un préstamo.","aliases":["Acc."],"games":["cartera"]},{"term":"Préstamos","definition":"Servicio que registra la salida y devolución de los materiales de la biblioteca.","example":"La abreviatura Prés. permite comparar las ofertas. Una sala abierta no asegura que la salida de un libro quede registrada.","aliases":["Prés."],"games":["cartera"]},{"term":"Identificador de prueba","definition":"Etiqueta que distingue una comprobación concreta. Varias etiquetas pueden corresponder a pruebas del mismo servicio.","example":"CAT-1 y CAT-2 son dos pruebas del catálogo, mientras que ACC-1 se refiere a accesos: tres documentos acreditan dos servicios distintos.","aliases":["CAT-1","CAT-2","ACC-1","PRE-1"],"games":["cartera","relevo"]},{"term":"Ciberataque","definition":"Acción intencionada contra sistemas, información o servicios digitales para acceder, alterar, interrumpir o causar otro perjuicio.","example":"Un ataque puede obligar a trabajar con registros manuales; la continuidad busca mantener el servicio esencial mientras se responde.","aliases":["ciberataques","cyber attack","cyber-attack"],"games":[]},{"term":"Ciberresiliencia","definition":"Capacidad de anticipar un problema digital, seguir prestando lo esencial mientras ocurre, recuperar el servicio y aprender para la próxima vez.","example":"Si falla el sistema de préstamos, la biblioteca mantiene una salida controlada en papel y después comprueba que los libros y el registro coinciden.","aliases":[],"games":[]},{"term":"BIA","definition":"Business Impact Analysis, o análisis de impacto en el negocio. Estudia qué actividades importan, qué daño produce interrumpirlas y cuánto tiempo puede tolerarse.","example":"En el puerto se transforma en un encargo concreto: sacar un mínimo de órdenes y todas las urgentes antes de que salga el barco.","aliases":["análisis de impacto en el negocio"],"games":[]}];

 currentIds=[id];content.replaceChildren();const h=el('h2',r.term);h.id='lex-heading';h.tabIndex=-1;content.append(h);

 if(r.example){const ex=el('p',undefined,'lex-example');ex.append(el('b','Ejemplo en la práctica'),document.createTextNode(r.example));content.append(ex);}

 const valid=[...new Set((ids||[]).filter(id=>byId.has(id)))];returnFocus=trigger||document.activeElement;
 history=[];currentIds=[];dialog.querySelector('#lex-back').hidden=true;
 if(valid.length===1)showDefinition(valid[0]);else showList(valid.length?valid:records.map(([id])=>id),valid.length?'Términos de este control':'Glosario del juego');
 if(!dialog.open)dialog.showModal();if(returnFocus?.setAttribute)returnFocus.setAttribute('aria-expanded','true');
 dialog.querySelector('#lex-close').focus({preventScroll:true});
}
function close(){dialog.close();}
dialog.querySelector('#lex-close').addEventListener('click',close);
dialog.querySelector('#lex-back').addEventListener('click',()=>{const id=history.pop();if(id)showDefinition(id,false)});
dialog.querySelector('#lex-all').addEventListener('click',()=>{showList(records.map(([id])=>id));search.focus({preventScroll:true});});
dialog.querySelector('#lex-size').addEventListener('click',()=>{isLarge=!isLarge;setSize();try{localStorage.setItem('continuidad.vocabulario.texto-grande',isLarge?'1':'0')}catch{}});
dialog.addEventListener('click',ev=>{const p=ev.target.closest('[data-lex-pick]');if(p){ev.preventDefault();showDefinition(p.dataset.lexPick)}else if(ev.target===dialog)close();});
dialog.addEventListener('cancel',ev=>{ev.preventDefault();close()});
dialog.addEventListener('keydown',ev=>{
 if(ev.key!=='Tab')return;
 const focusable=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(n=>!n.hidden&&n.getClientRects().length);
 if(!focusable.length){ev.preventDefault();return;}
 const first=focusable[0],last=focusable[focusable.length-1],active=document.activeElement;
 if(ev.shiftKey&&(active===first||!dialog.contains(active))){ev.preventDefault();last.focus()}
 else if(!ev.shiftKey&&(active===last||!dialog.contains(active))){ev.preventDefault();first.focus()}
});

dialog.addEventListener('close',()=>{if(returnFocus?.setAttribute)returnFocus.setAttribute('aria-expanded','false');if(returnFocus?.isConnected&&!returnFocus.disabled)returnFocus.focus({preventScroll:true});else document.querySelector('[data-lex-all]')?.focus({preventScroll:true})});
search.addEventListener('input',()=>{const q=normalize(search.value);const found=records.filter(([id,r])=>normalize(r.term+' '+r.aliases.join(' ')+' '+r.definition).includes(q)).map(([id])=>id);drawList(found);});
const legacyTerms='[data-term],[data-apply-term],[data-do="term"]';
function legacyId(node){return aliases.get(normalize(node.dataset.term||node.dataset.applyTerm||node.dataset.v||''));}
const ownSelector='#lex-dialog,#continuidad-vocabulary-style,.lex-reading-guide';
const excluded='script,style,code,pre,kbd,samp,input,textarea,option,select,svg,button,a,label,summary,noscript,#printArea,#report,#print,[data-apply-report],'+ownSelector;
function attachAccessibility(node,ids){node.dataset.lexIds=JSON.stringify(ids);node.setAttribute('aria-haspopup','dialog');node.setAttribute('aria-controls','lex-dialog');}
function enrich(){
 observer.disconnect();
 try{
  for(const node of document.querySelectorAll(legacyTerms)){
   if(node.closest(ownSelector))continue;const id=legacyId(node);if(!id)continue;node.classList.add('lex-term');attachAccessibility(node,[id]);
  }
  for(const b of document.querySelectorAll('#terms,#glos,[data-do="gloss"]')){b.dataset.lexAll='';b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-controls','lex-dialog');}
  // Inline prose remains text with a light dotted underline. Existing action
  // buttons retain their whole original action and get a separate help control.
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];let node;
  while((node=walker.nextNode()))if(node.parentElement&&!node.parentElement.closest(excluded)&&node.textContent.trim())nodes.push(node);
  for(const n of nodes){
   const found=matches(n.textContent);if(!found.length)continue;const fragment=document.createDocumentFragment();let at=0;
   for(const match of found){fragment.append(document.createTextNode(n.textContent.slice(at,match.index)));const b=el('button',match.text,'lex-term');b.type='button';attachAccessibility(b,[match.id]);b.setAttribute('aria-label','Explicar '+match.text);fragment.append(b);at=match.index+match.text.length;}
   fragment.append(document.createTextNode(n.textContent.slice(at)));n.replaceWith(fragment);
  }
  for(const s of document.querySelectorAll('svg text')){
   if(s.closest(ownSelector))continue;const ids=idsIn(s.textContent);if(!ids.length)continue;s.classList.add('lex-svg');s.setAttribute('role','button');s.setAttribute('tabindex','0');attachAccessibility(s,ids);s.setAttribute('aria-label','Explicar '+ids.map(id=>byId.get(id).term).join(', '));s.closest('svg')?.setAttribute('role','group');
  }
  const controls=[...document.querySelectorAll('button,a,label,summary,select')];
  for(const control of controls){
   if(control.closest(ownSelector+',#printArea,#report,#print,[data-apply-report]')||control.matches('.lex-term,.lex-help,[data-lex-all],[data-lex-ids],[data-lex-summary]')||control.closest('.lex-pair')||control.closest('button,a,label,summary,select')!==control)continue;
   const ids=idsIn(surfaceText(control)||control.getAttribute('aria-label')||'');if(!ids.length)continue;
   // Avoid duplicate help when a label already contains a genuine term button.
   if(control.querySelector('[data-lex-ids]'))continue;
   const help=el('button','?','lex-help');help.type='button';attachAccessibility(help,ids);help.setAttribute('aria-label','Explicar '+ids.map(id=>byId.get(id).term).join(', '));help.title='Consultar el significado sin ejecutar la orden';
   if(control.tagName==='SUMMARY'){control.dataset.lexSummary=JSON.stringify(ids);control.append(help)}else{const pair=el('span',undefined,'lex-pair');pair.style.flex=getComputedStyle(control).flex;control.before(pair);pair.append(control,help);}
  }
 }finally{observer.observe(document.body,{childList:true,subtree:true,characterData:true});}
}
let queued=false;const observer=new MutationObserver(records=>{
 if(records.every(r=>r.target.nodeType===1&&r.target.closest?.(ownSelector)))return;
 if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;enrich()})}
});
const guide=el('div',undefined,'lex-reading-guide');guide.id='lex-reading-guide';guide.setAttribute('role','note');guide.append(el('p','Palabras subrayadas: definición. El botón ? explica un control sin ejecutarlo.'));const find=el('button','Buscar una palabra');find.type='button';find.dataset.lexAll='';guide.append(find);
const header=document.querySelector('header')||document.querySelector('.head');if(header)header.after(guide);else document.body.prepend(guide);
document.addEventListener('click',ev=>{
 if(ev.target.closest('#lex-dialog'))return;
 const trigger=ev.target.closest('[data-lex-ids],[data-lex-all]');if(!trigger)return;
 ev.preventDefault();ev.stopImmediatePropagation();let ids=[];try{ids=JSON.parse(trigger.dataset.lexIds||'[]')}catch{}
 open(ids,trigger);
},true);
document.addEventListener('keydown',ev=>{
 const trigger=ev.target.closest('.lex-svg');if(!trigger||!['Enter',' '].includes(ev.key))return;ev.preventDefault();ev.stopImmediatePropagation();open(JSON.parse(trigger.dataset.lexIds),trigger);
},true);
document.addEventListener('change',()=>{if(!queued){queued=true;requestAnimationFrame(()=>{queued=false;enrich()})}});
function audit(){
 const counts={};const missing=[];const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while((n=w.nextNode())){
  const p=n.parentElement;if(!p||p.closest('script,style,code,pre,kbd,samp,input,textarea,option,noscript,#lex-dialog,#printArea,#report,#print,.lex-reading-guide,[data-apply-report]'))continue;
  for(const match of matches(n.textContent)){
   const covered=!!p.closest('[data-lex-ids],.lex-pair,[data-lex-summary]');const key=byId.get(match.id).term;counts[key]??={occurrences:0,covered:0};counts[key].occurrences++;if(covered)counts[key].covered++;else missing.push({term:key,text:n.textContent.trim().slice(0,160),tag:p.tagName});
  }
 }
 return {definitions:byId.size,terms:counts,missing};
}
enrich();
window.continuidadVocabulary={version:'2026-11-26',definitions:Object.fromEntries(records.map(([id,r])=>[r.term,r])),open:(term)=>open(term?[aliases.get(normalize(term))]:[]),refresh:enrich,audit};
})();

</script>
